 {s:"Das ist der Plan, ___ ich gezeichnet habe.",o:["den","der","dem"],why:"I drew it: object → Akkusativ den.",lv:"B1"},
 {s:"Die Frau, ___ ich das Buch gegeben habe, ist meine Kollegin.",o:["der","die","deren"],why:"I gave her the book: Dativ feminine der.",lv:"B1"},
 {s:"Das Haus, ___ wir gekauft haben, ist alt.",o:["das","dem","dessen"],why:"Object, neuter: das.",lv:"B1"},
 {s:"Die Kinder, mit ___ ich spiele, sind laut.",o:["denen","den","die"],why:"mit + Dativ plural: denen.",lv:"B1"},
 {s:"Der Kollege, ___ Büro neben meinem liegt, ist nett.",o:["dessen","deren","dem"],why:"His office, masculine: dessen.",lv:"B2"},
 {s:"Die Firma, für ___ ich arbeite, sitzt in Wien.",o:["die","der","deren"],why:"für + Akkusativ, feminine: die.",lv:"B1"},
 {s:"Das Pferd, auf ___ ich reite, heißt Luna.",o:["dem","das","den"],why:"Wo? auf + Dativ, neuter: dem.",lv:"B1"},
 {s:"Die Architektin, ___ Entwurf gewonnen hat, kommt aus Graz.",o:["deren","dessen","der"],why:"Her design, feminine: deren.",lv:"B2"},
 {s:"Wien ist die Stadt, ___ ich am liebsten wohne.",o:["in der","in die","in den"],why:"Wo? in + Dativ, feminine: in der.",lv:"B1"},
 {s:"Alles, ___ du sagst, stimmt.",o:["was","das","dem"],why:"After alles: was.",lv:"B2"},
 {s:"Das ist das Beste, ___ ich je gegessen habe.",o:["was","das","dem"],why:"After a superlative: was.",lv:"B2"},
 {s:"Die Pläne, ___ du mir geschickt hast, sind gut.",o:["die","denen","der"],why:"Object, plural: die.",lv:"B1"},
 {s:"Ich danke den Kollegen, ___ mir geholfen haben.",o:["die","denen","den"],why:"They helped: subject, plural → die.",lv:"B1"},
 {s:"Kennst du den Mann, ___ du geholfen hast?",o:["dem","den","der"],why:"helfen + Dativ: dem.",lv:"B1"},
 {s:"Das Projekt, an ___ wir arbeiten, ist groß.",o:["dem","das","den"],why:"arbeiten an + Dativ, neuter: dem.",lv:"B2"}],
 th:`<div class="tc df"><h3>Alle Relativpronomen</h3>${RELT}<p class="tline">Pale cells are the only new forms. Everything else is the definite article.</p></div>
<div class="tc df"><h3>Zwei Fragen</h3>${D("die Frau~x|,~p|der~d|ich|helfe~v","0-2a:Genus;2-4b:Fall@d")}<div class="rows"><div><span>1 · Genus</span><span>from the noun it refers to: die Frau → feminine</span></div><div><span>2 · Fall</span><span>from its job in the relative clause: ich helfe ihr → Dativ der</span></div></div></div>
<div class="tc df"><h3>Mit Präposition</h3><div class="rows">
<div><span>Wo?</span><span>das Haus, in dem ich wohne</span></div>
<div><span>Wohin?</span><span>das Haus, in das wir ziehen</span></div>
<div><span>Verb + Präp.</span><span>die Firma, für die ich arbeite · der Termin, an den ich denke</span></div></div><p class="tline">The preposition always comes first. English “the house I live in” has no equivalent.</p></div>
<div class="tc df"><h3>dessen · deren</h3><div class="rows">
<div><span>dessen</span><span>der Kollege, dessen Büro … · das Haus, dessen Dach …</span></div>
<div><span>deren</span><span>die Kollegin, deren Entwurf … · die Pferde, deren Stall …</span></div></div><p class="tline">After dessen and deren, adjectives take the endings with no article: dessen neues Büro.</p></div>
<div class="tc df"><h3>was · wo · wer</h3><div class="rows">
<div><span>was</span><span>after alles, nichts, etwas, vieles, das, superlatives: alles, was ich weiß</span></div>
<div><span>was</span><span>for a whole clause: Er kam pünktlich, was mich freute.</span></div>
<div><span>wo</span><span>places and times: die Stadt, wo … · der Tag, an dem / wo …</span></div>
<div><span>wer</span><span>general: Wer zu spät kommt, muss warten.</span></div></div></div>`};

/* ===== Passiv ===== */
const PAKT=`<div class="pas">${D("Der Mechaniker~s|repariert~v|das Auto~a|.~p","","Aktiv")}<div class="parr">↓ <small>Akkusativ-Objekt wird Subjekt</small></div>${D("Das Auto~s|wird~v|vom Mechaniker|repariert~v|.~p","1-3a:werden + Partizip II","Passiv")}</div>`;
GT.pass={name:"Passiv",badge:"Passiv",tip:"Passiv = werden + Partizip II. Perfekt uses worden, not geworden.",src:["grammis","dg20","umich"],
 lg:'<span><b class="wt v lgk">wird</b> … <b class="wt v lgk">repariert</b> Satzklammer</span>',
 cards:[
 {b:"Aktiv → Passiv",st:PAKT,tx:"The action matters, not the doer",gt:"The Akkusativ object becomes the subject. The doer is optional: von + Dativ (persons), durch (causes, means).",say:"Der Mechaniker repariert das Auto. Das Auto wird vom Mechaniker repariert."},
 {b:"Präteritum",st:D("Das Haus~s|wurde~v|1912|gebaut~v|.~p","1-3a:wurde + Partizip"),tx:"Präteritum: wurde",gt:"The most common written form, for history, reports, reviews.",say:"Das Haus wurde 1912 gebaut."},
 {b:"Perfekt",st:D("Das Paket~s|ist~v|heute früh|geliefert worden~v|.~p","1-3a:ist … worden"),tx:"Perfekt: ist + Partizip + worden",gt:"In the passive, worden replaces geworden.",say:"Das Paket ist heute früh geliefert worden."},
 {b:"Modalverb",st:D("Die Rechnung~s|muss~v|bis Freitag|bezahlt werden~v|.~p","1-3a:Modalverb … Partizip + werden"),tx:"Modalverb + Partizip II + werden",gt:"muss gemacht werden, kann gelöst werden, darf nicht geraucht werden.",say:"Die Rechnung muss bis Freitag bezahlt werden."},
 {b:"Nebensatz",st:D("…, weil~k|die Pläne|noch|geprüft werden~v|müssen~v|.~p","0-4a:alles ans Ende"),tx:"In a Nebensatz everything goes to the end",gt:"Order at the end: Partizip, werden, Modalverb.",say:"weil die Pläne noch geprüft werden müssen"},
 {b:"Zustand",st:D("Die Tür~s|ist~v|seit Stunden|geschlossen~v|.~p","1-3a:Zustand")+D("Die Tür~s|wird~v|um acht|geschlossen~v|.~p","1-3a:Vorgang"),tx:"sein-Passiv: the result",gt:"wird geschlossen = someone closes it now. ist geschlossen = it is closed (state)."},
 {b:"Dativ bleibt",st:D("Dem Patienten~d|wird~v|sofort|geholfen~v|.~p","1-3a:Passiv;0-1b:Dativ bleibt Dativ@d"),tx:"Only the Akkusativ becomes the subject",gt:"A Dativ stays Dativ, and with no subject the verb is singular: Mir wurde gesagt, … · Hier wird nicht geraucht.",say:"Dem Patienten wird sofort geholfen."},
 {b:"Ersatzformen",st:ruleSt("Das lässt sich lösen.",["Das ist zu prüfen.","Das ist machbar.","Man prüft das."]),tx:"Other ways to say it (C1)",gt:"sich lassen + Infinitiv = can be done. sein + zu = must or can be done. -bar = can be done. man = someone."}],
 q:[
 {s:"Das Auto ___ in der Werkstatt repariert.",o:["wird","hat","wurden"],why:"Passiv Präsens: wird + Partizip II. Singular subject.",lv:"B1"},
 {s:"Das Haus ___ 1912 gebaut.",o:["wurde","hatte","worden"],why:"Passiv Präteritum: wurde + Partizip II.",lv:"B1"},
 {s:"Das Paket ist heute früh geliefert ___.",o:["worden","geworden","werden"],why:"Passiv Perfekt: worden, not geworden.",lv:"B2"},
 {s:"Die Rechnung muss bis Freitag bezahlt ___.",o:["werden","worden","wird"],why:"Modalverb + Partizip II + werden.",lv:"B1"},
 {s:"Die Ergebnisse ___ morgen veröffentlicht.",o:["werden","wurden","worden"],why:"Plural, future meaning with morgen: werden.",lv:"B1"},
 {s:"Der Plan wurde ___ der Architektin gezeichnet.",o:["von","durch","mit"],why:"A person as the doer: von + Dativ.",lv:"B1"},
 {s:"Das Dorf wurde ___ das Hochwasser zerstört.",o:["durch","von","mit"],why:"A cause, with Akkusativ das: durch.",lv:"B2"},
 {s:"Dem Patienten ___ sofort geholfen.",o:["wird","werden","wurden"],why:"No subject (Dativ stays): verb singular.",lv:"B2"},
 {s:"Hier ___ nicht geraucht.",o:["wird","ist","hat"],why:"Impersonal passive: wird + Partizip.",lv:"B1"},
 {s:"Ich weiß, dass hier viel gearbeitet ___.",o:["wird","worden","werden"],why:"Nebensatz: Partizip, then wird at the end.",lv:"B2"},
 {s:"Wir warten, weil die Unterlagen noch unterschrieben werden ___.",o:["müssen","muss","gemusst"],why:"Plural subject, modal verb last.",lv:"C1"},
 {s:"Das Problem lässt sich leicht ___.",o:["lösen","gelöst","löst"],why:"sich lassen + Infinitiv.",lv:"C1"},
 {s:"Der Antrag ist bis Montag ___ prüfen.",o:["zu","um zu","für"],why:"sein + zu + Infinitiv = muss geprüft werden.",lv:"C1"},
 {s:"Das Material ist ___. (Man kann es recyceln.)",o:["recycelbar","recycelt","recyceln"],why:"-bar = can be done.",lv:"C1"},
 {s:"Man baut hier ein neues Haus. → Hier ___ ein neues Haus gebaut.",o:["wird","werden","wurde"],why:"Same tense as the Aktiv (Präsens), singular: wird.",lv:"B1"},
 {s:"Die Fenster ___ gestern geputzt.",o:["wurden","wurde","worden"],why:"Plural, Präteritum: wurden.",lv:"B1"},
 {s:"Das Gebäude war damals schon renoviert ___.",o:["worden","geworden","werden"],why:"Plusquamperfekt Passiv: war … worden.",lv:"C1"}],
 th:`<div class="tc df"><h3>Aktiv und Passiv</h3>${PAKT}</div>
<div class="tc df"><h3>Alle Zeiten</h3><div class="rows">
<div><span>Präsens</span><span>Das Haus <b>wird</b> gebaut.</span></div>
<div><span>Präteritum</span><span>Das Haus <b>wurde</b> gebaut.</span></div>
<div><span>Perfekt</span><span>Das Haus <b>ist</b> gebaut <b>worden</b>.</span></div>
<div><span>Plusquamperf.</span><span>Das Haus <b>war</b> gebaut <b>worden</b>.</span></div>
<div><span>Futur</span><span>Das Haus <b>wird</b> gebaut <b>werden</b>.</span></div>
<div><span>Modalverb</span><span>Das Haus <b>muss</b> gebaut <b>werden</b>.</span></div></div></div>
<div class="tc df"><h3>von oder durch?</h3><div class="rows"><div><span>von + Dat</span><span>the doer, usually a person or institution: von der Stadt geplant</span></div><div><span>durch + Akk</span><span>a cause or means: durch das Hochwasser zerstört, durch einen Boten zugestellt</span></div></div></div>
<div class="tc df"><h3>Vorgang oder Zustand</h3><div class="rows"><div><span>werden</span><span>process: Die Tür wird geschlossen.</span></div><div><span>sein</span><span>result: Die Tür ist geschlossen. · Der Tisch ist gedeckt.</span></div></div></div>
<div class="tc df"><h3>Ohne Subjekt</h3>${D("Mir~d|wurde~v|gesagt~v|,~p|dass …","0-1b:Dativ bleibt@d")}<p class="tline">Dem Patienten wird geholfen. · Hier wird gearbeitet. · Es wird getanzt. The verb is always singular.</p></div>
<div class="tc df"><h3>Ersatzformen <small>C1</small></h3><div class="rows">
<div><span>sich lassen</span><span>Das Problem lässt sich lösen. = kann gelöst werden</span></div>
<div><span>sein + zu</span><span>Der Antrag ist bis Montag zu prüfen. = muss geprüft werden</span></div>
<div><span>-bar / -lich</span><span>machbar, lösbar, erklärlich = kann gemacht werden</span></div>
<div><span>man</span><span>Man prüft den Antrag. = Der Antrag wird geprüft.</span></div></div></div>`};

/* ===== Konjunktiv II ===== */
const K2F=["sein → wäre","haben → hätte","werden → würde","können → könnte","müssen → müsste","dürfen → dürfte","sollen → sollte","wollen → wollte","wissen → wüsste","kommen → käme","gehen → ginge","geben → gäbe"];
GT.k2={name:"Konjunktiv II",badge:"Konjunktiv II",tip:"Most verbs: würde + Infinitiv. Learn the dozen own forms: wäre, hätte, könnte, müsste …",src:["grammis","dg20","lingolia"],
 lg:'<span><b class="wt v lgk">würde</b> … <b class="wt v lgk">zeichnen</b></span>',
 cards:[
 {b:"Irreal",st:D("Wenn~k|ich|Zeit|hätte~v|,~p|würde~v|ich|mehr|zeichnen~v|.~p","0-3a:Verb ans Ende;5-8a:würde + Infinitiv"),tx:"What isn't real (yet)",gt:"I don't have time. If I had, I would draw more.",say:"Wenn ich Zeit hätte, würde ich mehr zeichnen."},
 {b:"Formen",st:ruleSt("würde + Infinitiv",K2F.slice(0,6)),tx:"würde for most verbs, own forms for a few",gt:"Own forms: wäre, hätte, the modals, and in writing wüsste, käme, ginge, gäbe."},
 {b:"Höflich",st:ruleSt("Könnten Sie mir helfen?",["Ich hätte gern einen Kaffee.","Würden Sie bitte die Tür schließen?","Wäre es möglich, …?"]),tx:"Polite requests",gt:"Standard in shops, letters and at work."},
 {b:"Wunsch · Rat",st:ruleSt("Wenn ich doch mehr Zeit hätte!",["Ich wünschte, ich wäre in Glasgow.","An deiner Stelle würde ich …","Du solltest mehr schlafen."]),tx:"Wishes and advice",gt:"doch or nur make the wish stronger."},
 {b:"Vergangenheit",st:D("Wenn~k|ich|das|gewusst hätte~v|,~p|wäre~v|ich|gekommen~v|.~p","0-3a:Ende;5-7a:wäre + Partizip"),tx:"hätte / wäre + Partizip II",gt:"For the past there is no würde: Ich hätte es gemacht. Ich wäre gekommen.",say:"Wenn ich das gewusst hätte, wäre ich gekommen."},
 {b:"Modal + Vergangenheit",st:D("Ich~s|hätte~v|früher|kommen sollen~v|.~p","1-3a:hätte … Infinitiv + Modalverb"),tx:"hätte + two infinitives (C1)",gt:"Ich hätte früher kommen sollen = I should have come earlier. Not: gesollt.",say:"Ich hätte früher kommen sollen."},
 {b:"ohne wenn",st:D("Hätte~v|ich|Zeit|,~p|würde~v|ich~s|kommen~v|.~p","0-1b:Verb zuerst = wenn@g"),tx:"Verb first replaces wenn",gt:"Hätte ich Zeit, … = Wenn ich Zeit hätte, … Common in writing.",say:"Hätte ich Zeit, würde ich kommen."},
 {b:"als ob",st:ruleSt("Er tut so, als ob er nichts wüsste.",["Er tut so, als wüsste er nichts.","Es sieht aus, als würde es regnen."]),tx:"als ob, als: as if",gt:"With als alone, the verb comes straight after it."}],
 q:[

 {s:"Wenn ich du ___, würde ich das Angebot annehmen.",o:["wäre","bin","war"],why:"Unreal: wäre.",lv:"B1"},

 {s:"Wenn ich das gewusst ___, wäre ich gekommen.",o:["hätte","habe","wäre"],why:"Past unreal: hätte + Partizip (wissen takes haben).",lv:"B2"},

 {s:"Ich wünschte, ich ___ mehr Zeit.",o:["hätte","habe","hatte"],why:"Wish: hätte.",lv:"B1"},

 {s:"Es ___ schön, wenn du mitkommst.",o:["wäre","war","würde"],why:"Konjunktiv II of sein: wäre.",lv:"B1"},

 {s:"___ es möglich, den Termin zu verschieben?",o:["Wäre","War","Würde"],why:"Polite: Wäre es möglich …?",lv:"B1"}],
 th:`<div class="tc df"><h3>Formen</h3><div class="pcs">${K2F.map(w=>'<span class="pc">'+w+'</span>').join("")}</div><p class="memo">All other verbs: <b>würde + Infinitiv</b>. ich würde, du würdest, er würde, wir würden.</p></div>
<div class="tc df"><h3>Wofür?</h3><div class="rows">
<div><span>irreal</span><span>Wenn ich Zeit hätte, würde ich kommen.</span></div>
<div><span>höflich</span><span>Könnten Sie …? · Ich hätte gern … · Würden Sie bitte …?</span></div>
<div><span>Wunsch</span><span>Wenn ich doch … hätte! · Ich wünschte, …</span></div>
<div><span>Rat</span><span>Du solltest … · An deiner Stelle würde ich …</span></div>
<div><span>Vermutung</span><span>Das dürfte stimmen. · Er müsste schon da sein.</span></div></div></div>
<div class="tc df"><h3>Vergangenheit</h3>${D("hätte~v|… gemacht~v","0-1a:haben-Verben")}${D("wäre~v|… gekommen~v","0-1a:sein-Verben")}<p class="tline">Same choice of haben or sein as in the Perfekt. With a modal: hätte … machen müssen.</p></div>
<div class="tc df"><h3>wenn-Sätze</h3><div class="rows">
<div><span>real</span><span>Wenn ich Zeit habe, komme ich. (possible)</span></div>
<div><span>irreal jetzt</span><span>Wenn ich Zeit hätte, käme ich / würde ich kommen.</span></div>
<div><span>irreal früher</span><span>Wenn ich Zeit gehabt hätte, wäre ich gekommen.</span></div>
<div><span>ohne wenn</span><span>Hätte ich Zeit, würde ich kommen.</span></div></div></div>
<div class="tc df"><h3>als ob · als</h3><p class="ex">Er tut so, als ob er nichts wüsste. · Er tut so, als wüsste er nichts.</p><p class="tline">With als alone, the verb comes straight after it.</p></div>`};

 {s:"Er sagt, er ___ das nicht. (wissen)",o:["wisse","weiß","wusste"],why:"Konjunktiv I of wissen: wisse.",lv:"C1"}],
 th:`<div class="tc df"><h3>Wofür?</h3><p>Konjunktiv I marks reported speech: news, reports, minutes, academic texts. In everyday speech Germans and Austrians mostly use the Indikativ or Konjunktiv II.</p>${D("Er sagt,|er~s|sei~v|krank|.~p","1-2a:berichtet")}</div>
<div class="tc df"><h3>Formen</h3><div class="ptab"><span class="h">Person</span><span class="h">sein</span><span class="h">haben / kommen</span>${[["ich","sei","habe* / komme*"],["du","seist","habest / kommest"],["er, sie, es","sei","habe / komme"],["wir","seien","haben* / kommen*"],["ihr","seiet","habet / kommet"],["sie, Sie","seien","haben* / kommen*"]].map(r=>r.map(c=>'<span>'+c+'</span>').join("")).join("")}</div><p class="tline">* same as the Indikativ → use Konjunktiv II: hätte, käme.</p></div>
<div class="tc df"><h3>Die Ersatzregel</h3><p class="memo">Konjunktiv I = Indikativ? → <b>Konjunktiv II</b>. Konjunktiv II = Präteritum? → <b>würde + Infinitiv</b>.</p><p class="tline">sie kommen → sie kämen · sie arbeiten (Konj. I) = sie arbeiteten (Konj. II looks like Präteritum) → sie würden arbeiten.</p></div>
<div class="tc df"><h3>Zeiten</h3><div class="rows">
<div><span>Gegenwart</span><span>Er sagt, er komme / sei krank.</span></div>
<div><span>Vergangenheit</span><span>Er sagt, er sei gekommen / habe es gewusst.</span></div>
<div><span>Zukunft</span><span>Er sagt, er werde kommen.</span></div></div><p class="tline">The tense of the reporting verb (sagt, sagte) does not matter.</p></div>
<div class="tc df"><h3>Direkt → indirekt</h3><div class="rows">
<div><span>Aussage</span><span>„Ich komme.“ → Sie sagt, sie komme.</span></div>
<div><span>Ja/Nein-Frage</span><span>„Kommst du?“ → Er fragt, ob ich komme.</span></div>
<div><span>W-Frage</span><span>„Wann kommst du?“ → Er fragt, wann ich komme.</span></div>
<div><span>Befehl</span><span>„Warte!“ → Er sagt, ich solle warten. · höflich: möge</span></div>
<div><span>Zeit, Ort</span><span>heute → an diesem Tag · morgen → am nächsten Tag · hier → dort</span></div></div></div>`};

 {b:"Lesen",st:D("die~x|seit Jahren|von vielen Architekten|kritisierte~a|Fassade~x","0-4a:1 · Rahmen;3-4b:2 · Partizip;1-3b:3 · Rest@g"),tx:"How to read long attributes",gt:"1. Article and noun: die Fassade. 2. The participle before the noun: kritisierte. 3. The rest: von vielen Architekten, seit Jahren."},

 q:[
 {s:"die Preise, die steigen → die ___ Preise",o:["steigenden","gestiegenen","steigende"],why:"Active, now: Partizip I steigend, ending -en after die (plural).",lv:"C1"},
 {s:"das Haus, das renoviert wurde → das ___ Haus",o:["renovierte","renovierende","renoviertes"],why:"Passive, finished: Partizip II, -e after das.",lv:"C1"},

 {s:"ein Kind, das schläft → ein ___ Kind",o:["schlafendes","geschlafenes","schlafende"],why:"Partizip I, -es after ein (neuter).",lv:"B2"},
 {s:"die Brücke, die die Stadt plant → die von der Stadt ___ Brücke",o:["geplante","planende","geplanten"],why:"The bridge is planned: Partizip II, -e after die (feminine singular).",lv:"C1"},
 {s:"Weil es regnete, … → ___ des Regens …",o:["Wegen","Trotz","Während"],why:"weil → wegen + Genitiv.",lv:"B2"},

 {s:"Nachdem er angekommen war, … → Nach seiner ___ …",o:["Ankunft","Ankommen","Angekommen"],why:"ankommen → die Ankunft.",lv:"C1"},
 {s:"um das Haus zu renovieren → zur ___ des Hauses",o:["Renovierung","Renovieren","Renoviert"],why:"renovieren → die Renovierung; um … zu → zur.",lv:"C1"},
 {s:"Wenn es regnet, … → ___ Regen …",o:["Bei","Wegen","Mit"],why:"wenn → bei + Dativ.",lv:"C1"},
 {s:"Während wir planten, … → Während der ___ …",o:["Planung","Planen","Plan"],why:"planen → die Planung.",lv:"C1"},
 {s:"Bevor das Projekt beginnt, … → Vor ___ des Projekts …",o:["Beginn","Beginnen","Begonnen"],why:"beginnen → der Beginn; vor Beginn.",lv:"C1"},
 {s:"die Gäste, die warten → die ___ Gäste",o:["wartenden","gewarteten","wartende"],why:"Partizip I, -en after die (plural).",lv:"B2"},
 {s:"der Sattel, der gestohlen wurde → der ___ Sattel",o:["gestohlene","stehlende","gestohlenen"],why:"Partizip II, -e after der (Nominativ).",lv:"B2"}],
 th:`<div class="tc df"><h3>Partizipialattribut lesen</h3>${D("die~x|seit Jahren|kritisierte~a|Fassade~x","0-3a:Rahmen;2-3b:Partizip@a")}<div class="rows"><div><span>1</span><span>Article + noun: die Fassade</span></div><div><span>2</span><span>Participle before the noun: kritisierte</span></div><div><span>3</span><span>The rest, backwards: seit Jahren</span></div></div><p class="tline">= die Fassade, die seit Jahren kritisiert wird</p></div>
<div class="tc df"><h3>Partizip I und II</h3><div class="rows"><div><span>Partizip I</span><span>Infinitiv + d · active, at the same time: die steigenden Preise, ein schlafendes Kind</span></div><div><span>Partizip II</span><span>passive or finished: das renovierte Haus, die abgeschlossene Planung</span></div><div><span>zu + Partizip I</span><span>must / can be done: die zu prüfenden Unterlagen, ein nicht zu unterschätzendes Risiko</span></div></div><p class="tline">The participle takes normal adjective endings.</p></div>
<div class="tc df"><h3>Nebensatz → Nomen</h3><div class="rows">
<div><span>weil</span><span>wegen / aufgrund + Gen: wegen des Regens</span></div>
<div><span>obwohl</span><span>trotz + Gen: trotz der Kälte</span></div>
<div><span>wenn</span><span>bei + Dat: bei Regen</span></div>
<div><span>nachdem</span><span>nach + Dat: nach seiner Ankunft</span></div>
<div><span>bevor</span><span>vor + Dat: vor Beginn des Projekts</span></div>
<div><span>während</span><span>während + Gen: während der Planung</span></div>
<div><span>um … zu</span><span>zu / zur / zum: zur Renovierung des Hauses</span></div>
<div><span>dass</span><span>Nomen: Er bestätigte, dass er kommt → Er bestätigte sein Kommen.</span></div></div></div>
<div class="tc df"><h3>Wie aus Verben Nomen werden</h3><div class="rows">
<div><span>-ung</span><span>planen → die Planung, prüfen → die Prüfung, renovieren → die Renovierung</span></div>
<div><span>Infinitiv</span><span>das Reiten, das Zeichnen, das Kommen</span></div>
<div><span>Stamm</span><span>beginnen → der Beginn, ankommen → die Ankunft, abfahren → die Abfahrt</span></div>
<div><span>-e / -nis</span><span>suchen → die Suche, ergeben → das Ergebnis</span></div></div></div>`};

GT.neg={name:"Verneinung",badge:"nicht · kein",tip:"First ask: is it a noun with ein or no article? Then kein. Everything else: nicht.",src:["grammis","lingolia","dwds"],
 lg:'<span><b class="wt ng lgk">nicht</b> Verneinung</span><span><b class="wt v lgk">Verb</b> Satzklammer</span>',
 cards:[
 {b:"kein",st:D("Ich~s|habe~v|kein~ng|Auto|.~p","2-3a:kein + Nomen"),tx:"kein = nicht + ein",gt:"A noun with <b>ein</b>, or with no article at all, is negated with <b>kein</b>. English: no, not a.",say:"Ich habe kein Auto."},
 {b:"Endungen",st:D("Ich~s|trinke~v|keinen~ng|Kaffee~a|.~p","2-3a:Akkusativ mask."),tx:"kein takes the endings of ein",gt:"Kaffee → keinen Kaffee. Unlike ein, kein has a plural: <b>keine</b> Pläne.",say:"Ich trinke keinen Kaffee."},
 {b:"nicht",st:D("Ich~s|kenne~v|den Mann~a|nicht~ng|.~p"),tx:"der · mein · Namen → nicht",gt:"With a definite article, a possessive (mein, dein …) or a name, use <b>nicht</b>. Das ist nicht mein Auto.",say:"Ich kenne den Mann nicht."},
 {b:"Ganzer Satz",st:D("Ich~s|habe~v|den Plan|nicht~ng|gesehen~v|.~p","1-4a:Satzklammer"),tx:"nicht before Verb 2",gt:"To negate the whole sentence, <b>nicht</b> goes as late as possible, but before the second part of the bracket.",say:"Ich habe den Plan nicht gesehen."},
 {b:"Trennbar",st:D("Ich~s|rufe~v|dich|morgen|nicht~ng|an~v|.~p","1-5a:Satzklammer"),tx:"nicht before the prefix",gt:"The prefix closes the bracket, so <b>nicht</b> comes just before it. Time words like morgen come before nicht.",say:"Ich rufe dich morgen nicht an."},
 {b:"Adjektiv",st:D("Das Haus~s|ist~v|nicht~ng|groß|.~p","2-3b:vor dem Adjektiv"),tx:"nicht + adjective",gt:"<b>nicht</b> stands directly before an adjective or an adverb of manner: nicht groß, nicht gut, nicht schnell.",say:"Das Haus ist nicht groß."},
 {b:"Ort · Richtung",st:D("Ich~s|fahre~v|heute|nicht~ng|nach Wien|.~p","3-4b:vor der Richtung"),tx:"nicht before place and direction",gt:"<b>nicht</b> goes before a phrase of place or direction: nicht nach Wien, nicht im Büro.",say:"Ich fahre heute nicht nach Wien."},
 {b:"sondern",st:D("Nicht~ng|ich~s|war~v|das,|sondern~k|Anna|.~p","0-1a:nur dieser Teil"),tx:"nicht X, sondern Y",gt:"To negate one part only, put <b>nicht</b> directly before it and give the correction with <b>sondern</b>.",say:"Nicht ich war das, sondern Anna."}],
 q:[
 {s:"Ich habe ___ Zeit.",o:["keine","nicht","kein"],why:"Zeit is feminine with no article: keine Zeit.",lv:"A1"},
 {s:"Das ist ___ mein Auto.",o:["nicht","kein","keine"],why:"A possessive (mein) is negated with nicht.",lv:"A1"},
 {s:"Ich trinke ___ Kaffee.",o:["keinen","kein","nicht"],why:"Kaffee is masculine, Akkusativ, no article: keinen.",lv:"A1"},
 {s:"Er ist heute ___ müde.",o:["nicht","kein","keine"],why:"An adjective is negated with nicht.",lv:"A1"},
 {s:"Wir haben ___ Kinder.",o:["keine","keinen","nicht"],why:"Plural without article: keine.",lv:"A1"},
 {s:"Ich habe ___ Lust.",o:["keine","kein","nicht"],why:"Lust is feminine: keine Lust.",lv:"A2"},
 {s:"Hast du ___ Hunger?",o:["keinen","kein","nicht"],why:"Hunger is masculine, Akkusativ: keinen.",lv:"A2"},
 {s:"Das ist ___ gute Idee.",o:["keine","nicht","kein"],why:"eine gute Idee → keine gute Idee.",lv:"A2"},
 {s:"Ich kenne den Architekten ___.",o:["nicht","kein","keinen"],why:"Definite article (den): nicht, at the end.",lv:"A2"},
 {s:"Ich habe den Plan ___.",o:["nicht gesehen","gesehen nicht","kein gesehen"],why:"nicht comes before Verb 2 (gesehen).",lv:"A2"},
 {s:"Sie hat das Formular ___.",o:["nicht ausgefüllt","ausgefüllt nicht","kein ausgefüllt"],why:"nicht before the Partizip at the end.",lv:"A2"},
 {s:"Ich rufe dich morgen ___.",o:["nicht an","an nicht","kein an"],why:"nicht comes before the separable prefix an.",lv:"A2"},
 {s:"Wir fahren heute ___.",o:["nicht nach Graz","nach Graz nicht","kein nach Graz"],why:"nicht stands before a direction.",lv:"A2"},
 {s:"Ich habe ___ Auto, sondern ein Fahrrad.",o:["kein","nicht","keine"],why:"ein Auto → kein Auto; sondern gives the correction.",lv:"A2"},
 {s:"Nicht ich habe das gemacht, ___ Anna.",o:["sondern","aber","oder"],why:"After a negation, the correction comes with sondern.",lv:"A2"},
 {s:"„Hast du keine Zeit?“ – „___, ich habe Zeit.“",o:["Doch","Ja","Nein"],why:"Saying yes to a negative question: doch.",lv:"A2"},
 {s:"Ich habe heute noch ___ gegessen.",o:["nichts","nicht","kein"],why:"nothing = nichts.",lv:"A2"},
 {s:"Er hat ___ Geld mehr.",o:["kein","keine","nicht"],why:"Geld is neuter: kein Geld mehr = no more money.",lv:"B1"},
 {s:"Das Problem ist ___ gelöst.",o:["noch nicht","noch kein","nicht noch"],why:"not yet = noch nicht.",lv:"B1"},
 {s:"Er kommt weder heute ___ morgen.",o:["noch","oder","nicht"],why:"Fixed pair: weder … noch = neither … nor.",lv:"B1"},
 {s:"Wir brauchen ___ neuen Pläne.",o:["keine","keinen","nicht"],why:"Plural Akkusativ: keine (and the adjective takes -en).",lv:"B1"}],
 th:`<div class="tc df"><h3>nicht oder kein? <small>A1</small></h3><p class="tline"><b>kein</b> = no, not a · <b>nicht</b> = not. English says „not“ for both.</p>
<div class="nt"><div class="hd"><span>Verneint wird</span><span>Wort</span><span>Beispiel</span></div>
<div><span>Nomen mit <i>ein</i> oder ohne Artikel</span><span class="k">kein</span><span>Ich habe <b>kein</b> Auto.<br>Ich trinke <b>keinen</b> Kaffee.</span></div>
<div><span>alles andere: Verb, Adjektiv, <i>der</i>, <i>mein</i>, Namen</span><span class="g">nicht</span><span>Ich kenne den Mann <b>nicht</b>.<br>Das ist <b>nicht</b> mein Auto.<br>Er ist <b>nicht</b> müde.</span></div></div></div>
<div class="tc df"><h3>Wo steht nicht? <small>A2</small></h3>${D("Ich~s|habe~v|den Plan|nicht~ng|gesehen~v|.~p","1-4a:Satzklammer")}<p class="tline">Whole sentence: as late as possible, but before Verb 2.</p>
<div class="nt" style="--nc:8.2em minmax(0,1fr)"><div class="hd"><span>nicht steht …</span><span>Beispiel</span></div>
<div><span>vor Verb 2</span><span>Ich habe ihn <b>nicht</b> gefragt.</span></div>
<div><span>vor dem Präfix</span><span>Ich rufe dich <b>nicht</b> an.</span></div>
<div><span>vor dem Adjektiv</span><span>Das Haus ist <b>nicht</b> groß.</span></div>
<div><span>vor Ort, Richtung</span><span>Ich fahre <b>nicht</b> nach Wien.</span></div>
<div><span>nach Zeit, Objekt</span><span>Ich sehe ihn heute <b>nicht</b>.</span></div></div></div>
<div class="tc df"><h3>kein · Formen <small>A1–A2</small></h3><div class="box" role="img" aria-label="kein nach Fall und Genus">
<span class="bh"></span><span class="bh">mask.</span><span class="bh">neutr.</span><span class="bh">fem.</span><span class="bh">Plural</span>
<span class="bl" style="grid-row:2">Nom</span><span class="bl" style="grid-row:3">Akk</span><span class="bl" style="grid-row:4">Dat</span><span class="bl" style="grid-row:5">Gen</span>
<b class="c nom" style="grid-area:2/2/3/3">kein</b><b class="c akk" style="grid-area:3/2/4/3">keinen</b>
<b class="c same" style="grid-area:2/3/4/4">kein</b><b class="c same" style="grid-area:2/4/4/5">keine</b><b class="c same" style="grid-area:2/5/4/6">keine</b>
<b class="c dat" style="grid-area:4/2/5/4">keinem</b><b class="c dat" style="grid-area:4/4/5/5">keiner</b><b class="c dat" style="grid-area:4/5/5/6">keinen <small>+n</small></b>
<b class="c gen" style="grid-area:5/2/6/4">keines</b><b class="c gen" style="grid-area:5/4/6/6">keiner</b></div>
<p class="tline">Like ein, plus a plural. Only <b>keinen</b> (Akk. mask.) differs from the Nominativ.</p></div>
<div class="tc df"><h3>doch, nichts, nie <small>A2</small></h3>
<div class="nt" style="--nc:6.4em 6em minmax(0,1fr)"><div class="hd"><span>Wort</span><span>English</span><span>Beispiel</span></div>
<div><span class="k">doch</span><span>yes (after a no)</span><span>Kommst du nicht? – <b>Doch!</b></span></div>
<div><span class="g">nichts</span><span>nothing</span><span>Ich habe <b>nichts</b> gehört.</span></div>
<div><span class="g">nie</span><span>never</span><span>Er ist <b>nie</b> pünktlich.</span></div>
<div><span class="g">niemand</span><span>nobody</span><span><b>Niemand</b> hat angerufen.</span></div>
<div><span class="g">nirgends</span><span>nowhere</span><span>Ich finde den Schlüssel <b>nirgends</b>.</span></div>
<div><span class="g">noch nicht</span><span>not yet</span><span>Der Plan ist <b>noch nicht</b> fertig.</span></div>
<div><span class="g">nicht mehr</span><span>no longer</span><span>Sie wohnt <b>nicht mehr</b> in Graz.</span></div>
<div><span class="g">kein … mehr</span><span>no more</span><span>Ich habe <b>keine</b> Zeit <b>mehr</b>.</span></div></div></div>
<div class="tc df"><h3>sondern · weder … noch <small>B1</small></h3>
<div class="nt" style="--nc:8.2em minmax(0,1fr)"><div class="hd"><span>Form</span><span>Beispiel</span></div>
<div><span class="k">nicht …, sondern</span><span><b>Nicht</b> ich war das, <b>sondern</b> Anna.</span></div>
<div><span class="k">kein …, sondern</span><span>Das ist <b>kein</b> Fehler, <b>sondern</b> Absicht.</span></div>
<div><span class="k">weder … noch</span><span>Er kommt <b>weder</b> heute <b>noch</b> morgen.</span></div>
<div><span class="k">gar nicht · gar kein</span><span>Das stimmt <b>gar nicht</b>. Ich habe <b>gar keine</b> Ahnung.</span></div></div>
<p class="tline">sondern corrects after a negation; aber only adds a contrast.</p></div>`};

const TK=a=>'<div class="tkm">'+a.map(([c,l,w])=>'<div class="'+c+'">'+(l?'<small>'+l+'</small>':'')+'<span>'+w+'</span></div>').join("")+'</div>';
GT.tekamolo={name:"TEKAMOLO",badge:"Te · Ka · Mo · Lo",tip:"Ask four questions in this order: wann? warum? wie? wo? It is the neutral order, your safe default. New or important information moves towards the end.",src:["grammis","lingolia","dw"],
 lg:'<span><i class="sw te"></i> Te wann?</span><span><i class="sw ka"></i> Ka warum?</span><span><i class="sw mo"></i> Mo wie?</span><span><i class="sw lo"></i> Lo wo?</span>',
 cards:[
 {b:"Die Reihenfolge",st:TK([["x","","Ich"],["v","","fahre"],["te","Te · wann?","heute"],["ka","Ka · warum?","wegen der Arbeit"],["mo","Mo · wie?","mit dem Zug"],["lo","Lo · wo?","nach Wien"]]),tx:"Temporal · Kausal · Modal · Lokal",gt:"The usual order of the extra information in the middle of the sentence: <b>when – why – how – where</b>. Each part answers one question.",say:"Ich fahre heute wegen der Arbeit mit dem Zug nach Wien."},
 {b:"Mittelfeld",st:TK([["x","","Wir"],["v","","haben"],["te","Te","gestern"],["mo","Mo","konzentriert"],["lo","Lo","im Büro"],["v","","gearbeitet"]]),tx:"TEKAMOLO fills the Mittelfeld",gt:"It stands between the two parts of the verb bracket: <b>haben … gearbeitet</b>. Not every sentence uses all four, but the ones you use keep this order.",say:"Wir haben gestern konzentriert im Büro gearbeitet."},
 {b:"Te · wann?",st:TK([["x","","Ich"],["v","","arbeite"],["te","Te","jeden Tag"],["lo","Lo","im Büro"]]),tx:"Temporal: wann? wie oft? wie lange? seit wann?",gt:"gestern, heute, jeden Tag, drei Stunden, seit Montag. The time usually comes first.",say:"Ich arbeite jeden Tag im Büro."},
 {b:"Ka · warum?",st:TK([["x","","Wir"],["v","","bleiben"],["ka","Ka","wegen des Wetters"],["lo","Lo","zu Hause"]]),tx:"Kausal: warum? weshalb?",gt:"wegen des Wetters (Genitiv), aus Angst, deshalb, daher. A reason follows the time.",say:"Wir bleiben wegen des Wetters zu Hause."},

 {b:"Lo · wo?",st:TK([["x","","Er"],["v","","wohnt"],["te","Te","seit 2020"],["lo","Lo","in Wien"]]),tx:"Lokal: wo? wohin? woher?",gt:"in Wien, nach Hause, aus dem Büro. Place comes last in the middle field.",say:"Er wohnt seit 2020 in Wien."},
 {b:"Pronomen",st:TK([["x","","Ich"],["v","","gebe"],["o","Akk","es"],["o","Dat","dir"],["te","Te","morgen"]]),tx:"Pronouns come first",gt:"Short pronouns stand right after the verb, before TEKAMOLO. Two pronouns: <b>Akk before Dat</b> – es dir, not dir es.",say:"Ich gebe es dir morgen."},
 {b:"Objekte",st:TK([["x","","Ich"],["v","","schenke"],["o","Dat","meiner Mutter"],["o","Akk","einen Ring"]]),tx:"Two nouns: Dativ before Akkusativ",gt:"A pronoun comes before a noun: Ich schenke <b>ihr</b> einen Ring. Ich schenke <b>ihn</b> meiner Mutter.",say:"Ich schenke meiner Mutter einen Ring."},
 {b:"Vorfeld",st:TK([["te","Te","Morgen"],["v","","fahre"],["x","","ich"],["mo","Mo","mit dem Zug"],["lo","Lo","nach Wien"]]),tx:"Any part can go first",gt:"For emphasis, put one part in position 1. The verb stays second, and the others keep their order: <b>Morgen fahre ich mit dem Zug nach Wien.</b>",say:"Morgen fahre ich mit dem Zug nach Wien."},
 {b:"Kein Gesetz",st:TK([["x","","Ich"],["v","","fahre"],["te","Te","morgen"],["lo","Lo","nach Wien"],["mo","Mo","mit dem Zug"]]),tx:"The new information goes last",gt:"TEKAMOLO is the neutral order. If the means of transport is the point, it can move back: nach Wien <b>mit dem Zug</b>. Learn the default first, then notice how real texts bend it.",say:"Ich fahre morgen nach Wien mit dem Zug."}],
 q:[
 {s:"„mit dem Zug“ beantwortet die Frage …",o:["Wie?","Wann?","Wohin?"],why:"How you travel is Modal (wie?).",lv:"A2"},
 {s:"„nach Wien“ beantwortet die Frage …",o:["Wohin?","Wann?","Warum?"],why:"A direction is Lokal (wohin?).",lv:"A2"},

 {s:"Neutrale Reihenfolge: Ich fahre ___.",o:["morgen mit dem Zug nach Wien","nach Wien mit dem Zug morgen","nach Wien morgen mit dem Zug"],why:"Te – Mo – Lo: morgen, mit dem Zug, nach Wien.",lv:"A2"},
 {s:"Neutrale Reihenfolge: Er ist ___ gefahren.",o:["heute mit dem Auto nach Graz","nach Graz heute mit dem Auto","mit dem Auto nach Graz heute"],why:"Te – Mo – Lo, between ist and gefahren.",lv:"A2"},
 {s:"Neutrale Reihenfolge: Wir bleiben ___.",o:["wegen des Wetters zu Hause","zu Hause wegen des Wetters"],why:"Ka before Lo: wegen des Wetters (warum?), zu Hause (wo?).",lv:"B1"},
 {s:"Neutrale Reihenfolge: Sie hat ___ gearbeitet.",o:["gestern gern im Garten","im Garten gestern gern","gern im Garten gestern"],why:"Te – Mo – Lo: gestern, gern, im Garten.",lv:"B1"},
 {s:"Neutrale Reihenfolge: Er arbeitet ___.",o:["jeden Tag sehr konzentriert im Büro","sehr konzentriert jeden Tag im Büro","im Büro jeden Tag sehr konzentriert"],why:"Te – Mo – Lo: jeden Tag, sehr konzentriert, im Büro.",lv:"B1"},
 {s:"Ich gebe ___ morgen.",o:["es dir","dir es","dem Kind es"],why:"Pronouns first, Akk before Dat: es dir.",lv:"B1"},

 {s:"Neutrale Reihenfolge: Der Vortrag findet ___ statt.",o:["nächste Woche wegen des großen Interesses im Saal","wegen des großen Interesses nächste Woche im Saal","im Saal nächste Woche wegen des großen Interesses"],why:"Te – Ka – Lo: nächste Woche, wegen des großen Interesses, im Saal.",lv:"B2"}],
 th:`<div class="tc df"><h3>TEKAMOLO <small>A2</small></h3><p class="tline">The usual order of the extra information (Angaben) in the middle of the sentence.</p>
<div class="nt" style="--nc:5.4em 6.6em minmax(0,1fr)"><div class="hd"><span>Teil</span><span>Frage</span><span>Beispiele</span></div>
<div><span class="g">Te</span><span>wann?<br>wie oft?</span><span>gestern, heute, jeden Tag, seit Montag, drei Stunden</span></div>
<div><span class="g">Ka</span><span>warum?</span><span>wegen des Regens, aus Angst, deshalb</span></div>
<div><span class="g">Mo</span><span>wie?<br>womit?</span><span>schnell, gern, mit dem Zug, ohne Hilfe</span></div>
<div><span class="g">Lo</span><span>wo?<br>wohin?</span><span>in Wien, nach Hause, aus dem Büro</span></div></div></div>
<div class="tc df"><h3>Der ganze Satz <small>A2</small></h3>${TK([["x","","Ich"],["v","","gebe"],["o","","es"],["te","Te","morgen"],["mo","Mo","gern"],["lo","Lo","im Büro"],["v","","ab"]])}
<div class="nt" style="--nc:6.4em minmax(0,1fr)"><div class="hd"><span>Platz</span><span>Was steht dort</span></div>
<div><span class="g">1</span><span>Subjekt oder ein anderer Teil (Vorfeld)</span></div>
<div><span class="g">2</span><span>das konjugierte Verb</span></div>
<div><span class="g">Mitte</span><span>Pronomen, dann Te – Ka – Mo – Lo</span></div>
<div><span class="g">Ende</span><span>zweiter Verbteil: ab, gegeben, gearbeitet</span></div></div></div>
<div class="tc df"><h3>Objekte und Pronomen <small>B1</small></h3>
<div class="nt" style="--nc:8.4em minmax(0,1fr)"><div class="hd"><span>Regel</span><span>Beispiel</span></div>
<div><span class="k">Pronomen zuerst</span><span>Ich schenke <b>ihr</b> einen Ring.<br>Ich schenke <b>ihn</b> meiner Mutter.</span></div>
<div><span class="k">zwei Pronomen: Akk – Dat</span><span>Ich gebe <b>es dir</b>.</span></div>
<div><span class="k">zwei Nomen: Dat – Akk</span><span>Ich schenke <b>meiner Mutter einen Ring</b>.</span></div></div></div>
<div class="tc df"><h3>Wann gilt es nicht? <small>B1</small></h3>
<div class="nt" style="--nc:8.4em minmax(0,1fr)"><div class="hd"><span>Fall</span><span>Beispiel</span></div>
<div><span class="g">Betonung</span><span>Nach Wien fahre ich <b>mit dem Zug</b>. The part you stress moves back or to the front.</span></div>
<div><span class="g">Vorfeld</span><span><b>Morgen</b> fahre ich mit dem Zug nach Wien.</span></div>
<div><span class="g">nicht</span><span>Ich fahre heute <b>nicht</b> nach Wien. See Verneinung.</span></div></div>
<p class="tline">TEKAMOLO is a memory aid from German lessons for foreigners, not a law of the language. It is your safe default.</p></div>`};

  document.querySelectorAll(".grh").forEach(b=>b.onclick=()=>{const g=+b.dataset.g;store.grp=store.grp===g?-1:g;save();renderHome();});

  {const n=Object.keys(mistakes()).length,e=$("errc");e.hidden=!n;if(n){e.innerHTML='<span><small>Deine Fehler</small><b>'+n+(n===1?' Frage':' Fragen')+' zum Wiederholen</b></span><b>üben →</b>';
    e.onclick=()=>{ERRMODE=true;openTopic("test");$("ttl").textContent="Deine Fehler";setMode("game");};}}
  const tb=$("tmr");tb.setAttribute("aria-pressed",!!store.timer);tb.textContent=store.timer?"an · 15 s":"aus";
  $("lvs").innerHTML=["all"].concat(LVLS.slice(0,5)).map(l=>'<button class="lvb" data-l="'+l+'" id="lv-'+l+'" aria-pressed="'+((store.level||"all")===l)+'">'+(l==="all"?"Alle":l)+'</button>').join("");
  document.querySelectorAll(".lvb").forEach(b=>b.onclick=()=>{store.level=b.dataset.l;save();renderHome();});

const WHY={"neg": ["nicht = ni + wiht", "Althochdeutsch, um 800", "Why does nicht end in -t?", "Old High German niwiht meant 'not a thing' – the same word as English 'not a whit'. It once came with a second ni, like French ne … pas; the little ni fell away and nicht did the whole job. kein is the same idea: ni + ein, 'not one'."], "art": ["das Mädchen", "Mark Twain, 1880", "Why is a girl neuter?", "Because of -chen, not because of the girl: every -chen and -lein word is neuter, whatever it means. Twain complained that in German a young lady has no sex, while a turnip has. Gender belongs to the word, not to the thing: der Löffel, die Gabel, das Messer."], "fall": ["se · þone · þæm", "Altenglisch: der · den · dem", "Why does German keep four cases?", "English once had them too: Old English said se, þone, þæm for 'the'. English dropped the endings and relies on word order; only he/him and who/whom are left. German kept them in the article – so Den Plan zeichnet der Architekt is perfectly clear."], "gen": ["Der Dativ ist dem Genitiv sein Tod", "Bastian Sick, 2004", "Is the Genitiv dying?", "In speech it is retreating: wegen dem Regen, das Auto von meinem Bruder. Bastian Sick's best-selling book even makes the joke in the 'wrong' grammar. In writing it is very much alive, and it survives in fixed phrases: eines Tages, meines Wissens, guten Mutes."], "adj": ["stark · schwach", "Jacob Grimm, Deutsche Grammatik, 1819", "Why do the endings change?", "Jacob Grimm named the two sets of endings strong and weak. The rule behind them is thrift: one word has to show the case. If der or dem already shows it, the adjective takes the weak -e or -en. If nothing shows it, the adjective does the job itself: frischer Kaffee."], "konn": ["weil ich hab keine Zeit", "gesprochenes Deutsch", "Why do people say weil with the verb second?", "In speech, weil is drifting towards denn: 'weil ich hab keine Zeit', with a little pause after weil, is now common. It is still wrong in writing and in the exam. The rule to keep: weil, dass, ob, wenn send the verb to the end; und, aber, oder, denn do not."], "rel": ["der Mann, der dort steht", "aus dem alten Zeigewort der", "Why do relative pronouns look like articles?", "They grew out of the old pointing word der, 'that one'. Der Mann, der dort steht, is literally 'the man – that one stands there'. Only dessen, deren and denen show they are something extra: the Genitiv and the Dativ plural grew longer forms."], "perf": ["ich bin gegangen", "Präteritumschwund", "Why does Austria hardly use the Präteritum?", "In southern German – Bavaria, Austria, Switzerland – the simple past has almost vanished from speech over the last centuries; Swiss German has practically none. People say ich bin gegangen, not ich ging. Only war, hatte and the modal verbs stay. In the north and in writing the Präteritum is alive."], "vprep": ["warten auf · Angst vor", "feste Paare", "Why auf and not für?", "These prepositions are fixed by history, not logic – English is no better: wait for, think of, afraid of. German often thinks in space: warten auf (looking towards it), Angst vor (it stands in front of you), denken an (touching it in thought). Learn verb and preposition as one word."], "pass": ["Hier wird getanzt.", "ein Passiv ohne Subjekt", "What can the German Passiv do that English can't?", "German can build a passive with no subject at all: Hier wird nicht geraucht. Sonntags wird gearbeitet. English needs 'there is no smoking here'. It names an activity without saying who does it – very useful for rules, reports and building specifications."], "k2": ["ich hülfe · ich stürbe", "die alten Formen", "Why does everyone say würde?", "The old Konjunktiv II of many verbs looks like the past or sounds bookish: ich hülfe, ich stürbe, ich würfe. So speakers moved to würde + Infinitiv. A handful of short forms stayed alive and are used every day: wäre, hätte, könnte, müsste, sollte, wüsste, käme, ginge."], "k1": ["Er sagte, er sei krank.", "die Sprache der Nachrichten", "Why do the news say er sei?", "Konjunktiv I marks reported speech: the speaker passes on what someone said without vouching for it. Journalists use it to keep their distance – er sei krank means 'he says he is ill'. In everyday speech people use the indicative or würde instead."], "nvv": ["zur Anwendung kommen", "Kanzleisprache", "Why do officials say zur Anwendung kommen?", "Since the chancelleries of the late Middle Ages, official German has loved nouns: a noun plus an almost empty verb such as kommen, stellen, nehmen. zur Anwendung kommen simply means angewendet werden. It sounds formal and precise – good in letters and reports, tiring when overdone."], "tekamolo": ["TE · KA · MO · LO", "eine Eselsbrücke aus dem DaF-Unterricht", "Is TEKAMOLO a rule?", "It is a memory aid, not a law. It describes the neutral order, the one you can always use. Native speakers shift things for emphasis: the newer or more important the information, the further back it goes. Learn TEKAMOLO as your safe default, then watch how real texts bend it."], "nom": ["Donaudampfschifffahrt", "Mark Twain, 1880", "Why is German so fond of long nouns?", "German glues words together where English uses 'of': one word for a whole phrase. Twain joked that some German words are so long they have a perspective. Nominalstil packs a clause into a noun: die Planung des Neubaus instead of dass man den Neubau plant."], "praes": ["er reiste … ab", "Mark Twain, 1880", "Why does the prefix run to the end?", "A separable verb is a verb plus a small adverb, and in a main clause the adverb waits at the end of the verb bracket. Twain mocked a novel in which the hero packs, kisses his mother and sisters and, many words later, finally 'reiste … ab'. The good side: the end of a German sentence always holds a surprise."]};

 lg:'<span><b class="wt v lgk">Verb</b> Satzklammer</span><span><b class="wt ng lgk">nicht</b> Verneinung</span>',
 cards:[
 {b:"Satzklammer",st:D("Ich~s|muss~v|morgen|den Plan~a|zeichnen~v|.~p","1-4a:Modalverb … Infinitiv"),tx:"Modalverb in position 2, infinitive at the end",gt:"The modal verb is conjugated; the main verb waits at the end as a plain infinitive, <b>without zu</b>: Ich muss den Plan zeichnen.",say:"Ich muss morgen den Plan zeichnen."},
 {b:"Formen",st:D("Er~s|kann~v|gut|zeichnen~v|.~p","1-3a:er kann – ohne -t"),tx:"ich kann · er kann – no ending",gt:"ich and er/sie/es look the same and have no ending. Most change the vowel in the singular: können → <b>kann</b>, dürfen → <b>darf</b>, müssen → <b>muss</b>, wollen → <b>will</b>, mögen → <b>mag</b>. Only sollen keeps its o.",say:"Er kann gut zeichnen."},
 {b:"nicht müssen",st:D("Du~s|musst~v|das|nicht~ng|machen~v|.~p","1-4a:nicht müssen"),tx:"nicht müssen ≠ nicht dürfen",gt:"<b>Du musst nicht</b> = you don't have to. <b>Du darfst nicht</b> = you mustn't. The classic trap for English speakers. Instead of nicht müssen you can say <b>nicht brauchen zu</b>: Du brauchst das nicht zu machen.",say:"Du musst das nicht machen."},
 {b:"möchte",st:D("Ich~s|möchte~v|einen Kaffee~a|.~p"),tx:"möchte = polite want",gt:"<b>möchte</b> is the Konjunktiv II of mögen, used as a polite present: Ich möchte zahlen. ich mag = I like. A modal verb can stand without an infinitive when the meaning is clear: Ich kann Deutsch.",say:"Ich möchte einen Kaffee."},
 {b:"Nebensatz",st:D("…, weil~k|ich|morgen|arbeiten~v|muss~v|.~p","0-4a:Modalverb ans Ende"),tx:"In a Nebensatz the modal verb goes last",gt:"weil ich morgen arbeiten <b>muss</b>: infinitive first, then the conjugated modal verb.",say:"…, weil ich morgen arbeiten muss."},
 {b:"Perfekt",st:D("Ich~s|habe~v|länger|arbeiten müssen~v|.~p","1-3a:haben … zwei Infinitive"),tx:"Ersatzinfinitiv: müssen, not gemusst",gt:"With a second verb, the Perfekt uses the infinitive of the modal: Ich habe arbeiten <b>müssen</b>. Without one, the Partizip: Das habe ich nicht <b>gewollt</b>. In speech the Präteritum is usual: Ich musste arbeiten.",say:"Ich habe länger arbeiten müssen."},
 {b:"Nebensatz · Perfekt",st:D("…, dass~k|er|hat~v|kommen müssen~v|.~p","2-3a:hat vor die Infinitive"),tx:"dass er hat kommen müssen (C1)",gt:"The one exception to „verb last“: with two infinitives, <b>hat</b> jumps in front of them. dass er hat kommen müssen, ob sie hat bleiben dürfen.",say:"…, dass er hat kommen müssen."},
 {b:"Vermutung",st:D("Er~s|dürfte~v|recht|haben~v|.~p","1-3a:wahrscheinlich"),tx:"How sure am I?",gt:"Modals also show how certain the speaker is: <b>muss</b> = almost certain, <b>dürfte</b> = probably, <b>kann / könnte</b> = possibly, <b>kann nicht</b> = impossible. Past: Er muss es vergessen <b>haben</b>.",say:"Er dürfte recht haben."},
 {b:"Behauptung",st:D("Er~s|soll~v|sehr reich|sein~v|.~p","1-3a:man sagt"),tx:"soll = people say · will = he claims",gt:"<b>Er soll reich sein</b>: that is what people say. <b>Er will nichts gewusst haben</b>: that is what he claims – and I doubt it. Typical of newspapers and C1 texts.",say:"Er soll sehr reich sein."}],

 {s:"Ich ___ gut schwimmen.",o:["kann","kanne","kannst"],why:"ich kann – no ending, same as er kann.",lv:"A1"},

 th:`<div class="tc df"><h3>Die sechs Modalverben <small>A1–A2</small></h3><p class="tline">Six verbs, one pattern: Modalverb in position 2, infinitive at the end, no zu.</p>
<div class="nt" style="--nc:4.4em 3.2em 4.2em minmax(0,1fr)"><div class="hd"><span>Verb</span><span>ich, er</span><span>Prät.</span><span>Bedeutung</span></div>
<div><span class="k">können</span><span>kann</span><span>konnte</span><span>can, be able to</span></div>
<div><span class="k">dürfen</span><span>darf</span><span>durfte</span><span>may, be allowed</span></div>
<div><span class="k">müssen</span><span>muss</span><span>musste</span><span>must, have to</span></div>
<div><span class="k">sollen</span><span>soll</span><span>sollte</span><span>should, be told to</span></div>
<div><span class="k">wollen</span><span>will</span><span>wollte</span><span>want (≠ will)</span></div>
<div><span class="k">mögen</span><span>mag</span><span>mochte</span><span>like · möchte = would like</span></div></div>
<p class="tline">Plural and Präteritum: no Umlaut – wir können, ich konnte. Konjunktiv II: with Umlaut – könnte, dürfte, müsste, möchte.</p></div>
<div class="tc df"><h3>Wo steht was? <small>A2–C1</small></h3><p class="tline">Main clause, Nebensatz, Perfekt, Passiv – where the modal goes.</p>${D("Ich~s|muss~v|morgen|arbeiten~v|.~p","1-3a:Satzklammer")}
<div class="nt" style="--nc:7.6em minmax(0,1fr)"><div class="hd"><span>Satz</span><span>Beispiel</span></div>
<div><span>Hauptsatz</span><span>Ich <b>muss</b> morgen arbeiten.</span></div>
<div><span>Nebensatz</span><span>…, weil ich morgen arbeiten <b>muss</b>.</span></div>
<div><span>Perfekt</span><span>Ich habe arbeiten <b>müssen</b>.</span></div>
<div><span>ohne 2. Verb</span><span>Das habe ich nicht <b>gewollt</b>.</span></div>
<div><span>Nebensatz Perfekt</span><span>…, dass ich <b>habe</b> arbeiten müssen.</span></div>
<div><span>Passiv</span><span>Das <b>muss</b> repariert werden.</span></div></div></div>
<div class="tc df"><h3>Wie sicher? <small>B2–C1</small></h3><p class="tline">The same verbs show how sure the speaker is. Past: + Partizip II + haben / sein.</p>
<div class="nt" style="--nc:5em 6.6em minmax(0,1fr)"><div class="hd"><span>Verb</span><span>sicher?</span><span>Beispiel</span></div>
<div><span class="k">muss</span><span>fast sicher</span><span>Er <b>muss</b> krank sein.</span></div>
<div><span class="k">dürfte</span><span>wahrscheinlich</span><span>Das <b>dürfte</b> stimmen.</span></div>
<div><span class="k">kann · könnte</span><span>möglich</span><span>Er <b>könnte</b> im Stau stehen.</span></div>
<div><span class="g">kann nicht</span><span>unmöglich</span><span>Er <b>kann</b> es nicht gewesen sein.</span></div>
<div><span class="g">soll</span><span>man sagt</span><span>Er <b>soll</b> reich sein.</span></div>
<div><span class="g">will</span><span>er sagt</span><span>Er <b>will</b> nichts gewusst haben.</span></div></div></div>`};

/* ===== zu + Infinitiv (30 Oct) ===== */
GT.zuinf={name:"zu + Infinitiv",badge:"zu + Infinitiv",tip:"After modal verbs, werden, lassen and sehen / hören: no zu. Separable verbs take zu in the middle: anzurufen.",src:["grammis","dg20","lingolia"],
 lg:'<span><b class="wt v lgk">Verb</b> Infinitiv</span><span><b class="wt k lgk">um</b> Konnektor</span>',
 cards:[
 {b:"zu + Infinitiv",st:D("Ich~s|habe~v|keine Zeit,|den Plan~a|zu zeichnen~v|.~p","3-4a:Infinitivsatz"),tx:"zu + infinitive goes to the end",gt:"After many nouns (Zeit, Lust, Angst), adjectives (es ist schwer) and verbs (versuchen, vergessen, anfangen): <b>zu</b> + infinitive at the end of its clause.",say:"Ich habe keine Zeit, den Plan zu zeichnen."},
 {b:"Trennbar",st:D("Vergiss~v|nicht,|mich|anzurufen~v|!~p"),tx:"zu goes inside a separable verb",gt:"anrufen → an<b>zu</b>rufen, aufstehen → auf<b>zu</b>stehen. Written as one word.",say:"Vergiss nicht, mich anzurufen!"},
 {b:"ohne zu",st:D("Ich~s|muss~v|morgen|arbeiten~v|.~p","1-3a:kein zu"),tx:"No zu after modal verbs",gt:"No zu after modal verbs, werden, lassen, bleiben, gehen and verbs of perception: Ich <b>höre</b> ihn singen. Ich <b>lasse</b> das Auto reparieren.",say:"Ich muss morgen arbeiten."},
 {b:"um … zu",st:D("Ich~s|lerne~v|Deutsch,|um~k|in Wien|zu arbeiten~v|.~p","3-5b:um … zu"),tx:"um … zu = in order to",gt:"Purpose, same subject in both clauses. Different subjects → <b>damit</b>: Ich spreche langsam, damit alle mich verstehen.",say:"Ich lerne Deutsch, um in Wien zu arbeiten."},
 {b:"ohne · statt",st:D("Er~s|ging,~v|ohne~k|ein Wort|zu sagen~v|.~p","2-4b:ohne … zu"),tx:"ohne … zu · statt … zu",gt:"<b>ohne … zu</b> = without doing. <b>(an)statt … zu</b> = instead of doing. English uses -ing; German uses zu + infinitive.",say:"Er ging, ohne ein Wort zu sagen."},

 {b:"Vergangenheit",st:D("Er~s|behauptet,~v|ihn~a|gesehen zu haben~v|.~p","1-3a:früher als behauptet"),tx:"gesehen zu haben (C1)",gt:"When the action lies before the main verb: Partizip II + <b>zu haben / zu sein</b>. Passive: <b>gefragt zu werden</b>, <b>gefragt worden zu sein</b>.",say:"Er behauptet, ihn gesehen zu haben."},
 {b:"scheinen",st:D("Sie~s|scheint~v|müde|zu sein~v|.~p","1-3a:scheinen … zu"),tx:"scheinen, pflegen, versprechen",gt:"<b>Sie scheint müde zu sein</b> = she seems to be tired. Also: Er pflegt früh aufzustehen (he tends to), Das verspricht spannend zu werden.",say:"Sie scheint müde zu sein."}],
 q:[
 {s:"Ich habe keine Lust, heute ___.",o:["zu kochen","kochen","zu gekocht"],why:"keine Lust + zu + Infinitiv.",lv:"A2"},
 {s:"Vergiss nicht, mich ___!",o:["anzurufen","zu anrufen","anrufen"],why:"Separable verb: zu goes inside – anzurufen.",lv:"A2"},
 {s:"Ich muss morgen früh ___.",o:["aufstehen","aufzustehen","zu aufstehen"],why:"After a modal verb: no zu.",lv:"A2"},
 {s:"Es ist nicht leicht, Deutsch ___.",o:["zu lernen","lernen","lernen zu"],why:"es ist leicht / schwer + zu + Infinitiv.",lv:"A2"},
 {s:"Hast du Zeit, mir ___?",o:["zu helfen","helfen","zu geholfen"],why:"Zeit haben + zu + Infinitiv.",lv:"A2"},
 {s:"Ich lerne Deutsch, ___ in Wien zu arbeiten.",o:["um","damit","für"],why:"Purpose, same subject: um … zu.",lv:"B1"},

 {s:"Wir haben vor, im Sommer nach Triest ___.",o:["zu fahren","fahren","gefahren"],why:"vorhaben + zu + Infinitiv.",lv:"B1"},

 {s:"Ich habe heute noch viel ___.",o:["zu tun","tun","getan"],why:"haben + zu = have to.",lv:"B2"},
 {s:"Es ist mir endlich gelungen, den Fehler ___.",o:["zu finden","finden","gefunden"],why:"es gelingt mir + zu + Infinitiv.",lv:"B2"},
 {s:"Ich freue mich ___, dich bald wiederzusehen.",o:["darauf","damit","dafür"],why:"sich freuen auf → darauf, … zu (future). Something already past: darüber.",lv:"B2"},
 {s:"Anstatt die Ursache ___, beschuldigte er das Team.",o:["zu untersuchen","untersuchen","untersucht zu"],why:"anstatt … zu + Infinitiv.",lv:"B2"},
 {s:"Er pflegt jeden Morgen eine Stunde ___.",o:["spazieren zu gehen","zu spazieren gehen","spazieren gehen"],why:"pflegen + zu (= usually does). zu goes before the last verb.",lv:"B2"},
 {s:"Er behauptet, den Mann nie ___.",o:["gesehen zu haben","zu sehen haben","gesehen haben zu"],why:"Earlier action: Partizip II + zu haben.",lv:"C1"},
 {s:"Sie bedauert, so früh ___.",o:["gegangen zu sein","gegangen zu haben","zu gehen sein"],why:"gehen takes sein: gegangen zu sein.",lv:"C1"},
 {s:"Er scheint den Termin ___.",o:["vergessen zu haben","zu vergessen haben","vergessen haben zu"],why:"scheinen + Infinitiv Perfekt: vergessen zu haben.",lv:"C1"},
 {s:"Ohne gefragt ___, gab er seine Meinung ab.",o:["worden zu sein","geworden zu sein","zu worden sein"],why:"Passiv, earlier action: gefragt worden zu sein.",lv:"C1"},

 {s:"Die Risiken sind nicht ___ unterschätzen.",o:["zu","um zu","für"],why:"sein + zu = dürfen nicht unterschätzt werden.",lv:"C1"}],
 th:`<div class="tc df"><h3>zu oder nicht? <small>A2–B1</small></h3><p class="tline">zu after many nouns, adjectives and verbs – never after modal verbs.</p>
<div class="nt" style="--nc:8.6em minmax(0,1fr)"><div class="hd"><span>nach …</span><span>Beispiel</span></div>
<div><span class="k">mit zu</span><span>Ich habe keine Zeit, das <b>zu</b> lesen.</span></div>
<div><span>Nomen: Lust, Zeit, Angst</span><span>Ich habe Lust, <b>zu</b> tanzen.</span></div>
<div><span>es ist + Adjektiv</span><span>Es ist schwer, das <b>zu</b> erklären.</span></div>
<div><span>Verben: versuchen, vergessen, anfangen, vorhaben</span><span>Ich versuche, pünktlich <b>zu</b> sein.</span></div>
<div><span class="g">ohne zu</span><span>Ich muss arbeiten.</span></div>
<div><span>Modalverben, werden</span><span>Er wird kommen.</span></div>
<div><span>lassen, bleiben, gehen</span><span>Ich lasse das Auto reparieren.</span></div>
<div><span>sehen, hören, fühlen</span><span>Ich höre ihn singen.</span></div></div>
<p class="tline">Separable verbs: an<b>zu</b>rufen, auf<b>zu</b>stehen – one word.</p></div>
<div class="tc df"><h3>um · ohne · statt <small>B1</small></h3><p class="tline">Purpose, without, instead of – all with zu at the end.</p>${D("Ich~s|lerne~v|Deutsch,|um~k|in Wien|zu arbeiten~v|.~p","3-5b:um … zu")}
<div class="nt" style="--nc:5.6em minmax(0,1fr)"><div class="hd"><span>Konnektor</span><span>Beispiel</span></div>
<div><span class="k">um … zu</span><span>Ich spare, <b>um</b> ein Pferd <b>zu</b> kaufen.</span></div>
<div><span class="k">damit</span><span>Ich spare, <b>damit</b> meine Kinder studieren können.</span></div>
<div><span class="k">ohne … zu</span><span>Er ging, <b>ohne</b> zu grüßen.</span></div>
<div><span class="k">statt … zu</span><span><b>Statt</b> zu lernen, schläft er.</span></div></div>
<p class="tline">um … zu only with the same subject. Two subjects → damit.</p></div>
<div class="tc df"><h3>Mehr Formen <small>B2–C1</small></h3><p class="tline">haben zu, sein zu, scheinen zu, past and passive infinitives.</p>
<div class="nt" style="--nc:7.4em minmax(0,1fr)"><div class="hd"><span>Form</span><span>Beispiel</span></div>
<div><span>haben zu = müssen</span><span>Ich <b>habe</b> noch viel <b>zu</b> tun.</span></div>
<div><span>sein zu = muss / kann + Passiv</span><span>Der Antrag <b>ist</b> bis Montag ein<b>zu</b>reichen.</span></div>
<div><span>scheinen zu</span><span>Er <b>scheint</b> krank <b>zu</b> sein.</span></div>
<div><span>Vergangenheit</span><span>Er behauptet, sie gesehen <b>zu haben</b>.</span></div>
<div><span>Passiv</span><span>Sie hofft, gewählt <b>zu werden</b>.</span></div>
<div><span>Passiv · früher</span><span>…, ohne gefragt <b>worden zu sein</b>.</span></div></div></div>`};

WHY.modal=["ich kann, er kann","Präterito-Präsentia","Why does er kann have no -t?","Most modal verbs are old past tenses with a present meaning: 'I have learnt' became 'I can'. A past tense has no ending for er (er kam), so neither has er kann, er muss. English kept the same trace: he can, he must – no -s."];
WHY.zuinf=["zi nemanne","Althochdeutsch, um 800","Why does German need zu?","Old High German could decline the infinitive like a noun: after zi ('to') it took a dative ending – zi nemanne, 'to the taking'. The ending wore away, zu stayed. Old English did the same: tō nimanne. So zu still behaves a little like a preposition: it points to a goal or a task."];
const whyCard=([sq,sx,tx,gt])=>({b:"Warum?",st:'<div class="story"><span class="sk">Warum?</span><p class="sq">'+sq+'</p><p class="sx">'+sx+'</p><p class="sb">'+gt+'</p></div>',tx,gt:"Weiter → zu den Regeln.",say:sq+". "+gt});

function render(){clearTimeout(MC&&MC.tm);
  if(mode==="theo"){if(T==="write"){renderWrite();$("theo").scrollTop=0;return;}if(T==="lueck"){renderLueck();$("theo").scrollTop=0;return;}theoGallery();$("theo").scrollTop=0;return;}
  if(mode==="game"&&T!=="satz"){mcRender();return;}
  if(GT[T]){cardsLearn(GT[T].cards,GT[T].lg);return;}
  ({satz:mode==="learn"?sbLearn:sbGame,prep:prLearn,art:()=>cardsLearn(ART_CARDS,LG.art),pron:()=>cardsLearn(PRON_CARDS,LG.pron),gen:()=>cardsLearn(GEN_CARDS,LG.gen),fall:()=>cardsLearn(FALL_CARDS.concat(PRON_CARDS),LG.fall),adj:()=>cardsLearn(ADJ_CARDS,LG.adj)})[T]();}
function cardsLearn(cards,lg){$("lg").innerHTML=lg;const c=cards[idx%cards.length];
  $("stage").innerHTML=c.st;$("stage").onclick=null;$("bd").textContent=c.b;$("ct").textContent=(idx%cards.length+1)+" / "+cards.length;
  $("cardbody").innerHTML='<p id="tx">'+c.tx+'</p><p id="gt">'+c.gt+'</p>';arcsSoon($("stage"));
  setBtns("btns1",[btn("bZ","← Zurück","",()=>{idx=(idx-1+cards.length)%cards.length;render()}),btn("bW","Weiter →","primary",()=>{idx=(idx+1)%cards.length;render()})]);
  setBtns("btns2",[btn("bH","Anhören","",()=>speak(c.say||(c.st+" "+c.tx).replace(/<[^>]+>/g," "))),btn("bG","Zum Spiel","",()=>setMode("game"))]);}

/* ---------- own words + stars (Artikel) ---------- */
function ownList(){return store.own||[];}
function ownHTML(){return '<div class="tc df"><h3>Eigene Wörter <small>'+ownList().length+'</small></h3><p class="tline">Add nouns you meet at work or in the stable. They join the Spiel.</p><div class="own"><select id="owa" aria-label="Artikel"><option>der</option><option>die</option><option>das</option></select><input id="own" lang="de" placeholder="Nomen" aria-label="Nomen"><input id="owe" placeholder="English" aria-label="English"><button id="owb" class="primary" aria-label="Hinzufügen">+</button></div><div class="rows">'+ownList().map((w,i)=>'<div><span>'+esc(w[0])+' '+esc(w[1])+'</span><span>'+esc(w[2]||"")+' <button class="del" data-i="'+i+'" aria-label="Löschen">×</button></span></div>').join("")+'</div></div>';}
function bindOwn(){const b=$("owb");if(!b)return;b.onclick=()=>{let n=$("own").value.trim();if(!n){$("own").focus();return;}n=n.charAt(0).toUpperCase()+n.slice(1);
  store.own=ownList().concat([[$("owa").value,n,$("owe").value.trim(),""]]);save();refreshTheo();};
  document.querySelectorAll(".del").forEach(d=>d.onclick=()=>{store.own=ownList().filter((_,i)=>i!==+d.dataset.i);save();refreshTheo();});}
const starred=n=>(store.stars||[]).includes(n);
function toggleStar(n){const s=store.stars||[];store.stars=s.includes(n)?s.filter(x=>x!==n):s.concat([n]);save();const b=$("star");if(b){b.classList.toggle("on",starred(n));b.textContent=starred(n)?"★":"☆";}}

{id:"a2c",lv:"A2",t:"Die neue Wohnung",x:`Im März {sind|sein|1|„umziehen“ bildet das Perfekt mit sein.} wir in eine neue Wohnung {umgezogen|umziehen|3|Trennbar: um-ge-zogen (ziehen – zog – gezogen).}. Die alte Wohnung war {kleiner|klein|2|Komparativ: klein → kleiner.} und {dunkler|dunkel|3|Komparativ von dunkel: dunkler – das e in -el fällt weg.}. Jetzt haben wir einen Balkon, und das Wohnzimmer ist fast so groß {wie||2|Gleich groß: so … wie. Nicht gleich: größer als.} die ganze alte Wohnung.

{id:"b1b",lv:"B1",t:"Das Wiener Kaffeehaus",x:`Das Wiener Kaffeehaus hat eine lange Tradition. Der Legende nach {brachten|bringen|3|bringen – brachte – gebracht (unregelmäßig); Plural: brachten.} die Osmanen nach der Belagerung von 1683 Kaffeebohnen nach Wien. Ob das stimmt, {weiß|wissen|2|wissen ist unregelmäßig: ich weiß, er weiß.} niemand genau.

Sicher ist: {Im||2|in + dem = im (Zeitpunkt).} 19. Jahrhundert {wurden|werden|3|Passiv Präteritum: wurden + Partizip II (wurden eröffnet).} in Wien Hunderte Kaffeehäuser eröffnet. Viele Künstler, {die||3|Relativpronomen, Nominativ Plural: die Künstler – die …} kein Geld für eine warme Wohnung hatten, saßen {den||3|Zeitangabe ohne Präposition steht im Akkusativ: den ganzen Tag.} ganzen Tag im Café. Dort {konnten|können|2|Präteritum von können: konnten (ohne Umlaut).} sie lesen, schreiben und diskutieren. Für den Preis {eines||3|Genitiv maskulin: der Kaffee → der Preis eines kleinen Kaffees.} kleinen Kaffees {durfte|dürfen|2|Präteritum von dürfen: durfte.} man stundenlang bleiben. Bis heute bringt der Kellner zu jedem Kaffee {ein||1|Akkusativ neutral: das Glas → ein Glas.} Glas Wasser.

{id:"b1c",lv:"B1",t:"Homeoffice – Fluch oder Segen?",x:`Seit {der|die|2|„seit“ + Dativ, feminin: die Pandemie → seit der Pandemie.} Pandemie arbeiten viele Menschen von zu Hause aus. Für manche {ist|sein|1|das → ist.} das ein Traum, für {andere|ander-|3|„für“ + Akkusativ Plural: für andere (Menschen).} eher ein Albtraum.

Ein großer Vorteil ist, dass man keine Zeit im Verkehr {verliert|verlieren|2|„dass“-Satz: das Verb steht am Ende; man → -t.}. Außerdem kann man sich die Arbeitszeit {freier|frei|3|Komparativ als Adverb: frei → freier (ohne Endung).} einteilen. Auf der anderen Seite fehlt vielen der Kontakt zu {den|die|3|„zu“ + Dativ Plural: die Kollegen → zu den Kollegen.} Kollegen. Wer allein am Küchentisch sitzt, {fühlt|sich fühlen|2|Nach dem „wer“-Satz folgt der Hauptsatz mit dem Verb zuerst: fühlt sich …} sich schnell einsam.

{id:"b2a",lv:"B2",t:"Wer schreibt, bleibt",x:`Immer mehr Schulen {verzichten|verzichten|2|„verzichten auf“ + Akkusativ; hier: darauf, … zu …} darauf, Kindern eine verbundene Schreibschrift beizubringen. Kritiker warnen jedoch, dass dadurch eine wichtige Kulturtechnik verloren gehen {könnte|können|3|Möglichkeit/Vermutung: Konjunktiv II von können am Ende des Nebensatzes.}.

{Einigen|einige|3|„zufolge“ steht nach dem Nomen und verlangt den Dativ: einigen Studien zufolge.} Studien zufolge {werden|werden|3|Passiv Präsens Plural: Inhalte werden … behalten.} handschriftlich notierte Inhalte besser behalten als getippte. Das liegt {daran||3|„liegen an“ + Nebensatz → Pronominaladverb: Das liegt daran, dass …}, dass das Gehirn beim Schreiben mit der Hand stärker {gefordert|fordern|2|Passiv: wird + Partizip II (gefordert).} wird. {Je||1|je + Komparativ …, desto/umso + Komparativ …} langsamer man schreibt, {desto/umso||2|„je …, desto …“: der zweite Teil beginnt mit desto (oder umso).} gründlicher denkt man nach.

Befürworter der Digitalisierung halten dem entgegen, dass Kinder ohnehin den größten Teil {ihres|ihr|3|Genitiv maskulin: der Teil ihres Lebens (Possessiv + -es, Nomen + -s).} Lebens am Bildschirm verbringen {werden|werden|1|Futur I: werden + Infinitiv.}. Statt Schönschrift {zu üben|üben|2|„statt … zu“ + Infinitiv.}, sollten sie lieber lernen, schnell und fehlerfrei {zu tippen|tippen|1|„lernen“ + zu + Infinitiv.}. Vermutlich wird es auf eine Kombination aus {beidem|beide|3|„aus“ + Dativ; für zwei Dinge als Ganzes: beidem.} hinauslaufen.`},
{id:"b2b",lv:"B2",t:"Der Donauradweg",x:`Der Donauradweg {gehört|gehören|1|gehören zu + Dativ: er gehört zu …} zu den beliebtesten Radwegen Europas. Die {meisten|meist-|3|Superlativ von „viel“ als Artikelwort: die meisten Radfahrer.} Radfahrer starten in Passau und fahren flussabwärts bis Wien, {wofür||3|Relativsatz mit „für + was“ → wofür (bezieht sich auf die ganze Fahrt).} sie meist eine Woche brauchen. Die Strecke ist flach und gut {ausgeschildert|ausschildern|3|Partizip II eines trennbaren Verbs: aus-ge-schildert.}, sodass sie auch für Familien mit Kindern geeignet ist.

Besonders reizvoll ist die Wachau, {deren||3|Relativpronomen im Genitiv, feminin: die Wachau → deren Weinberge.} Weinberge und Klöster seit 2000 zum UNESCO-Welterbe {gehören|gehören|1|Relativsatz: das Verb steht am Ende; Plural → gehören.}. Wer {sich||1|„sich interessieren für“: reflexiv.} nicht nur für Natur, sondern auch für Geschichte interessiert, sollte in Melk Halt machen. Die im 18. Jahrhundert {erbaute|erbauen|3|Partizipialattribut: die … erbaute Abtei (Partizip II + Adjektivendung -e).} Benediktinerabtei thront hoch über der Donau.

{id:"b2c",lv:"B2",t:"Hitze in der Stadt",x:`In einem Interview mit einer Wiener Zeitung {erklärte|erklären|1|Präteritum im Bericht: erklärte.} die Stadtplanerin Maria Huber, die Stadt {müsse|müssen|3|Indirekte Rede: Konjunktiv I von müssen → sie müsse.} sich auf heiß{ere||2|Komparativ + Endung ohne Artikel, Akkusativ Plural: heißere Sommer.} Sommer vorbereiten. Es {sei|sein|2|Indirekte Rede: Konjunktiv I von sein → es sei.} wissenschaftlich belegt, dass die Zahl der Hitzetage in {den||1|„in“ + Dativ Plural (Zeit): in den letzten Jahrzehnten.} letzten Jahrzehnten deutlich {gestiegen|steigen|1|steigen – stieg – ist gestiegen.} sei.

const TL=[
 {y:9,d:"9 n. Chr.",lab:"9",t:"Varusschlacht",h:1,ini:"9",w:["de:Varusschlacht"],x:"Germanische Stämme unter Arminius besiegen drei römische Legionen. Rom gibt das Land östlich des Rheins auf – dort wird nie Latein gesprochen, anders als in Frankreich oder Spanien.",l:"Varusschlacht"},
 {y:350,d:"4. Jh.",lab:"4. Jh.",t:"Wulfilas Gotenbibel",ini:"Go",w:["de:Codex_Argenteus","de:Wulfilabibel"],x:"Bischof Wulfila übersetzt die Bibel ins Gotische und erfindet dafür eine eigene Schrift. Es ist der älteste lange Text in einer germanischen Sprache. Die schönste Abschrift, der „Silberne Codex“, liegt heute in Uppsala.",l:"Wulfilabibel"},
 {y:600,e:800,d:"6.–8. Jh.",lab:"6. Jh.",t:"Zweite Lautverschiebung",ini:"p → pf",x:"Im Süden verändern sich Laute: p wird zu pf oder f, t zu z oder s, k zu ch. So entstehen Apfel, Wasser und ich – im Norden bleibt es bei Appel, Water und ik. Bis heute trennt diese Linie Hochdeutsch und Niederdeutsch.",l:"Zweite Lautverschiebung"},
 {y:770,d:"um 770",t:"Abrogans",ini:"Ab",w:["de:Abrogans","en:Abrogans"],x:"Das älteste Buch auf Deutsch: ein Wörterbuch Latein – Althochdeutsch. Es heißt nach seinem ersten Wort: <i>abrogans</i>, „demütig“. Die Handschrift liegt in der Stiftsbibliothek St. Gallen.",l:["https://www.e-codices.ch/en/list/one/csg/0911","e-codices, Stiftsbibliothek St. Gallen"]},
 {y:786,d:"786",t:"„theodiscus“",ini:"786",x:"In einem lateinischen Bericht steht zum ersten Mal das Wort <i>theodiscus</i>: „in der Sprache des Volkes“ (<i>theod</i> = Volk). Daraus wird „deutsch“. Das Wort meint zuerst eine Sprache – ein Land erst viel später.",l:"Deutsch (Etymologie)"},
 {y:800,d:"800",t:"Karl der Große",h:1,ini:"KdG",w:["de:Karl_der_Große"],x:"Karl der Große wird in Rom zum Kaiser gekrönt. In seinen Klöstern schreibt man eine neue, gut lesbare Schrift, die karolingische Minuskel – die Urahnin unserer Kleinbuchstaben.",l:"Karl der Große"},
 {y:830,d:"um 830",t:"Hildebrandslied",ini:"Hi",w:["de:Hildebrandslied"],x:"Das <b>Hildebrandslied</b> wird aufgeschrieben – das einzige erhaltene Heldenlied auf Althochdeutsch. Ein Vater und sein Sohn stehen einander im Kampf gegenüber; das Ende fehlt.",l:"Hildebrandslied"},
 {y:842,d:"842",t:"Straßburger Eide",ini:"SE",w:["de:Straßburger_Eide"],x:"Zwei Enkel Karls des Großen schwören einander Treue – jeder in der Sprache des anderen Heeres: Althochdeutsch und Altfranzösisch. Die Eide gehören zu den ältesten Texten beider Sprachen.",l:"Straßburger Eide"},
 {y:870,d:"um 870",t:"Otfrids Evangelienbuch",ini:"Ot",w:["de:Otfrid_von_Weißenburg"],x:"Der Mönch Otfrid von Weißenburg erzählt das Leben Jesu auf Althochdeutsch – und reimt dabei am Ende der Verse. Es ist die erste große Dichtung mit Endreim auf Deutsch.",l:"Otfrid von Weißenburg"},
 {y:900,d:"9./10. Jh.",lab:"10. Jh.",t:"Merseburger Zaubersprüche",ini:"MZ",w:["de:Merseburger_Zaubersprüche"],x:"Zwei heidnische Zaubersprüche, aufgeschrieben in einer Kirchenhandschrift. Der erste soll Gefangene befreien, der zweite das verletzte Bein eines Pferdes heilen.",l:"Merseburger Zaubersprüche"},
 {y:1000,d:"um 1000",t:"Notker der Deutsche",ini:"No",w:["de:Notker_der_Deutsche"],x:"Der Mönch Notker übersetzt in St. Gallen lateinische Schulbücher ins Althochdeutsche, damit seine Schüler sie verstehen. Dafür bekommt er den Beinamen „der Deutsche“.",l:"Notker der Deutsche"},
 {y:1200,d:"um 1200",t:"Nibelungenlied",ini:"NL",w:["de:Nibelungenlied","en:Nibelungenlied"],x:"Ein Heldenepos auf Mittelhochdeutsch über Siegfried, Kriemhild und den Untergang der Burgunden. Es ist in mehr als 30 Handschriften erhalten und gehört zum Weltdokumentenerbe der UNESCO.",l:"Nibelungenlied"},
 {y:1210,d:"um 1200",lab:"1200",t:"Walther von der Vogelweide",ini:"Wa",w:["de:Walther_von_der_Vogelweide"],x:"Der bekannteste Dichter des Minnesangs. Sein Lied „Under der linden“ kennt man noch heute. Eine Zeit lang lebt er am Hof der Babenberger in Wien.",l:"Walther von der Vogelweide"},
 {y:1230,d:"um 1230",t:"Sachsenspiegel",ini:"Sa",w:["de:Sachsenspiegel"],x:"Eike von Repgow schreibt das Recht auf Deutsch statt auf Latein auf. Der <b>Sachsenspiegel</b> ist eines der ältesten Rechtsbücher in deutscher Sprache.",l:"Sachsenspiegel"},
 {y:1347,e:1351,d:"1347–1351",t:"Die Pest",h:1,ini:"†",w:["de:Schwarzer_Tod"],x:"Der „Schwarze Tod“ tötet in wenigen Jahren etwa ein Drittel der Menschen in Europa. Ganze Dörfer verschwinden.",l:"Schwarzer Tod"},
 {y:1348,d:"1348",t:"Universität Prag",ini:"Pr",w:["de:Karls-Universität"],x:"Kaiser Karl IV. gründet in Prag die erste Universität Mitteleuropas. Das Deutsch seiner Kanzlei wird für viele Schreiber in anderen Städten zum Vorbild.",l:"Karls-Universität"},
 {y:1365,d:"1365",t:"Universität Wien",ini:"UW",w:["de:Universität_Wien"],x:"Herzog Rudolf IV. gründet die Universität Wien – die älteste noch bestehende Universität im heutigen deutschen Sprachraum. Gelehrt wird zunächst auf Latein.",l:"Universität Wien"},
 {y:1450,d:"um 1450",t:"Gutenberg",ini:"GB",w:["de:Gutenberg-Bibel","en:Gutenberg_Bible"],x:"<b>Johannes Gutenberg</b> druckt in Mainz mit beweglichen Buchstaben. Bücher werden billiger, die Schreibweisen gleichen sich langsam an. Um 1455 erscheint die Gutenberg-Bibel – auf Latein, in einer gotischen Schrift. Von rund 180 Exemplaren sind knapp 50 erhalten.",l:"Johannes Gutenberg"},
 {y:1466,d:"1466",t:"Mentelin-Bibel",ini:"MB",w:["de:Mentelin-Bibel"],x:"Johannes Mentelin druckt in Straßburg die erste gedruckte Bibel auf Deutsch – fast 60 Jahre vor Luther. Ihr Deutsch ist aber schwer und folgt eng dem Latein.",l:"Mentelin-Bibel"},
 {y:1517,d:"1517",t:"Reformation",h:1,ini:"95",w:["de:95_Thesen"],x:"Martin Luther veröffentlicht 95 Thesen gegen den Ablasshandel. Dank des Buchdrucks verbreiten sich seine Flugschriften – bald auf Deutsch – rasend schnell.",l:"95 Thesen"},
 {y:1522,e:1534,d:"1522–1534",t:"Lutherbibel",ini:"LB",w:["de:Lutherbibel","en:Luther_Bible"],x:"<b>Martin Luther</b> übersetzt 1522 das Neue Testament, 1534 erscheint die ganze Bibel. Sie wird viel gekauft und viel gelesen; so verbreitet sich ein gemeinsames Schriftdeutsch über die Dialekte hinweg.",l:"Lutherbibel"},
 {y:1530,d:"1530",t:"Sendbrief vom Dolmetschen",ini:"SD",w:["de:Sendbrief_vom_Dolmetschen"],x:"Luther erklärt, wie er übersetzt: Man müsse die Mutter im Haus, die Kinder auf der Gasse und den einfachen Mann auf dem Markt fragen und ihnen „auf das Maul sehen“ – nicht Wort für Wort dem Latein folgen.",l:"Sendbrief vom Dolmetschen"},
 {y:1540,e:1941,d:"16. Jh. bis 1941",lab:"16. Jh.",t:"Fraktur",ty:"frak",smp:"A",big:"Deutsche Schrift",abc:ABC,x:"Bei der Fraktur sind die Bögen der Buchstaben „gebrochen“, also geknickt. Etwa vierhundert Jahre lang druckte man die meisten deutschen Bücher und Zeitungen so. Über Fraktur oder Antiqua stritt man lange.",l:"Fraktur (Schrift)"},
 {y:1605,d:"1605",t:"Die erste Zeitung",ini:"Re",w:["de:Relation_aller_Fürnemmen_und_gedenckwürdigen_Historien"],x:"In Straßburg erscheint die <i>Relation</i> von Johann Carolus – die erste regelmäßige Zeitung der Welt, jede Woche und auf Deutsch.",l:"Relation aller Fürnemmen und gedenckwürdigen Historien"},
 {y:1617,d:"1617",t:"Fruchtbringende Gesellschaft",ini:"FG",w:["de:Fruchtbringende_Gesellschaft"],x:"In Weimar entsteht die <b>Fruchtbringende Gesellschaft</b>, die erste große Sprachgesellschaft. Sie will Deutsch pflegen und Fremdwörter durch deutsche Wörter ersetzen.",l:"Fruchtbringende Gesellschaft"},
 {y:1618,e:1648,d:"1618–1648",t:"Dreißigjähriger Krieg",h:1,ini:"30",w:["de:Dreißigjähriger_Krieg"],x:"Ein Krieg um Glauben und Macht verwüstet Mitteleuropa. Das Reich zerfällt in viele kleine Staaten. Für viele Gelehrte ist die gemeinsame Sprache nun das, was die Deutschen noch verbindet – in diesen Jahren entstehen die Sprachgesellschaften.",l:"Dreißigjähriger Krieg"},

 {y:1801,d:"1801",t:"Campe",ini:"Ca",w:["de:Joachim_Heinrich_Campe"],x:"Joachim Heinrich <b>Campe</b> ersetzt Fremdwörter durch deutsche: Zerrbild für Karikatur, Stelldichein für Rendezvous. Manches bleibt, vieles nicht.",l:"Joachim Heinrich Campe"},
