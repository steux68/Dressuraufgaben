 prep:(q,rev)=>{if(q.x){$("stage").innerHTML='<div class="pict hide"><b>'+esc(rev?q.a:q.n)+'</b><span class="case">'+esc(q.w)+'</span></div>';return;}if(q.p){if(!rev)roomStage(q.p,q.m,false);else{const svg=$("stage").querySelector("svg");if(svg)svg.classList.remove("nomk");}}else if(q.v)verbStage(q,rev);else pictStage(PR.find(x=>x.p===q.f),rev);},
 art:(q,rev)=>{$("stage").innerHTML='<div class="noun"><button class="star'+(starred(q.noun)?" on":"")+'" id="star" aria-label="Merken">'+(starred(q.noun)?"★":"☆")+'</button><div class="nw"><span class="art'+(rev?" on":"")+'">'+(rev?q.o[q.c]:"___")+'</span> '+esc(q.noun)+'</div><button class="trb" id="trb">'+(rev?esc(q.en):"Übersetzung")+'</button></div>';
   $("trb").onclick=()=>{$("trb").textContent=q.en;};$("star").onclick=()=>toggleStar(q.noun);},
 pron:(q,rev)=>{$("stage").innerHTML='<div class="pict '+(rev?q.cs:"hide")+'"><b>'+esc(q.p)+(rev?" → "+esc(q.o[q.c]):"")+'</b><span class="case">'+(rev?(q.cs==="akk"?"Akkusativ":"Dativ"):"Akkusativ oder Dativ?")+'</span></div>';},
 gen:(q,rev)=>{$("stage").innerHTML='<div class="pict gen"><b>'+esc(rev?q.r:q.h)+'</b><span class="case">'+(rev?"Genitiv":"→ Genitiv?")+'</span></div>';}
};
const BADGE={fall:q=>q.k==="c"?"Welcher Fall?":"Artikel",adj:q=>"Endung",prep:q=>q.x?q.a.split(" ")[0].toLowerCase():q.p==="fenster"?"an":(q.p||q.f||q.v.split(" ").pop()),art:q=>"Artikel",pron:q=>"Pronomen",gen:q=>"Genitiv"};
const TIP={fall:"Ask the question: Wer? Wen? Wem? Wessen? The answer names the case.",adj:"When in doubt, -en. It covers most cells.",prep:"Das Verb verrät den Fall: liegen, stehen, hängen → Dativ. legen, stellen, hängen → Akkusativ.",art:"Mark hard words with ☆. They come first in the next round.",pron:"helfen, danken, gefallen, gehören take Dativ: mir, dir, ihm.",gen:"des + -(e)s for masculine and neuter, der for feminine and plural.",test:"Each topic has its own Lernen and Theorie to go back to."};
function mcStart(t){MC={t,list:bank(t).map(mix),i:0,score:0,done:false,per:{}};}
function mcCount(){const q=MC.list[MC.i];$("ct").innerHTML=(q&&q.lv?'<span class="lv">'+q.lv+'</span> ':"")+(MC.i+1)+" / "+MC.list.length+" · "+MC.score+" richtig";}
function mcRender(){if(!MC||MC.t!==T)mcStart(T);clearTimeout(MC.tm);const q=MC.list[MC.i];MC.done=false;
  if(q.t==="prep")prLegend(false);else $("lg").innerHTML=LG[q.t]||(GT[q.t]&&GT[q.t].lg)||"";
  (STAGE[q.t]||gStage)(q,false);$("bd").textContent=(BADGE[q.t]||(q=>GT[q.t].badge))(q);mcCount();
  $("cardbody").innerHTML='<p id="tx">'+esc(q.s).replace("___",'<span class="gap" id="gap">&nbsp;</span>').replace(/\[(.+?)\]/,'<mark class="fm">$1</mark>')+'</p><div class="opts'+(q.o.some(w=>w.length>12)?" long":q.o.length===3?" three":"")+'">'+q.o.map((w,i)=>'<button class="opt" id="o'+i+'" data-i="'+i+'">'+esc(w)+'</button>').join("")+'</div>'+(store.timer?'<div class="tbar"><i id="tbi"></i></div>':'')+'<p id="gt"></p><p class="nf" id="nf">'+(store.arthelp&&baseOf(q)&&q.t!=="art"?'Grundform: <b>'+esc(baseOf(q))+'</b>':'')+'</p>';
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>mcAnswer(+b.dataset.i));
  setBtns("btns1",[btn("bW","Weiter →","",mcNext),btn("bR","Neu starten","",()=>{MC=null;render()})]);setBtns("btns2",[]);
  if(store.timer){const el=$("tbi");el.style.width="100%";setTimeout(()=>{el.style.transition="width 15s linear";el.style.width="0%";},30);MC.tm=setTimeout(()=>mcAnswer(-1),15000);}}
function mcAnswer(i){if(!MC||MC.done)return;MC.done=true;clearTimeout(MC.tm);const q=MC.list[MC.i];const tb=$("tbi");if(tb){tb.style.transition="none";tb.style.width=getComputedStyle(tb).width;}
  document.querySelectorAll(".opt").forEach((b,k)=>{if(k===q.c)b.classList.add("ok");else if(k===i)b.classList.add("bad");});
  {const g=$("gap");if(g)g.textContent=q.o[q.c];}const ok=i===q.c;if(ok)MC.score++;const p=MC.per[q.t]||(MC.per[q.t]=[0,0]);p[1]++;if(ok)p[0]++;
  $("gt").textContent=(i<0?"Zeit ist um. ":ok?"Richtig. ":"Nicht ganz. ")+q.why;mcCount();if(baseOf(q)&&q.t!=="art")$("nf").innerHTML="Grundform: <b>"+esc(baseOf(q))+"</b>";
  (STAGE[q.t]||gStage)(q,true);$("bW").className="primary";if(MC.i===MC.list.length-1)$("bW").textContent="Ergebnis →";}
function mcNext(){if(!MC.done){mcAnswer(-1);return;}if(MC.i<MC.list.length-1){MC.i++;mcRender();return;}
  const n=MC.list.length,s=MC.score,b=store.best||(store.best={});if(b[MC.t]==null||s/n>b[MC.t])b[MC.t]=s/n;save();
  const per=Object.entries(MC.per).map(([t,[a,m]])=>'<div><span>'+(TNAME[t]||GT[t].name)+'</span><span>'+a+' / '+m+'</span></div>').join("");
  $("lg").innerHTML="";$("stage").innerHTML='<p class="en big">'+s+' von '+n+' richtig</p><p class="en">'+(s/n>=.85?"Sehr gut!":s/n>=.6?"Gut. Noch eine Runde?":"Schau dir Lernen und Theorie noch einmal an.")+'</p>'+(MC.t==="test"?'<div class="rows" style="max-width:320px;margin:0 auto;width:100%">'+per+'</div>':'');
  $("bd").textContent="Ergebnis"+(store.level&&store.level!=="all"?" · "+store.level:"");$("cardbody").innerHTML='<p id="tx">Runde fertig</p><p id="gt">'+esc(TIP[MC.t]||(GT[MC.t]&&GT[MC.t].tip)||"")+'</p>';
  setBtns("btns1",[btn("bR","Noch eine Runde","primary",()=>{MC=null;render()}),btn("bL",MC.t==="test"?"Start":"Zu Lernen","",()=>MC.t==="test"?goHome():setMode("learn"))]);}

/* ---------- Satzbau ---------- */
function sbTokens(it){const t=[];it.clauses.forEach(c=>c.seg.forEach(([ty,tx])=>{if(!tx)return;tx.split(" ").forEach(w=>t.push({w,n:norm1(w),type:ty,clause:c}))}));return t;}
function sbGerman(it){const s=it.clauses.map(c=>c.seg.map(x=>x[1]).filter(Boolean).join(" ")).join(", ")+it.p;return s.charAt(0).toUpperCase()+s.slice(1);}
function frameHTML(it){return '<div class="frame">'+it.clauses.map(c=>{const L=c.k==="main"?{vf:"Vorfeld",v1:"Verb 1",mf:"Mittelfeld",v2:"Verb 2"}:{ein:"Einleitung",mf:"Mittelfeld",v2:"Verbende"};
  return '<div class="clause"><span class="ctag">'+(c.k==="main"?"Hauptsatz":"Nebensatz")+'</span><div class="grid'+(c.k==="sub"?" subc":"")+'">'+
   c.seg.map(([ty,tx])=>'<div class="cell '+ty+'"><small>'+L[ty]+'</small>'+(tx?'<span>'+esc(tx)+'</span>':'<span class="empty">'+(ty==="vf"?(c.ref?"↑ Nebensatz":"leer"):"–")+'</span>')+'</div>').join("")+'</div></div>';}).join("")+'</div>';}
function sbLegend(){$("lg").innerHTML='<span><i class="sw" style="background:var(--grey)"></i>Vorfeld</span><span><i class="sw" style="background:var(--mkey)"></i>Satzklammer</span><span><i class="sw" style="box-shadow:inset 0 0 0 1px var(--dot)"></i>Mittelfeld</span><span><i class="sw" style="background:var(--cream);box-shadow:inset 0 0 0 1px var(--line)"></i>Einleitung</span>';}
function sbLearn(){sbLegend();const it=SB[idx];
  $("stage").innerHTML='<p class="en">'+esc(it.en)+'</p><div id="fr" class="'+(self?"masked":"")+'">'+frameHTML(it)+'</div>';
  $("stage").onclick=()=>{const f=$("fr");if(f)f.classList.remove("masked");};
  $("bd").textContent=it.lvl;$("ct").textContent=(idx+1)+" / "+SB.length;
  $("cardbody").innerHTML='<p id="tx">'+esc(it.topic)+'</p><p id="gt">'+esc(it.note)+'</p>';
  setBtns("btns1",[btn("bZ","← Zurück","",()=>{idx=(idx-1+SB.length)%SB.length;render()}),btn("bW","Weiter →","primary",()=>{idx=(idx+1)%SB.length;render()})]);
  setBtns("btns2",[btn("bS","Selbsttest: "+(self?"an":"aus"),"",()=>{self=!self;render()}),btn("bH","Anhören","",()=>speak(sbGerman(it)))]);}
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
let rec=null;
function sbCur(){const L=sbList();return L[gi%L.length];}
function sbList(){return byLevel(SB.map(x=>Object.assign({lv:x.lvl},x)));}
function sbGame(){sbLegend();const L=sbList();const it=sbCur();
  $("stage").innerHTML='<p class="en big">'+esc(it.en)+'</p><div class="answer"><input id="ans" type="text" lang="de" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done" placeholder="Auf Deutsch …" aria-label="Deine Antwort"><button class="mic" id="mic" aria-label="Sprechen">'+MIC+'</button></div><p class="tip" id="tip">Sprechen: ins Feld tippen und das Mikrofon der Tastatur nutzen.</p><div id="res"></div>';
  $("stage").onclick=null;
  $("bd").textContent=it.lvl;$("ct").innerHTML='<span class="lv">'+it.lvl+'</span> '+(gi%L.length+1)+" / "+L.length+" · "+SB.filter(x=>store["sb"+x.id]==="ok").length+" richtig";
  $("cardbody").innerHTML='<p id="tx">'+esc(it.topic)+'</p><p id="gt">Sag oder schreib den Satz auf Deutsch.</p>';
  $("ans").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sbCheck();}});
  $("mic").onclick=micGo;
  setBtns("btns1",[btn("bP","Prüfen","primary",sbCheck),btn("bW","Weiter →","",()=>{gi=(gi+1)%sbList().length;render()})]);
  setBtns("btns2",[btn("bL","Lösung","",sbReveal),btn("bH","Anhören","",()=>speak(sbGerman(it)))]);}
function micGo(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const fail=()=>{$("tip").textContent="Spracheingabe ist hier gesperrt. Nutze das Mikrofon der Tastatur.";};
  if(!SR){fail();$("ans").focus();return;} if(rec){rec.stop();return;}
  try{rec=new SR();rec.lang="de-AT";rec.interimResults=true;
    rec.onresult=e=>{let s="";for(const r of e.results)s+=r[0].transcript;$("ans").value=s;if(e.results[e.results.length-1].isFinal)sbCheck();};
    rec.onerror=fail;rec.onend=()=>{rec=null;const m=$("mic");if(m)m.classList.remove("on");};rec.start();$("mic").classList.add("on");}catch(e){rec=null;fail();}}
function verbMsg(tk){const c=tk.clause,w="„"+tk.w+"“";
  if(c.k==="sub"){const ein=c.seg.find(x=>x[0]==="ein")[1].toLowerCase();return "After „"+ein+"“, "+w+" goes to the very end.";}
  if(tk.type==="v2")return w+" closes the verb bracket: it goes to the end of the clause.";
  const vf=c.seg.find(x=>x[0]==="vf")[1];
  if(c.ref)return w+" comes straight after the comma: the Nebensatz is the Vorfeld.";
  if(!vf)return w+" comes first: in a yes/no question the Vorfeld is empty.";
  return w+" is the conjugated verb: position 2, right after „"+vf+"“.";}
function sbCheck(){const it=sbCur(),raw=$("ans").value.trim();if(!raw){$("ans").focus();return;}
  const t=sbTokens(it),tn=t.map(x=>x.n),rawW=raw.split(/\s+/).filter(w=>norm1(w)),u=rawW.map(norm1),msgs=[];let ok=false;
  if(eq(u,tn))ok=true;else if(it.alt&&it.alt.some(a=>eq(normS(a),u))){ok=true;msgs.push("Correct German. This drill starts with „"+t[0].w+"“: try that version too.");}
  const used=t.map(()=>false),form=u.map(()=>false);let um=u.map(w=>{const i=t.findIndex((x,j)=>!used[j]&&x.n===w);if(i>=0)used[i]=true;return i;});
  if(!ok){const fm=[];um=um.map((m,k)=>{if(m>=0)return m;let b=-1,bd=99;t.forEach((x,j)=>{if(used[j])return;const d=lev(u[k],x.n);if(d<bd){bd=d;b=j}});
      if(b>=0&&bd<=Math.max(2,Math.floor(t[b].n.length/3))){used[b]=true;form[k]=true;fm.push("„"+rawW[k]+"“ → „"+t[b].w+"“");return b;}return -1;});
    for(let vi=0;vi<t.length;vi++){if(t[vi].type!=="v1"&&t[vi].type!=="v2")continue;const p=um.indexOf(vi);if(p<0)continue;
      const bef=new Set(um.slice(0,p).filter(m=>m>=0)),exp=new Set(um.filter(m=>m>=0&&m<vi));if(bef.size!==exp.size||[...exp].some(x=>!bef.has(x))){msgs.push(verbMsg(t[vi]));break;}}
    if(fm.length)msgs.push("Form: "+fm.join(", "));
    const miss=t.filter((x,j)=>!used[j]).map(x=>x.w);if(miss.length)msgs.push("Missing: "+miss.join(", "));
    const ex=rawW.filter((w,k)=>um[k]<0);if(ex.length)msgs.push("Not in this sentence: "+ex.join(", "));
    if(!msgs.length)msgs.push("Right words, different order. Compare with the frame.");}
  $("res").innerHTML='<div class="mine">'+rawW.map((w,k)=>'<span class="w '+(um[k]>=0?t[um[k]].type:"unk")+(form[k]?" form":"")+'">'+esc(w)+'</span>').join("")+'</div>'+(ok?"":frameHTML(it));
  $("cardbody").innerHTML='<p class="status '+(ok?"ok":"no")+'">'+(ok?"Richtig! "+esc(sbGerman(it)):"Fast. Zuerst das:")+'</p>'+(msgs.length?'<ul class="msgs">'+msgs.map(m=>'<li>'+esc(m)+'</li>').join("")+'</ul>':"");
  if(ok)store["sb"+it.id]="ok";else if(store["sb"+it.id]!=="ok")store["sb"+it.id]="try";save();
  $("ct").innerHTML='<span class="lv">'+it.lvl+'</span> '+(gi%sbList().length+1)+" / "+sbList().length+" · "+SB.filter(x=>store["sb"+x.id]==="ok").length+" richtig";
  if(ok)$("bW").className="primary",$("bP").className="";}
function sbReveal(){const it=sbCur();$("res").innerHTML=frameHTML(it);
  $("cardbody").innerHTML='<p id="tx">'+esc(sbGerman(it))+'</p><p id="gt">'+esc(it.note)+'</p>';}

/* ---------- Präpositionen ---------- */
function prLegend(learn){$("lg").innerHTML=learn?'<button id="lgWo" aria-pressed="'+(caseMode==="wo")+'">● Wo? = Dativ</button><button id="lgWohin" aria-pressed="'+(caseMode==="wohin")+'">→ Wohin? = Akkusativ</button>'
  :'<span style="color:var(--dat)">● Wo? = Dativ</span><span style="color:var(--akk)">→ Wohin? = Akkusativ</span>';
  if(learn){$("lgWo").onclick=()=>{caseMode="wo";render()};$("lgWohin").onclick=()=>{caseMode="wohin";render()};}}
function roomStage(p,m,showMk){$("stage").innerHTML=ROOM;const svg=$("stage").querySelector("svg");
  svg.classList.add(m);if(p)svg.classList.add("dim");if(!showMk)svg.classList.add("nomk");
  svg.querySelectorAll("[data-p]").forEach(g=>g.classList.toggle("sel",g.dataset.p===p));return svg;}
function pictStage(it,reveal){$("stage").innerHTML='<div class="pict '+(reveal?it.c:"hide")+'"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">'+ICON[it.p]+'</svg><b>'+esc(it.p)+'</b><span>'+esc(it.en)+'</span>'+(reveal?'<span class="case">immer '+(it.c==="akk"?"Akkusativ":"Dativ")+'</span>':"")+'</div>';$("stage").onclick=null;}
function verbStage(q,reveal){$("stage").innerHTML='<div class="pict '+(reveal?q.cs:"hide")+'"><b style="font-size:2.1rem">'+esc(q.v)+' + '+(reveal?(q.cs==="akk"?"Akk":"Dat"):"?")+'</b><span>Verb mit fester Präposition</span></div>';$("stage").onclick=null;}
function prLearn(){prLegend(true);const it=PR[idx];
  $("bd").textContent=it.p;$("ct").textContent=(idx+1)+" / "+PR.length;
  if(it.k==="room"){const svg=roomStage(it.o||it.p,caseMode,true);
    svg.querySelectorAll(".obj").forEach(g=>g.addEventListener("click",()=>{const j=PR.findIndex(x=>(x.o||x.p)===g.dataset.p);if(j>=0){idx=j;render();}}));
    $("cardbody").innerHTML='<p id="tx" style="'+(caseMode==="wo"?"":"opacity:.5")+'">'+mk(it.wo,"d")+'</p><p id="gt" style="font-size:1.1rem;color:var(--fg);'+(caseMode==="wohin"?"":"opacity:.5")+'">'+mk(it.wohin,"a")+'</p>';}
  else{pictStage(it,true);$("cardbody").innerHTML='<p id="tx">'+mk(it.ex,it.c==="akk"?"a":"d")+'</p><p id="gt">'+esc(it.en)+' · immer '+(it.c==="akk"?"Akkusativ":"Dativ")+'</p>';}
  setBtns("btns1",[btn("bZ","← Zurück","",()=>{idx=(idx-1+PR.length)%PR.length;render()}),btn("bW","Weiter →","primary",()=>{idx=(idx+1)%PR.length;render()})]);
  setBtns("btns2",[it.k==="room"?btn("bC",caseMode==="wo"?"Zeig: Wohin?":"Zeig: Wo?","",()=>{caseMode=caseMode==="wo"?"wohin":"wo";render()}):btn("bC","Alle Präpositionen","",()=>{idx=0;render()}),
    btn("bH","Anhören","",()=>speak(plain(it.k==="room"?it[caseMode]:it.ex)))]);}
try{speechSynthesis.getVoices();}catch(e){}
/* phone back button: pop-up → topic → start page, and never leave the app */
function navState(){try{return history.state&&history.state.dg;}catch(e){return null;}}
function navPush(v){try{history.pushState({dg:v},"");}catch(e){}}
try{history.replaceState({dg:"base"},"");history.pushState({dg:"home"},"");}catch(e){}
window.addEventListener("popstate",e=>{const st=e.state&&e.state.dg;
  if(GP.open){closePop();if(st==="topic")return;}
  if(!$("topic").hidden&&st!=="topic"){goHome();}
  if(st==="base"||!st){navPush("home");}});
renderHome();
</script>
