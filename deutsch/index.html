/* Layout: dasein-design language — white sheet, dashed guide lines down both sides with edge ticks, dotted frames, square grey bars, lime for "active". Single light theme on purpose, like the website. */
:root{color-scheme:light;--bg:#ffffff;--fg:#222222;--ink:#3a3c37;--muted:#666666;--line:#c4c4c4;--dot:#b8b8b8;--grey:#ebebeb;--pale:#f4f4f2;
--lime:#cdff3e;--limepale:#eaffae;--red:#e30613;--yellow:#ffd400;--cream:#fffbd6;
--m-learn:#8c918a;--m-game:#ffd400;--m-theo:#3a3c37;
--dat:#1a5fd0;--akk:#e30613;--ok:#3f8f1f;--bad:#e30613;
--df:repeating-linear-gradient(to right,var(--dot) 0 1px,transparent 1px 3px);--dfk:repeating-linear-gradient(to right,var(--ink) 0 2px,transparent 2px 4px);--dash:repeating-linear-gradient(to right,var(--line) 0 4px,transparent 4px 7px);--dfv:repeating-linear-gradient(to bottom,var(--dot) 0 1px,transparent 1px 3px);
--body:"Carlito",Calibri,"Segoe UI",system-ui,sans-serif}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.35}
.app{position:relative;height:100%;min-height:600px;max-width:520px;margin:0 auto;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));padding-block:8px 8px;display:flex;flex-direction:column;gap:8px}
/* guide lines + ticks */
.rule{position:absolute;top:0;bottom:0;width:1px;pointer-events:none;background:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 7px)}
.rule.l{left:8px}.rule.r{right:8px}
.tk{position:absolute;left:8px;right:8px;height:8px;pointer-events:none;--t:repeating-linear-gradient(to right,var(--dot) 0 4px,transparent 4px 6px);
 background:var(--t) left top/10px 1px no-repeat,var(--t) left bottom/10px 1px no-repeat,var(--t) right top/10px 1px no-repeat,var(--t) right bottom/10px 1px no-repeat}
.tk.t{top:52px}.tk.b{bottom:30px}
/* dotted frame */
.df{position:relative}
.df::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--df) left top/100% 1px no-repeat,var(--df) left bottom/100% 1px no-repeat,var(--dfv) left top/1px 100% no-repeat,var(--dfv) right top/1px 100% no-repeat}
button{font:inherit;font-size:1rem;padding:9px 8px;border-radius:0;border:0;background:var(--grey);color:var(--fg);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{background:var(--lime)}
button.primary{background:var(--limepale);font-weight:700;box-shadow:inset 0 0 0 1px var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--dat);outline-offset:2px}
small.n{font-size:.62em;font-weight:400;margin-left:4px;color:var(--muted)}
/* title */
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;height:44px;
 background:var(--df) left bottom/100% 1px no-repeat}
h1{font-weight:700;font-size:1.25rem;color:var(--fg);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:center}
h1.logo{text-align:left;font-size:1.85rem;font-weight:400;color:var(--red);letter-spacing:-.01em}
h1.logo b{font-weight:700}
.back{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:.95rem;background:transparent}
.back svg{width:18px;height:18px}
.spacer{flex:none;width:70px}
/* home */
.home{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.intro{margin:4px 0 2px;font-size:1rem;color:var(--muted)}
.tile{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;padding:10px 12px 10px 10px;background:var(--bg);width:100%}
.tile .code{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#bdbdbd;color:var(--fg);font-size:1.05rem;box-shadow:inset 0 0 0 1px var(--ink)}
.tile.ready .code{background:var(--lime)}
.tile .nm{font-weight:700;font-size:1.2rem;line-height:1.15}
.tile .ds{font-size:.95rem;color:var(--muted);line-height:1.25;margin-top:2px}
.tile .st{font-size:.85rem;font-weight:700;padding:5px 9px;white-space:nowrap}
.tile .st.ready{background:var(--limepale)}
.tile .st.soon{background:var(--grey);color:var(--muted);font-weight:400}
.tile.soon{opacity:.6;cursor:default}
/* topic */
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;flex:none}
.seg button{background:var(--grey);padding:7px 4px;font-size:1rem}
.seg button{position:relative}
.seg button[aria-pressed="true"]{font-weight:700}
#mLearn[aria-pressed="true"]{background:var(--m-learn);color:#fff}
#mGame[aria-pressed="true"]{background:var(--m-game);color:#111}
#mTheo[aria-pressed="true"]{background:var(--m-theo);color:#fff}
.seg button[aria-pressed="true"] small.n{color:inherit;opacity:.8}
.app[data-mode="learn"] .card{box-shadow:inset 0 3px 0 var(--m-learn)}
.app[data-mode="game"] .card{box-shadow:inset 0 3px 0 var(--m-game)}
.app[data-mode="learn"] button.primary{background:var(--m-learn);color:#fff;box-shadow:none}
.app[data-mode="game"] button.primary{background:var(--m-game);color:#111;box-shadow:none}
.app[data-mode="theo"] .gintro{color:var(--fg)}
.opt.ok::after{content:" ✓"}
.lg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:.9rem;color:var(--muted);flex:none}

.www{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(3,minmax(0,1fr));gap:2px 6px;font-size:.92rem;line-height:1.25}
.www span{padding:5px 0;background:var(--df) left bottom/100% 1px no-repeat}
.www .h{font-weight:700}.www .k{color:var(--muted);font-size:.8rem}
.arc{position:relative;width:100%;padding:0}
.arc.up{padding-top:36px}.arc.dn{padding-bottom:30px}
.arc svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.toks{display:flex;flex-wrap:nowrap;justify-content:center;gap:3px;font-size:1.2rem;white-space:nowrap;overflow:hidden}
.wt{padding:2px 4px;line-height:1.3}
.wt.s{background:var(--grey)}.wt.v{background:var(--lime);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.wt.a{box-shadow:inset 0 0 0 1.5px var(--akk);color:var(--akk)}.wt.d{box-shadow:inset 0 0 0 1.5px var(--dat);color:var(--dat)}
.wt.g{background:var(--cream)}.wt.k{background:var(--cream);box-shadow:inset 0 0 0 1px var(--line);font-weight:700}
.wt.r{background:var(--cream);box-shadow:inset 0 -2px 0 var(--ink);font-weight:700}.wt.x{background:var(--limepale)}
.wt.ng{background:var(--ink);color:#fff;font-weight:700}
.wt.p{padding:2px 0;margin-left:-3px}
.al{fill:none;stroke-width:1.6}.al-v{stroke:var(--ink)}.al-a{stroke:var(--akk)}.al-d{stroke:var(--dat)}.al-g{stroke:var(--muted);stroke-dasharray:3 3}
text.alt{stroke:none;font-family:var(--body);font-size:11px;font-weight:700}text.al-v{fill:var(--ink)}text.al-a{fill:var(--akk)}text.al-d{fill:var(--dat)}text.al-g{fill:var(--muted);font-weight:400}
.arcap{margin:6px 0 0;text-align:center;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.pas{display:flex;flex-direction:column;gap:4px;width:100%}
.parr{text-align:center;color:var(--muted);font-size:1.2rem;line-height:1.2}.parr small{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.tlz{position:relative;width:100%;max-width:380px;margin:0 auto;padding-left:24px;display:flex;flex-direction:column}
.tlax{position:absolute;left:8px;top:10px;bottom:10px;width:1px;background:repeating-linear-gradient(to bottom,var(--ink) 0 4px,transparent 4px 6px)}
.tlc{position:relative;display:grid;grid-template-columns:8.6em minmax(0,1fr);gap:0 10px;padding:6px 0;background:var(--df) left bottom/100% 1px no-repeat}
.tlc::before{content:"";position:absolute;left:-20px;top:15px;width:12px;height:1px;background:var(--ink)}
.tlc b{font-size:1rem}.tlc span{font-size:1rem}.tlc small{grid-column:2;font-size:.78rem;color:var(--muted)}
.tlc .clk{display:inline-block;padding:0 5px;background:var(--grey);color:var(--fg);font-size:.76rem}
.go{display:inline;padding:0 0 0 4px;min-height:0;background:transparent;font-size:.82rem;color:var(--dat);text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap}.go:active{background:var(--limepale)}
.nt.wq>div>*{padding-top:6px;padding-bottom:6px}
.tlc.now b{background:var(--lime);box-shadow:inset 0 0 0 1px var(--ink);padding:0 5px;justify-self:start}
.box .c.new{background:var(--cream)}
.pict b.gh{font-size:1.45rem;line-height:1.35;text-align:center;text-wrap:balance;font-weight:700}
.pict b.grh b{background:var(--lime);padding:0 4px;box-shadow:inset 0 0 0 1px var(--ink)}
.gd{width:100%}
.opts.long{grid-template-columns:1fr}.opts.long .opt{font-size:1.05rem;font-weight:400;text-align:left;padding:8px 12px}
b.lgk{font-size:.8rem;padding:0 5px;margin:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
[hidden]{display:none!important}
.lg{flex-wrap:nowrap;gap:4px 9px;font-size:.82rem;white-space:nowrap}.lg span,.lg button{gap:4px}.lg .sw{width:12px;height:9px}
/* ---- start page: groups ---- */
.home{overflow:hidden;gap:8px;padding-bottom:0}
.brand{display:flex;align-items:flex-end;gap:10px;min-width:0}
.home h1.logo{display:flex;align-items:baseline;gap:7px;line-height:.74;font-size:1.75rem;white-space:nowrap;margin:0}.home h1.logo span{font-size:.95rem;letter-spacing:.07em;color:var(--ink)}.home .markb{padding-bottom:0;margin-bottom:0}.home .brand{width:100%}

.home h1.logo{flex:1;justify-content:center;gap:6px;cursor:pointer;min-width:0;overflow:visible}.home .mark{width:46px;height:16px}
.home h1.logo b{font-family:DdBar,Carlito,sans-serif;font-weight:600;font-size:1.22rem;letter-spacing:.08em;color:var(--red)}
.home h1.logo span{font-family:DdCor,Georgia,serif;font-weight:500;font-size:1.42rem;letter-spacing:0;color:var(--ink)}.mark{width:60px;height:21px}
.markb{background:transparent;padding:12px 4px;margin:-12px -4px;flex:none;display:flex}.mark{width:54px;height:19px;flex:none}.mark .fl{opacity:0;transition:opacity .35s}.markb.on .mark .fl{opacity:1}.mark .mo{fill:none;stroke:var(--ink);stroke-width:6}.mark .mi{fill:none;stroke:var(--ink);stroke-width:3}.mark .md{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:3 9}
.gear{width:44px;height:44px;padding:0;display:grid;place-items:center;flex:none}.gear svg{width:22px;height:22px}
.gear[aria-expanded="true"]{background:var(--ink);color:#fff}
.sets{display:flex;flex-direction:column;gap:4px;padding:4px 0 8px;background:var(--df) left bottom/100% 1px no-repeat}
.lvsel #lvs{display:flex;gap:4px;width:100%}.lvsel .lvb{flex:1;min-height:34px}
.resume{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:#fff6b0;padding:9px 12px;flex:none}
.resume small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#555}.resume b{font-size:1.08rem}
.grp{background:var(--df) left bottom/100% 1px no-repeat}
/* striped rows: 01 grey, 02 white, 03 grey …; the open group turns pale lime, like the section you are in */
/* the stripes separate the groups, so no dotted line between them */
.grp,.grp:nth-child(odd){background:var(--pale)}.grp:nth-child(even){background:#fff}
.grp.open,.grp.open:nth-child(odd){background:var(--limepale)}
.grp .grh .no{background-color:#fff}.grp.open .grh .no{background-color:var(--ink)}
.grp .grh{padding-right:8px}
.grp:nth-child(odd) .grh .prog,.grp.open .grh .prog{background:#fff}
.grh{display:grid;grid-template-columns:30px minmax(0,1fr) 64px 1.1em;align-items:center;gap:4px 12px;width:100%;min-height:58px;background:transparent;text-align:left;padding:4px 0}
.grh .no{width:30px;height:30px;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--ink);position:relative}.grh .no::after{content:"";position:absolute;inset:0;background:var(--df) left top/100% 1px no-repeat,var(--df) left bottom/100% 1px no-repeat,var(--dfv) left top/1px 100% no-repeat,var(--dfv) right top/1px 100% no-repeat}.grp.open .grh .no{background:var(--ink);color:#fff}.grp.open .grh .no::after{display:none}.grh b{display:block;font-size:1.22rem;line-height:1.15}.grh small{font-size:.82rem;color:#555}
.grh .pm{font-size:1.3rem;line-height:1;text-align:center}
.prog{display:block;height:3px;background:var(--grey)}.prog i{display:block;height:3px;background:var(--ink)}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 0 10px 42px}
.tt{display:flex;flex-direction:column;justify-content:space-between;gap:5px;min-height:48px;padding:6px 8px;background:var(--bg);text-align:left;position:relative}
.tt::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--df) left top/100% 1px no-repeat,var(--df) left bottom/100% 1px no-repeat,var(--dfv) left top/1px 100% no-repeat,var(--dfv) right top/1px 100% no-repeat}
.tt .r{display:flex;justify-content:space-between;align-items:baseline;gap:4px}.tt b{font-size:1rem;line-height:1.15}.tt small{font-size:.72rem;color:#555;white-space:nowrap}
.tt.dim{opacity:.45}
.soonl{grid-column:1/-1;font-size:.82rem;color:#555;padding-top:2px}
.dbar{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:2px;background:var(--dfk) left top/100% 2px no-repeat,var(--df) left bottom/100% 1px no-repeat;padding-top:2px;touch-action:pan-y}
.db{display:flex;align-items:center;gap:5px;height:40px;padding:0 9px;background:#fff;font-size:.95rem;text-align:left;white-space:nowrap;overflow:hidden;border-right:1px dotted var(--dot)}
.db:nth-child(3n){border-right:0}.db:nth-child(n+4){background:var(--df) left top/100% 1px no-repeat,#fff}
.db b{font-weight:700}.db small{font-size:.66rem;color:#555}
.db.on{background-color:var(--limepale)}.db:nth-child(n+4).on{background:var(--df) left top/100% 1px no-repeat,var(--limepale)}.db.on small{color:var(--fg)}.db:active{background-color:var(--lime)}
/* start page = dasein-design phone site (?stack=2): one long page of six sections; each section's half bar flows above it,
   sticks at the top once its page has arrived and waits at the bottom while it is still to come; the page you are in is pale lime,
   the others pale grey; a tap lights the bar (lime) and then the page moves there */
.hbody{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
.hscroll{position:relative;height:100%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;display:block;scrollbar-width:none;overscroll-behavior:contain}.hscroll::-webkit-scrollbar{display:none}
.hb{position:sticky;z-index:14;display:flex;align-items:center;height:23px;padding:0 10px;font-size:12px;color:#000;cursor:pointer;white-space:nowrap;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:background-color .15s;
  background:repeating-linear-gradient(to right,#b8b8b8 0 1px,transparent 1px 3px) left top/100% 1px no-repeat,repeating-linear-gradient(to right,#b8b8b8 0 1px,transparent 1px 3px) left bottom/100% 1px no-repeat,#fff}
.hb b{font-weight:700}.hb small{font-size:8.5px;margin-left:4px}
.hb.hl{margin:39px 50% -1px 0}.hb.hr{margin:39px 0 -1px calc(50% - 1px)}
.hb.on{background-color:#eaffae!important}.hb.hit{background-color:#cdff3e!important}
.sback{position:absolute;left:0;right:0;z-index:13;background:#fff;pointer-events:none}
.hp{display:flex;flex-direction:column;gap:10px;padding-top:10px}#p-home{gap:8px}
/* LINES (as on dasein-design): dashed = the frame of the screen (side guides, under the header, the arrow bar);
   dotted = separates items in a list (rows, bars); no boxes round content; headings are small red capitals; a choice is shown by a fill, not a line */
.hp .tc{padding:0 0 18px;background:none}.hp .df::after{display:none}
.hp .tc h3{margin:8px 0 4px;padding:0;background:none;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}.hp .tc h3 small{display:none}
.home .titlebar{position:relative;background:none}.home .titlebar::after{content:"";position:absolute;left:-10px;right:-10px;bottom:0;border-bottom:1px dashed var(--line);transition:border-color .15s}
#home:has(.hbody.tstk) .titlebar::after{border-color:transparent}
#home .hbody{margin-top:-8px}
.app:has(#home:not([hidden])) .tk.t{display:none}
.grh .no::after,.tt::after{display:none}.grp .grh .no{background:transparent}.grp.open .grh .no{background:var(--ink)}
.tt{background:#fff}.grp:nth-child(odd):not(.open) .tt{background:#fff}
.tests{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:4px}
.tst{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:58px;padding:8px 10px;background:var(--pale);text-align:left}
.tst b{font-size:1.25rem}.tst small{font-size:.75rem;color:#555}.tst[data-l="mix"]{background:var(--yellow)}.tst:active{background:var(--lime)}
.hp .copy{margin-top:6px}
/* title page: the German-speaking countries, with the six round circles of the dasein-design start page around them */
.tp{position:relative;overflow:clip}
.tstage{position:relative;height:100%;min-height:inherit}
.tmap{position:absolute;left:13%;right:13%;top:6%;bottom:8%;width:74%;height:86%;overflow:visible;cursor:pointer}
.tmap path,.tmap circle{stroke:#fff;stroke-width:2.5;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.tmap .nb{fill:#f1f1ef}.tmap .co{fill:#e30613}.tmap .lt{fill:#f4b4b0}.tmap path.lt[data-c="ST"]{stroke:#e30613;stroke-width:1.5;stroke-dasharray:4 4}
/* country codes in small white squares */
.tmap .cc rect{fill:#fff;stroke:none}.tmap .cc text{font:700 27px Carlito,Calibri,sans-serif;letter-spacing:.06em;text-anchor:middle;dominant-baseline:central;fill:#3a3c37}
.tmap .cc.co text{fill:#e30613}.tmap .cc.lt text{fill:#c0504a}.tmap .cc.nb text{fill:#9a9a96;font-weight:400}.tmap .cc.st text{font-size:20px;font-weight:400;font-style:italic}
.tp.enter .ccs,.tp.enter .caps{opacity:0}.tmap .ccs,.tmap .caps{transition:opacity .5s}
.tmap .caps text{font:400 21px Carlito,Calibri,sans-serif;fill:#3a3c37;dominant-baseline:central;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}.tmap .caps text.w{text-anchor:end}
.tmap .caps circle{fill:#ffd400;stroke:#000;stroke-width:2.5}
.tkey{position:absolute;left:0;right:0;bottom:2px;margin:0;text-align:center;font-size:11px;letter-spacing:.04em;color:#666}
.tkey i{display:inline-block;width:10px;height:10px;margin:0 4px -1px 8px}.tkey i.co{background:#e30613}.tkey i.lt{background:#f4b4b0}
.tp .pin{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:3px;width:25vw;max-width:110px;padding:0;border:0;background:none;font:inherit;color:#000;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transform:translateY(-11.5px)}
.tp .pin:active{background:none}
.tp .pin.l{left:0}.tp .pin.r{right:0}
.tp .pin b{position:relative;display:flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:50%;background:#bfbfbf;font-weight:400;font-size:11.5px;box-shadow:inset 0 0 0 1px #000;transition:background .15s;
  animation:pinon 9s ease-in-out infinite;animation-delay:calc(var(--k) * 1.5s)}
.tp .pin b::before,.tp .pin b::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1.6px solid var(--c1,var(--red));opacity:0;pointer-events:none;animation:pinring 9s ease-out infinite;animation-delay:calc(var(--k) * 1.5s + .3s)}
.tp .pin b::after{border-color:var(--c2,var(--red));animation-delay:calc(var(--k) * 1.5s + .6s)}
@keyframes pinon{0%{background:#bfbfbf}2.5%{background:#cdff3e}14%{background:#cdff3e}16.7%{background:#bfbfbf}100%{background:#bfbfbf}}
@keyframes pinring{0%{transform:scale(1);opacity:.9}12.5%{transform:scale(2.3);opacity:0}100%{transform:scale(2.3);opacity:0}}
.tp .pin:nth-of-type(1){--c1:#ffd400;--c2:#2f8cff}.tp .pin:nth-of-type(2){--c1:#2fbf4a;--c2:#ffd400}.tp .pin:nth-of-type(3){--c1:#2f8cff;--c2:#cdff3e}.tp .pin:nth-of-type(4){--c1:#e30613;--c2:#2fbf4a}.tp .pin:nth-of-type(5){--c1:#cdff3e;--c2:#e30613}.tp .pin:nth-of-type(6){--c1:#3a3c37;--c2:#ffd400}
.tp .pin span{font-size:12px;line-height:1.15;background:rgba(255,255,255,.85);padding:1px 3px}
.tp .pin.hit b{animation:none!important;background:#cdff3e!important;box-shadow:inset 0 0 0 1px var(--red)}.tp .pin.hit span{color:var(--red)}
.tp .pin:active b{animation:none;background:#a5e35a;box-shadow:inset 0 0 0 1px var(--red)}
.tp .leads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1}
.tp .leads path{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:1.2 2.2}
.tp .leads circle{fill:#ffd400;stroke:#000;stroke-width:1.2}
.tp.enter .pin,.tp.enter .leads,.tp.enter .tkey{opacity:0}.tp .pin,.tp .leads,.tp .tkey{transition:opacity .5s}
@media (prefers-reduced-motion:reduce){.tp .pin b,.tp .pin b::before,.tp .pin b::after{animation:none}}
.hb.first{margin-top:14px}
/* bottom arrow bar, as on the dasein-design phone site: dashed line above (hidden where the waiting bars already draw one) and below, the round N arrow in the middle, its word hanging off to the right */
.abar{flex:none;position:relative;height:30px;margin:-8px -10px 0;display:flex;align-items:center;justify-content:center;border-top:1px dashed var(--line);background:#fff}
.abar::after{content:"";position:absolute;left:0;right:0;top:29px;border-top:1px dashed var(--line);pointer-events:none}
.hbody.bstk+.abar{border-top-color:transparent}
.abar button{position:relative;border:0;background:none;padding:3px 24px;display:flex;align-items:center;-webkit-tap-highlight-color:transparent;transition:opacity .2s}
.abar button:active{background:none}
.abar i{font-style:normal;position:absolute;left:calc(50% + 17px);top:50%;transform:translateY(-50%);white-space:nowrap;font-size:11px;letter-spacing:.06em;color:#666}
.abar .tp{display:none;font-size:12px;color:#3a3c37}.abar .top .tp{display:block}.abar .top .sc{display:none}
.ar{overflow:visible}.ar .rg{fill:none;stroke:#3a3c37;stroke-width:1px}.ar .dt{fill:#4d4f4a;stroke:#1a1a1a;stroke-width:1px;stroke-linejoin:round}
.ar text{fill:#3a3c37;font:700 6.4px Calibri,Carlito,sans-serif;text-anchor:middle;dominant-baseline:central}.ar .tr{display:none}
.abar .go .tr{display:block;fill:none;stroke:#3a3c37;stroke-width:.7;transform-box:fill-box;transform-origin:center;animation:ring 2.2s ease-out infinite}.abar .go .tr2{animation-delay:1.1s}
@keyframes ring{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.ar .tr{animation:none!important;display:none!important}}
#home{overflow:clip;gap:8px}
/* on the start page the arrow bar is the foot of the screen (the copyright moves to the end of the last section); the bottom tick pair sits inside it, level with the arrow */
#home:not([hidden]) ~ footer.copy{display:none}
.app:has(#home:not([hidden])){padding-bottom:0}
.app:has(#home:not([hidden])) .tk.b{bottom:9px;height:11px}
.drawer{position:absolute;inset:0;z-index:5;background:#fff;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s ease}
.drawer.up{transform:none}
.dbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.dbody .tc h3{margin:0 0 6px;font-size:1.1rem}
.dgo{background:var(--yellow);font-weight:700;min-height:48px;width:100%}
.hist{display:grid;grid-template-columns:4.2em minmax(0,1fr);font-size:.98rem;line-height:1.3}
.hist>*{padding:7px 0;background:var(--df) left bottom/100% 1px no-repeat}.hist b{font-weight:700}.hist span{padding-left:8px;background:var(--df) left bottom/100% 1px no-repeat,var(--dfv) left top/1px 100% no-repeat}
.hbar{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding-top:6px;background:var(--df) left top/100% 1px no-repeat}
.hbar button{min-height:44px}.hbar .t{background:var(--yellow);font-weight:700}

/* ---- bars: a dotted divider in the middle between the two halves of a row, wherever the bars are (waiting, stuck or moving) ---- */
.hb{--hv:repeating-linear-gradient(to bottom,#b8b8b8 0 1px,transparent 1px 3px)}
.hb.hl{background:repeating-linear-gradient(to right,#b8b8b8 0 1px,transparent 1px 3px) left top/100% 1px no-repeat,repeating-linear-gradient(to right,#b8b8b8 0 1px,transparent 1px 3px) left bottom/100% 1px no-repeat,var(--hv) right top/1px 100% no-repeat,#fff}
.hb.hr{background:repeating-linear-gradient(to right,#b8b8b8 0 1px,transparent 1px 3px) left top/100% 1px no-repeat,repeating-linear-gradient(to right,#b8b8b8 0 1px,transparent 1px 3px) left bottom/100% 1px no-repeat,var(--hv) left top/1px 100% no-repeat,#fff}
/* ---- Geschichte: rows striped grey / white like the downloads & links of dasein-design, with a small blue link button ---- */
.hlist{display:flex;flex-direction:column}
.hi{display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:8px;align-items:baseline;padding:9px 10px 10px;background:#fff;font-size:1.02rem;line-height:1.3}
.hi:nth-child(odd){background:#f4f4f2}
.hi>b{font-weight:700;overflow-wrap:anywhere}
.hi>span{min-width:0;overflow-wrap:anywhere;hyphens:auto}
.hi a.wk{display:inline-block;margin:6px 0 0 8px;padding:1px 8px 2px;font-size:11px;font-weight:700;letter-spacing:.04em;color:#1a5fd0;background:#dfe9fa;text-decoration:none;vertical-align:1px}
.hi a.wk:active{background:#bcd0f3}
/* ---- tests: length ---- */
.tlen{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:.95rem;color:var(--muted)}
.tlen button{padding:4px 12px;font-size:.95rem;background:var(--pale)}
.tlen button[aria-pressed="true"]{background:var(--lime);font-weight:700;color:var(--fg);box-shadow:none}
.tst.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;min-height:48px}
/* ---- TEKAMOLO ---- */
.tkm{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:0;font-size:1.05rem;line-height:1.2;max-width:100%}
.tkm>div{padding:5px 7px 7px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;min-width:0}
.tkm small{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:#555}
.tkm span{font-weight:400}
.tkm .te,.tkm .ka,.tkm .mo,.tkm .lo{font-weight:700}.tkm .te span,.tkm .ka span,.tkm .mo span,.tkm .lo span{font-weight:700}
.tkm .v span{font-weight:700}.tkm .v{background:var(--mkey)}
.tkm .o{background:var(--mnom)}
.te,.lg .sw.te{background:#e6e6e3}.ka,.lg .sw.ka{background:#f5efcf}.mo,.lg .sw.mo{background:#e3efb4}.lo,.lg .sw.lo{background:#d3def0}
.tkm .te,.tkm .ka,.tkm .mo,.tkm .lo{}
/* ---- Text prüfen ---- */
.wchips{display:flex;flex-wrap:wrap;gap:4px}
.wchips button{padding:4px 12px;font-size:.95rem;background:var(--pale)}
.wchips button[aria-pressed="true"]{background:var(--lime);font-weight:700;box-shadow:none}
.wprompt{margin:6px 0 0;font-size:1.05rem;line-height:1.35}
#wtask,#wlang{font:inherit;font-size:1rem;padding:8px;border:0;border-radius:0;background:#f8f8f6;color:var(--fg);min-width:0;max-width:100%;outline:1px dotted #b8b8b8;outline-offset:-1px}
#wtx{display:block;width:100%;min-height:340px;font:inherit;font-size:1.08rem;line-height:1.4;padding:10px 12px;border:0;border-radius:0;background:#f8f8f6;color:var(--fg);outline:1px dotted #b8b8b8;outline-offset:-1px;resize:vertical}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wfile{font-size:.95rem;color:#1a5fd0;font-weight:700;cursor:pointer;padding:4px 0}
.wscore{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.wscore b{font-size:2.6rem;line-height:1}.wscore span{font-size:1.15rem;font-weight:700}
.wtxt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:1.05rem;line-height:1.5;margin:0;padding:0}
.wtxt mark.er{background:#fbe3e1;color:var(--fg);border-bottom:2px solid var(--red);font-weight:400;padding:0}
.wtxt mark.st{background:none;border-bottom:2px dotted var(--muted);font-weight:400;padding:0}
.wsl{display:flex;flex-direction:column}
.ws{display:grid;grid-template-columns:26px minmax(0,1fr);gap:2px 8px;padding:8px 10px 9px;align-items:start}
.ws.g{background:#e3efb4}.ws.r{background:#f5e0dd}.ws:nth-child(odd).g{background:#d9e8a4}
.ws>b{grid-row:1;font-size:1.15rem;line-height:1.3;text-align:center}.ws.g>b{color:#2f5d0a}.ws.r>b{color:var(--red)}
.ws .wtxt{grid-column:2}.ws .wwhy{grid-column:2;display:flex;flex-direction:column;gap:3px;font-size:.92rem;line-height:1.3;padding:5px 0 0;background:var(--df) left top/100% 1px no-repeat}
.ws .wwhy .sg{display:flex;flex-wrap:wrap;gap:4px}.ws .wwhy .sg i{font-style:normal;font-weight:700;padding:1px 7px;background:var(--mkey)}
.wup{align-self:flex-start;font:inherit;font-size:.8rem;font-weight:700;border:0;border-radius:0;padding:3px 9px;background:var(--mdat,#d3def0);color:var(--ink);cursor:pointer}
.wf{padding:8px 10px 9px;display:flex;flex-direction:column;gap:3px;font-size:.98rem;line-height:1.3}
.wf:nth-child(odd){background:#f4f4f2}
.wf .cx{overflow-wrap:anywhere}.wf .cx mark.er{background:#fbe3e1;border-bottom:2px solid var(--red);font-weight:700;padding:0}
.wf .sg{display:flex;flex-wrap:wrap;gap:4px}.wf .sg i{font-style:normal;font-weight:700;padding:1px 7px;background:var(--mkey)}
.wf small{color:#555;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
/* ---- Theorie as a list ---- */
.tlist{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;background:var(--df) left bottom/100% 1px no-repeat;text-align:left;width:100%}
.tli .no{font-size:.8rem;color:var(--muted)}.tli b{display:block;font-size:1.1rem;line-height:1.2}.tli .pv{display:block;font-size:.92rem;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tli small{font-size:.75rem;color:#555;white-space:nowrap}
.tli:active{background:var(--pale)}
/* ---- tables: muted fills, fine dotted lines, no gaps ---- */
:root{--mnom:#e6e6e3;--makk:#f4dcd8;--makk2:#e9b9b3;--mdat:#d3def0;--mgen:#f5efcf;--mkey:#e3efb4;--dl:#8c918a;--akkt:#a3241c;--datt:#1d4f9e}
.box{gap:0}.box .c{border-right:1px dotted var(--dl);border-bottom:1px dotted var(--dl)}
.c.nom,.c.same{background:var(--mnom)}.c.akk{background:var(--makk);box-shadow:none;color:var(--akkt)}.c.dat{background:var(--mdat);box-shadow:none;color:var(--datt)}.c.gen{background:var(--mgen);box-shadow:none}
.qc.nom{background:var(--mnom)}.qc.akk{background:var(--makk);box-shadow:none}.qc.akk b{color:var(--akkt)}.qc.dat{background:var(--mdat);box-shadow:none}.qc.dat b{color:var(--datt)}.qc.gen{background:var(--mgen)}
.all4 .nom,.all4k .nom,.lgc.nom{background:var(--mnom)}.all4 .akk,.all4k .akk,.lgc.akk{background:var(--makk);box-shadow:none;color:var(--akkt)}.all4 .dat,.all4k .dat,.lgc.dat{background:var(--mdat);box-shadow:none;color:var(--datt)}.all4 .gen,.all4k .gen,.lgc.gen{background:var(--mgen)}
.pict.fc-nom b{background:var(--mnom)}.pict.fc-akk b{background:var(--makk);box-shadow:none;color:var(--akkt)}.pict.fc-dat b{background:var(--mdat);box-shadow:none;color:var(--datt)}.pict.fc-gen b{background:var(--mgen)}
.adjt{gap:0}.adjt b{border-right:1px dotted var(--dl);border-bottom:1px dotted var(--dl)}.adjt b.en{background:var(--mnom)}.adjt b.x{background:var(--mkey);box-shadow:none}
.lgx{background:var(--mkey);box-shadow:none}.lgx.en{background:var(--mnom)}
.grid{gap:0}.grid .cell+.cell{border-left:1px dotted var(--dl)}
.cell.vf{background:var(--mnom)}.cell.v1,.cell.v2{background:var(--mkey);box-shadow:none}.cell.ein{background:var(--mgen)}
.pc{background:var(--mnom)}.pc.k{background:var(--mkey);box-shadow:none}.pc.g{background:var(--mgen)}.gn{background:var(--mgen)}
.nt{display:grid;font-size:1rem;line-height:1.3;background:var(--df) left top/100% 1px no-repeat}
.nt>div{display:grid;grid-template-columns:var(--nc,7em 3.6em minmax(0,1fr));background:var(--df) left bottom/100% 1px no-repeat}
.nt>div>*{padding:7px 8px}.nt>div>*:first-child{padding-left:0}.nt>div>*+*{background:var(--dfv) left top/1px 100% no-repeat}
.nt .hd>*{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#555;padding-top:4px;padding-bottom:4px}
.nt .k{background:var(--dfv) left top/1px 100% no-repeat,var(--mkey)!important;font-weight:700}.nt .g{background:var(--dfv) left top/1px 100% no-repeat,var(--mnom)!important;font-weight:700}
.wt.a{background:var(--makk);box-shadow:none;color:var(--akkt)}.wt.d{background:var(--mdat);box-shadow:none;color:var(--datt)}.wt.g{background:var(--mgen)}
.qsec{margin:10px 0 0;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:#555;font-weight:700;padding-bottom:3px;background:var(--df) left bottom/100% 1px no-repeat}
.qt{text-align:left;display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;padding:9px 0;background:var(--df) left bottom/100% 1px no-repeat;color:inherit;text-decoration:none}
.qt.alt{background:var(--df) left bottom/100% 1px no-repeat,#f4f4f2;margin:0 -8px;padding-left:8px;padding-right:8px}
.qt{margin:0 -8px;padding-left:8px;padding-right:8px}
.qt:active{background:var(--df) left bottom/100% 1px no-repeat,var(--pale)}
.qt .pic{width:46px;height:58px;display:grid;place-items:center;font-size:.95rem;font-weight:700;color:var(--ink);position:relative;background:var(--pale);overflow:hidden}
.qt .pic::after{content:"";position:absolute;inset:0;background:var(--df) left top/100% 1px no-repeat,var(--df) left bottom/100% 1px no-repeat,var(--dfv) left top/1px 100% no-repeat,var(--dfv) right top/1px 100% no-repeat}
.qt .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;opacity:0;filter:grayscale(1)}.qt .pic.has img{opacity:1}.qt .pic.has i{visibility:hidden}.qt .pic i{font-style:normal}
.qt .qb{min-width:0}.qt b.who{display:inline;font-size:1rem}.qt small{display:block;font-size:.76rem;color:#555;margin-bottom:3px}
.qt q{display:block;font-size:.98rem;line-height:1.3;quotes:"„" "“"}.qt .qen{display:block;text-align:left;font-size:.84rem;color:#555;margin-top:2px;line-height:1.3}
.qt .lang{display:flex;flex-wrap:wrap;margin-top:5px;font-size:.76rem}.qt .lang span{padding:2px 6px;background:var(--mnom)}.qt .lang span+span{border-left:1px dotted var(--dl)}.qt .lang .de{background:var(--mkey);font-weight:700}

/* ---- start page, two edges (30 Oct): boxes and grey bands line up with the bars, all text lines up with the bar labels 10 px in ---- */
.hp .tc>h3,.hp .tc>.tline,.hp .tc>p,.hp .qsec,.hp .tlen{padding-left:10px;padding-right:10px}
.hp .tline{font-size:.82rem;line-height:1.35;color:var(--muted);margin:8px 0 0}
/* Hilfsmittel: rows with a dotted line between them */
.hp .rows{gap:0}
.hp .rows div{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 10px 10px;margin:0;font-size:.9rem;line-height:1.32;background:var(--df) left bottom/100% 1px no-repeat}
.hp .rows div>:first-child{font-weight:700}
/* Geschichte: rows striped grey / white, the grey reaching the bar edges, the text at the bar-label line */
.hp .hi,.hp .hi:nth-child(odd){display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:10px;align-items:baseline;padding:10px;margin:0;font-size:.9rem;line-height:1.32;background:#fff}
.hp .hi:nth-child(odd){background:#f4f4f2}
.hp .hi>b{font-weight:700}
.hp .hi a.wk{display:block;width:fit-content;margin:5px 0 0}
/* Geschichte in Bildern: square tiles in two columns, dotted frame, grey caption band – like the dasein-design projects */
.hgal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.htile{position:relative;display:block;aspect-ratio:1/1;padding:0;border:0;background:#f4f4f2;overflow:hidden;cursor:pointer;text-align:left;color:#222;font:inherit;-webkit-tap-highlight-color:transparent}
.htile::after,.hp .qt::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--df) left top/100% 1px no-repeat,var(--df) left bottom/100% 1px no-repeat,var(--dfv) left top/1px 100% no-repeat,var(--dfv) right top/1px 100% no-repeat}
.htile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}.htile.has img{opacity:1}
.htile>i{position:absolute;inset:0 0 30px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:1.3rem;color:#9a9a96}.htile.has>i{visibility:hidden}
.htile .ty{position:absolute;inset:0 0 30px;display:grid;place-items:center;font-size:40px;line-height:1}
.htile .cap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:4px 6px 5px;background:rgba(68,68,68,.7);color:#fff;line-height:1.15}
.htile .cap b{display:block;font-size:11.5px}.htile .cap small{font-size:10px}
.htile:active{outline:1px solid var(--red);outline-offset:-1px}
.ty.frak{font-family:"DdFrak",serif}.ty.anti{font-family:"DdCor","DdEsz",Georgia,serif;font-weight:500}
/* ---- Geschichte: timeline in a square that scrolls sideways (like the history-of-design poster), dasein lines ---- */
.tlw{position:relative}
.tlw::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:var(--df) left top/100% 1px no-repeat,var(--df) left bottom/100% 1px no-repeat,var(--dfv) left top/1px 100% no-repeat,var(--dfv) right top/1px 100% no-repeat}
.tl{overflow-x:auto;overflow-y:hidden;touch-action:pan-x pan-y;scrollbar-width:none;overscroll-behavior-x:contain;background:#fff}.tl::-webkit-scrollbar{display:none}
.tlc{position:relative;height:100%}
.tlc>i{position:absolute;display:block;font-style:normal}
.tlera{top:calc(50% - 18px);height:12px;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;line-height:12px;padding-left:5px;white-space:nowrap;overflow:hidden;box-sizing:border-box}
.tlyr{display:none}
.tlc .tltk{position:absolute;top:calc(50% - 6px);height:23px;min-width:44px;padding:0 6px;box-sizing:border-box;transform:translateX(-50%);text-align:center;font-size:11px;font-weight:700;line-height:20px;color:#3a3c37;white-space:nowrap;z-index:1;background:#f2f2f2;box-shadow:inset 0 -3px 0 var(--ec)}
.tlc .tltk.h{background:#e2e2df}.tlc .tltk.on{background:#cdff3e}
.tlw>.tlar{z-index:4}.tlw>.tlar[data-off]{opacity:.3}
.tlsp{height:4px;opacity:.75}.tlsp.a{top:calc(50% - 25px - var(--k)*6px)}.tlsp.b{top:calc(50% + 19px + var(--k)*6px)}
.tlln{width:1px}
.tlln.a1{top:calc(50% - 42px - var(--g));height:calc(24px + var(--g))}.tlln.a2{top:calc(50% - 52px - var(--g) - var(--th) + var(--d));height:calc(34px + var(--g) + var(--th) - var(--d))}
.tlln.b1{top:calc(50% + 16px);height:calc(26px + var(--g))}.tlln.b2{top:calc(50% + 16px);height:calc(36px + var(--g) + var(--th) - var(--d))}
.tlwash{top:0;bottom:0;opacity:.45}
/* a card: the picture (as big as the height allows) with date and title beside it, like the poster */

<div class="tc df"><h3>Warum Wo? DAT und Wohin? AKK</h3><p>An old pattern, older than German: Latin did the same – in + Akkusativ meant 'into', in + Ablativ meant 'in'.</p><p class="tline">The Akkusativ is the case of the goal (where something goes), so it answers Wohin?. The Germanic Dativ swallowed the old case of place, so it answers Wo?. English uses two words instead: into / in, onto / on.</p></div>
<div class="tc df"><h3>Die wichtigsten zuerst</h3><p>These eight come up constantly. Learn them first, with their case.</p>
<div class="pcs"><span class="pc w star">in</span><span class="pc w star">an</span><span class="pc w star">auf</span><span class="pc d star">mit</span><span class="pc d star">zu</span><span class="pc d star">von</span><span class="pc a star">für</span><span class="pc d star">bei</span></div>
<p class="tline">Blue = Dativ · Red = Akkusativ · Grey = either case</p></div>
<div class="tc df"><h3>Die 25 häufigsten <small>A1–B1</small></h3><div class="nt" style="--nc:5.4em minmax(0,1fr)"><div class="hd"><span>Fall</span><span>Präpositionen</span></div>
<div><span class="g">DAT</span><span>von · mit · zu · bei · nach · aus · seit</span></div>
<div><span class="g">AKK</span><span>für · um · durch · bis · gegen · ohne</span></div>
<div><span class="g">Wo? DAT<br>Wohin? AKK</span><span>in · auf · an · über · vor · unter · zwischen · hinter · neben</span></div>
<div><span class="g">GEN</span><span>wegen · während · trotz</span></div></div>
<p class="tline">Roughly by frequency: in, von, mit, zu, auf, für, an, bei, nach, aus, um, über, durch, vor, bis, unter, seit, gegen, ohne, zwischen, wegen, während, hinter, neben, trotz. Corpus counts differ a little in the order.</p></div>

<div class="tc df"><h3>Immer Akkusativ <small>7</small></h3>
<div class="pcs"><span class="pc a">durch</span><span class="pc a">ohne</span><span class="pc a">gegen</span><span class="pc a">für</span><span class="pc a">um</span><span class="pc a">bis</span><span class="pc a">entlang</span></div>
<p class="memo">Merkhilfe: <b>DOGFU + bis</b> = durch, ohne, gegen, für, um, bis</p>
<p class="tline"><b>entlang</b> goes after the noun: den Fluss entlang. <b>bis</b> usually has no article (bis Montag) or pairs with zu: bis zum Bahnhof.</p></div>

<div class="tc df"><h3>Immer Dativ <small>10</small></h3>
<div class="pcs"><span class="pc d">ab</span><span class="pc d">aus</span><span class="pc d">außer</span><span class="pc d">bei</span><span class="pc d">mit</span><span class="pc d">nach</span><span class="pc d">seit</span><span class="pc d">von</span><span class="pc d">zu</span><span class="pc d">gegenüber</span></div>
<p class="memo">Merkhilfe: say it as a chant: <b>aus – bei – mit – nach – seit – von – zu</b></p></div>

<div class="tc df"><h3>Wechselpräpositionen <small>9</small></h3>
<div class="pcs"><span class="pc w">an</span><span class="pc w">auf</span><span class="pc w">hinter</span><span class="pc w">in</span><span class="pc w">neben</span><span class="pc w">über</span><span class="pc w">unter</span><span class="pc w">vor</span><span class="pc w">zwischen</span></div>
<p class="memo"><b style="color:var(--dat)">Wo?</b> → Dativ (position) · <b style="color:var(--akk)">Wohin?</b> → Akkusativ (movement)</p>
<p>They are all about place: you could draw each one in a room. That's how to spot them.</p></div>

<div class="tc df"><h3>Das Verb verrät den Fall</h3>
<div class="rows"><div><span style="color:var(--dat)">liegen</span><span>Das Buch liegt auf <mark class="d">dem</mark> Tisch.</span></div><div><span style="color:var(--akk)">legen</span><span>Ich lege das Buch auf <mark class="a">den</mark> Tisch.</span></div>
<div><span style="color:var(--dat)">stehen</span><span>Die Vase steht auf <mark class="d">dem</mark> Regal.</span></div><div><span style="color:var(--akk)">stellen</span><span>Ich stelle die Vase auf <mark class="a">das</mark> Regal.</span></div>
<div><span style="color:var(--dat)">sitzen</span><span>Ich sitze auf <mark class="d">dem</mark> Pferd.</span></div><div><span style="color:var(--akk)">setzen</span><span>Ich setze mich auf <mark class="a">das</mark> Pferd.</span></div></div>
<p class="tline">Position verbs are strong (lag, stand, saß). Placing verbs are regular (legte, stellte, setzte).</p>
<p class="memo">Österreich: liegen, stehen, sitzen take <b>sein</b> in the Perfekt: Ich <b>bin</b> lange gesessen. In Germany: Ich habe lange gesessen.</p></div>

<div class="tc df"><h3>Wo · Wohin · Woher <small>B1–B2</small></h3><div class="www">
<span></span><span class="h">Wohin?</span><span class="h">Wo?</span><span class="h">Woher?</span>
<span class="k">Räume, Länder mit Artikel</span><span>in den Park<br>in die Schweiz</span><span>im Park<br>in der Schweiz</span><span>aus dem Park<br>aus der Schweiz</span>
<span class="k">Städte, Länder ohne Artikel</span><span>nach Wien</span><span>in Wien</span><span>aus Wien</span>
<span class="k">Rand, Wasser</span><span>an den Strand<br>ans Meer</span><span>am Strand<br>am Fluss</span><span>vom Strand</span>
<span class="k">Fläche, Amt</span><span>auf den Platz<br>auf die Weide</span><span>auf dem Platz<br>auf der Weide</span><span>vom Platz</span>
<span class="k">Personen, Firmen</span><span>zum Arzt<br>zu Anna</span><span>beim Arzt<br>bei Anna</span><span>vom Arzt<br>von Anna</span>
<span class="k">Zuhause</span><span>nach Hause</span><span>zu Hause</span><span>von zu Hause</span></div>
<p class="tline">Woher is always Dativ: aus or von.</p></div>
<div class="tc df"><h3>Kurzformen</h3>
<div class="rows"><div><span style="color:var(--dat)">am · im</span><span>an dem · in dem</span></div><div><span style="color:var(--dat)">beim · vom · zum</span><span>bei dem · von dem · zu dem</span></div><div><span style="color:var(--dat)">zur</span><span>zu der</span></div><div><span style="color:var(--akk)">ans · ins</span><span>an das · in das</span></div></div></div>

<div class="tc df"><h3>Tipps &amp; Fallen</h3>
<div class="rows">
<div><span>an / auf</span><span><b>an</b> = vertical or edge (an der Wand). <b>auf</b> = on top of a surface (auf dem Tisch).</span></div>
<div><span>nach / in / zu</span><span><b>nach</b> Wien, nach Österreich (no article) · <b>in</b> die Schweiz (with article) · <b>zum</b> Arzt, zu Freunden (people, shops, places)</span></div>
<div><span>Haus</span><span>Ich gehe <b>nach Hause</b> (movement) · Ich bin <b>zu Hause</b> (position)</span></div>
<div><span>seit</span><span>Takes the present tense: Ich wohne <b>seit</b> 2010 in Wien. English says “have lived”.</span></div>
<div><span>by train</span><span><b>mit</b> dem Zug, never “bei”. <b>bei</b> = at someone's place: beim Arzt, bei Anna.</span></div>
<div><span>Zeit</span><span><b>am</b> Montag · <b>im</b> Juni · <b>um</b> 8 Uhr · <b>vor</b> einer Woche (Dativ, “ago”)</span></div>
</div></div>

<div class="tc df"><h3>Verben mit fester Präposition <small>B2–C1</small></h3>
<p>Here the preposition is part of the verb, so Wo/Wohin doesn't apply. Learn verb, preposition and case together.</p>
<p class="memo">With <b>an, auf, über</b> the <b style="color:var(--akk)">Akkusativ</b> wins most of the time. Learn the <b style="color:var(--dat)">Dativ</b> exceptions.</p>
<div class="rows">
<div><span style="color:var(--akk)">warten auf</span><span>Wir warten auf <mark class="a">die</mark> Genehmigung.</span></div>
<div><span style="color:var(--akk)">denken an</span><span>Denk bitte an <mark class="a">den</mark> Termin.</span></div>
<div><span style="color:var(--akk)">sich freuen auf</span><span>Ich freue mich auf <mark class="a">das</mark> Wochenende.</span></div>
<div><span style="color:var(--dat)">teilnehmen an</span><span>Er nimmt an <mark class="d">der</mark> Sitzung teil.</span></div>
<div><span style="color:var(--dat)">basieren auf</span><span>Der Entwurf basiert auf <mark class="d">einer</mark> Studie.</span></div>
<div><span style="color:var(--dat)">bestehen auf</span><span>Der Bauherr besteht auf <mark class="d">einem</mark> Flachdach.</span></div>
<div><span style="color:var(--dat)">zweifeln an</span><span>Ich zweifle nicht an <mark class="d">seiner</mark> Kompetenz.</span></div>
<div><span style="color:var(--dat)">sich beteiligen an</span><span>Wir beteiligen uns <mark class="d">am</mark> Wettbewerb.</span></div>
</div>
<p class="tline">Pronouns: for things use da-/wo-: Worauf wartest du? Ich warte <b>darauf</b>. For people keep the preposition: Auf wen? <b>Auf ihn.</b></p></div>

<div class="tc df"><h3>Mit Genitiv <small>B1–C1</small></h3>
<div class="pcs"><span class="pc g">wegen</span><span class="pc g">trotz</span><span class="pc g">während</span><span class="pc g">statt</span><span class="pc g">innerhalb</span><span class="pc g">außerhalb</span></div>
<p class="ex">Wegen <b>des</b> Regens bleiben wir drinnen.</p>
<p class="tline">In speech, Austrians and Germans often use the Dativ here (wegen dem Regen). For exams and writing use the Genitiv.</p></div>`;

<div class="tc df"><h3>Warum steht das Verb am Ende?</h3><p class="memo">Whenever the literary German dives into a sentence, that is the last you are going to see of him till he emerges on the other side of his Atlantic with his verb in his mouth.</p><p class="tline">Mark Twain, A Connecticut Yankee, 1889. English once worked the same way – traces remain in 'Never have I seen …' and 'Here comes the bus' (verb in position 2). German kept the frame; English gave it up.</p></div>
<div class="tc df"><h3>Wortarten <small>A1</small></h3><div class="nt" style="--nc:7.2em minmax(0,1fr) 4.6em"><div class="hd"><span>Wortart</span><span>Beispiel</span><span>ändert sich?</span></div>
<div><span class="g">Nomen</span><span>der Plan, die Wand</span><span>ja</span></div>
<div><span class="g">Artikel</span><span>der, ein, kein</span><span>ja</span></div>
<div><span class="g">Pronomen</span><span>ich, mich, mir, dieser</span><span>ja</span></div>
<div><span class="g">Verb</span><span>zeichnen, ist, hat</span><span>ja</span></div>
<div><span class="g">Adjektiv</span><span>neu, groß, schön</span><span>ja</span></div>
<div><span class="g">Adverb</span><span>heute, hier, gern</span><span>nein</span></div>
<div><span class="g">Präposition</span><span>in, mit, wegen</span><span>nein</span></div>
<div><span class="g">Konjunktion</span><span>und, weil, dass</span><span>nein</span></div>
<div><span class="g">Partikel</span><span>doch, ja, mal</span><span>nein</span></div>
<div><span class="g">Zahlwort</span><span>zwei, drei, erste</span><span>meist nein</span></div></div>
<p class="tline">Five word classes change their form (Nomen, Artikel, Pronomen, Verb, Adjektiv). The others never do, but they steer the sentence: a Präposition picks the case, a Konjunktion like weil sends the verb to the end.</p></div>
<div class="tc df"><h3>Das Feldermodell</h3><p>Every German clause fits the same frame. The two verb parts form a bracket around the middle.</p>
<div class="grid"><div class="cell vf"><small>Vorfeld</small><span>Heute</span></div><div class="cell v1"><small>Verb 1</small><span>habe</span></div><div class="cell mf"><small>Mittelfeld</small><span>ich das Pferd</span></div><div class="cell v2"><small>Verb 2</small><span>geputzt</span></div></div>
<p class="memo">Merkhilfe: <b>one thing</b> before the verb, then the verb, then everything else, then the rest of the verb.</p></div>

<div class="tc df"><h3>Drei Verbpositionen</h3>
<div class="rows">
<div><span >Position 2</span><span>Statements and W-questions: Morgen <b>fahre</b> ich nach Graz. Wann <b>kommst</b> du?</span></div>
<div><span >Position 1</span><span>Yes/no questions and commands: <b>Kommst</b> du mit? <b>Komm</b> mit!</span></div>
<div><span >Am Ende</span><span>Nebensätze: …, weil ich morgen nach Graz <b>fahre</b>.</span></div></div></div>

<div class="tc df"><h3>W-Fragen <small>A1–B1</small></h3><div class="nt wq" style="--nc:6.6em 3.6em minmax(0,1fr)"><div class="hd"><span>Frage</span><span>Fall</span><span>Beispiel</span></div>
<div><span class="g">Wer?</span><span>NOM</span><span><b>Wer</b> kommt mit? <button class="go" data-go="fall">Fälle →</button></span></div>
<div><span class="g">Wen? Was?</span><span>AKK</span><span><b>Wen</b> siehst du? <b>Was</b> zeichnest du? <button class="go" data-go="fall">Fälle →</button></span></div>
<div><span class="g">Wem?</span><span>DAT</span><span><b>Wem</b> gehört das Pferd? <button class="go" data-go="fall">Fälle →</button></span></div>
<div><span class="g">Wessen?</span><span>GEN</span><span><b>Wessen</b> Plan ist das? <button class="go" data-go="gen">Genitiv →</button></span></div>
<div><span class="g">Wo?</span><span>DAT</span><span><b>Wo</b> liegt der Plan? – Auf <b>dem</b> Tisch. <button class="go" data-go="prep">Wo oder wohin? →</button></span></div>
<div><span class="g">Wohin?</span><span>AKK</span><span><b>Wohin</b> legst du ihn? – Auf <b>den</b> Tisch. <button class="go" data-go="prep">Wo oder wohin? →</button></span></div>
<div><span class="g">Woher?</span><span>DAT</span><span><b>Woher</b> kommst du? – Aus Wien. <button class="go" data-go="prep">Wo oder wohin? →</button></span></div>
<div><span class="g">Wann?</span><span>Zeit</span><span><b>Wann</b> kommst du? <b>Seit wann</b>? <b>Wie lange</b>? <button class="go" data-go="perf">Zeitformen →</button></span></div>
<div><span class="g">Warum?</span><span>Grund</span><span><b>Warum</b>? – Weil ich müde <b>bin</b>. <button class="go" data-go="konn">Konnektoren →</button></span></div>
<div><span class="g">Wie?</span><span>Art</span><span><b>Wie</b> fährst du? – Mit dem Rad.</span></div>
<div><span class="g">Wofür? Worauf?</span><span>Sache</span><span><b>Worauf</b> wartest du? – Auf den Bus. Person: <b>Auf wen</b>? <button class="go" data-go="vprep">Verben mit Präp. →</button></span></div>
<div><span class="g">Welcher?</span><span>wie der</span><span><b>Welchen</b> Plan meinst du? Den neu<b>en</b>. <button class="go" data-go="adj">Adjektive →</button></span></div></div>
<p class="tline">The question word asks for the case or the preposition. The verb stays in position 2: Wann kommst du? A yes/no question starts with the verb: Kommst du?</p></div>
<div class="tc df"><h3>Was füllt Verb 2?</h3>
<div class="pcs"><span class="pc k">Partizip: gemacht</span><span class="pc k">Infinitiv: machen</span><span class="pc k">Präfix: an, auf, mit</span><span class="pc k">Passiv: gemacht werden</span></div>
<p>Modal verbs, Perfekt, Futur, Passiv and separable verbs all close the bracket at the end.</p></div>

<div class="tc df"><h3>Konnektoren: wohin geht das Verb?</h3>
<div class="rows">
<div><span style="color:var(--muted)">Position 0</span><span><b>und, aber, oder, denn, sondern</b>: no effect on word order. Merkhilfe: <b>ADUSO</b></span></div>
<div><span >Verb ans Ende</span><span><b>weil, dass, ob, wenn, als, obwohl, damit, während, bevor, nachdem</b> and all relative pronouns</span></div>
<div><span >Im Vorfeld</span><span><b>deshalb, trotzdem, dann, danach, außerdem, sonst</b>: they take the Vorfeld, so the verb follows straight away. Deshalb <b>bleibe</b> ich zu Hause.</span></div></div></div>

<div class="tc df"><h3>Ordnung im Mittelfeld</h3>
<p class="memo">Merkhilfe: <b>TeKaMoLo</b> = Temporal, Kausal, Modal, Lokal</p>
<p class="ex">Ich fahre <b>morgen</b> <b>wegen der Prüfung</b> <b>mit dem Zug</b> <b>nach Wien</b>.</p>
<p class="tline">When? Why? How? Where? It's a default, not a law, but it always sounds natural.</p></div>

<div class="tc df"><h3>Typische Fehler für Englischsprachige</h3>
<div class="rows">
<div><span>✗ Heute ich arbeite</span><span>✓ Heute <b>arbeite</b> ich. Only one element before the verb.</span></div>
<div><span>✗ weil ich bin müde</span><span>✓ weil ich müde <b>bin</b>. The verb goes to the end.</span></div>
<div><span>✗ Weil es regnet, wir bleiben</span><span>✓ Weil es regnet, <b>bleiben</b> wir. The clause is the Vorfeld.</span></div>
<div><span>✗ Ich habe gemacht es</span><span>✓ Ich habe es <b>gemacht</b>. The participle closes the bracket.</span></div></div></div>`;

<div class="tc df"><h3>Der wichtigste Tipp</h3><p>Always learn a noun with its article, and say it aloud as one word: <b>die Wand</b>, never just “Wand”.</p><p class="memo">Plural is always <b>die</b>. The article you need to learn is the singular one.</p></div>

<div class="tc df"><h3>Endungen → das</h3>`+pcs("",["-chen","-lein","-ment","-um","-ma","-tum","Ge-","-nis","Verb als Nomen","Metalle","Farben","Brüche","Tierjunge"])+`<p class="tline">das Häuschen, das Fundament, das Zentrum, das Gebäude, das Ergebnis, das Reiten. Exceptions: die Erlaubnis, der Geruch.</p></div>
<div class="tc df"><h3>Endungen → der</h3>`+pcs("",["-ling","-ismus","-ist","-ig","-ant","-ent","-or","Tage","Monate","Jahreszeiten","Wetter","Himmelsrichtungen","Automarken","Währungen"])+`<p class="tline">der Lehrling, der Praktikant, der Motor, der Montag, der Sommer, der Regen.</p></div>
<div class="tc df"><h3>Fallen</h3><div class="rows">
<div><span>-er</span><span>People and tools are der (der Lehrer, der Bohrer), but <b>das</b> Fenster, <b>das</b> Zimmer, <b>die</b> Mauer.</span></div>
<div><span>-e</span><span>der Junge, der Name, das Auge, das Ende.</span></div>
<div><span>Mädchen</span><span>das Mädchen: -chen beats the meaning.</span></div></div></div>
<div class="tc df"><h3>Komposita</h3><p class="memo">The last part decides: das Haus + die Tür = <b>die</b> Haustür.</p><p class="tline">der Stall + das Tor = das Stalltor · das Büro + der Stuhl = der Bürostuhl</p></div>`;

<p class="tline">Cases as actors: NOM does it, AKK receives it, DAT gets something from it, GEN owns it. The case comes from the verb (helfen + DAT), the preposition (mit + DAT, für + AKK) or a fixed phrase (Guten Morgen!).</p></div>
<div class="tc df"><h3>Pronomen <small>A1</small></h3><div class="ptab"><span class="h">Nom.</span><span class="h a">Akk.</span><span class="h d">Dat.</span>`+PRON.map(([n,a,d])=>'<span>'+n+'</span><span class="a">'+a+'</span><span class="d">'+d+'</span>').join("")+`</div><p class="tline">Only uns and euch are the same in AKK and DAT. Reflexiv: mich if there is no other object (Ich freue mich), mir if there is (Ich wasche mir die Hände).</p></div>
<div class="tc df"><h3>Verben mit Dativ <small>A2</small></h3>`+pcs("d",["helfen","danken","gefallen","gehören","antworten","folgen","gratulieren","passen","schmecken","fehlen","glauben","vertrauen","zuhören","begegnen","raten","verzeihen","zustimmen","widersprechen"])+`<p class="tline">Der Entwurf gefällt mir = I like the design: the English subject becomes the German DAT. Also: Mir ist kalt. Es tut mir leid. Das ist mir egal.</p></div>
<div class="tc df"><h3>Zwei Objekte <small>B1</small></h3><div class="rows">
<div><span>2 Nomen</span><span>DAT first: Ich gebe <mark class="d">dem Kind</mark> <mark class="a">den Ball</mark>.</span></div>
<div><span>1 Pronomen</span><span>Pronoun first: Ich gebe <mark class="a">ihn</mark> <mark class="d">dem Kind</mark>.</span></div>
<div><span>2 Pronomen</span><span>AKK first: Ich gebe <mark class="a">es</mark> <mark class="d">ihm</mark>.</span></div></div><p class="tline">DAT person, AKK thing: geben, schenken, schicken, bringen, zeigen, erklären, erzählen, leihen, empfehlen.</p></div>
<div class="tc df"><h3>Fallen <small>A2–B1</small></h3><div class="rows">
<div><span>Wortstellung</span><span>Den Plan zeichnet <b>der Architekt</b>. The article shows the subject, not the position.</span></div>
<div><span>sein / werden</span><span>Er ist <b>ein</b> guter Lehrer. Never einen.</span></div>
<div><span>n-Deklination</span><span>der Kollege → den / dem / des Kollegen. Also Kunde, Nachbar, Architekt, Bauherr.</span></div>
<div><span>Dativ Plural</span><span>mit den Kinder<b>n</b>, den Pferde<b>n</b> (not after -s or -n: den Autos, den Frauen)</span></div></div><p class="tline">Four traps: word order, sein, n-Deklination, Dativ plural -n.</p></div>`;

/* ---------- sentence diagrams with connecting arcs ----------
   D("Das Auto~s|wird~v|in der Werkstatt|repariert~v|.~p", "1-3a:Passiv")
   tokens split by |, role after ~ (s subject, v verb, a Akk, d Dat, g Gen, k connector, r relative, x highlight, p punctuation)
   links "i-j" + a (above) or b (below) + ":" label + optional "@a|d|v|g" colour; separated by ; */
function D(spec,links,cap){const toks=spec.split("|").map((t,i)=>{const m=t.split("~");return '<span class="wt '+(m[1]||"n")+'" data-i="'+i+'">'+m[0]+'</span>';}).join("");
  const L=(links||"").split(";").filter(Boolean),up=L.some(l=>/^\d+-\d+a/.test(l)),dn=L.some(l=>/^\d+-\d+b/.test(l));
  return '<div class="arc'+(up?" up":"")+(dn?" dn":"")+'" data-l="'+esc(L.join(";"))+'"><svg aria-hidden="true"></svg><div class="toks">'+toks+'</div>'+(cap?'<p class="arcap">'+cap+'</p>':'')+'</div>';}
function drawArcs(root){(root||document).querySelectorAll(".arc").forEach(el=>{if(!el.offsetWidth)return;const t=el.querySelector(".toks"),svg=el.querySelector("svg");
  t.style.fontSize="";let fs=parseFloat(getComputedStyle(t).fontSize);while(t.scrollWidth>t.clientWidth+1&&fs>10){fs-=1;t.style.fontSize=fs+"px";}
  const R=el.getBoundingClientRect(),sc=R.width/el.offsetWidth||1,W=el.offsetWidth,H=el.offsetHeight;svg.setAttribute("width",W);svg.setAttribute("height",H);svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const box=i=>{const s=el.querySelector('.wt[data-i="'+i+'"]');if(!s)return null;const r=s.getBoundingClientRect();return {x:(r.left-R.left)/sc,y:(r.top-R.top)/sc,w:r.width/sc,h:r.height/sc};};
  let out="";(el.dataset.l||"").split(";").filter(Boolean).forEach((l,n)=>{const m=l.match(/^(\d+)-(\d+)([ab])(?::([^@]*))?(?:@(\w))?/);if(!m)return;const a=box(+m[1]),b=box(+m[2]);if(!a||!b)return;
    const up=m[3]==="a",x1=a.x+a.w/2,x2=b.x+b.w/2,y=up?Math.min(a.y,b.y)-2:Math.max(a.y+a.h,b.y+b.h)+2,hh=Math.min(28,10+Math.abs(x2-x1)/7)*(up?-1:1),c=m[5]||"v";
    out+='<path class="al al-'+c+'" d="M'+x1+' '+(up?a.y-2:a.y+a.h+2)+' C'+x1+' '+(y+hh)+' '+x2+' '+(y+hh)+' '+x2+' '+(up?b.y-2:b.y+b.h+2)+'"/>';
    if(m[4])out+='<text class="alt al-'+c+'" x="'+((x1+x2)/2)+'" y="'+(y+hh*0.78+(up?-3:9))+'" text-anchor="middle">'+esc(m[4])+'</text>';});
  svg.innerHTML=out;});}
function arcsSoon(root){requestAnimationFrame(()=>requestAnimationFrame(()=>drawArcs(root)));}
window.addEventListener("resize",()=>arcsSoon());
try{document.fonts&&document.fonts.ready.then(()=>arcsSoon());}catch(e){}

 {s:"Wohin ___ du? (laufen)",o:["läufst", "laufst", "läuft"],why:"au → äu: du läufst.",lv:"A2"},

 {s:"Ziehst du den Mantel ___? Es ist kalt.",o:["an", "um", "ab"],why:"anziehen: ziehst … an.",lv:"A2"},
 {s:"Sie ___ ihm beim Umzug. (helfen)",o:["hilft", "helft", "hilfst"],why:"e → i: sie hilft.",lv:"A2"},
 {s:"Der Zug ___ pünktlich ab. (fahren)",o:["fährt", "fahrt", "fahren"],why:"abfahren: er fährt … ab.",lv:"A2"},
 {s:"Du ___ das Fenster. (öffnen)",o:["öffnest", "öffnst", "öffnet"],why:"After -fn an extra e: du öffnest.",lv:"B1"},
 {s:"Er ___ Lehrer. (werden)",o:["wird", "werdet", "wirdt"],why:"werden: du wirst, er wird.",lv:"A2"},
 {s:"Ich lade dich zum Essen ___.",o:["ein", "an", "auf"],why:"einladen: lade … ein.",lv:"A2"},
 {s:"Wir kaufen heute im Supermarkt ___.",o:["ein", "an", "zu"],why:"einkaufen: kaufen … ein.",lv:"A1"},
 {s:"Der Übersetzer ___ den Text ins Englische. (übersetzen)",o:["übersetzt", "setzt über", "übersetzen"],why:"übersetzen (translate) is not separable: the stress is on -setz-.",lv:"B2"}],
 th:`<div class="tc df"><h3>Endungen <small>A1</small></h3><div class="nt" style="--nc:4.6em repeat(4,minmax(0,1fr))"><div class="hd"><span></span><span>machen</span><span>arbeiten</span><span>sein</span><span>haben</span></div>
<div><span class="g">ich</span><span>mache</span><span>arbeite</span><span>bin</span><span>habe</span></div>
<div><span class="g">du</span><span>machst</span><span>arbeitest</span><span>bist</span><span>hast</span></div>
<div><span class="g">er · sie · es</span><span>macht</span><span>arbeitet</span><span>ist</span><span>hat</span></div>
<div><span class="g">wir</span><span>machen</span><span>arbeiten</span><span>sind</span><span>haben</span></div>
<div><span class="g">ihr</span><span>macht</span><span>arbeitet</span><span>seid</span><span>habt</span></div>
<div><span class="g">sie · Sie</span><span>machen</span><span>arbeiten</span><span>sind</span><span>haben</span></div></div>
<p class="tline">Stem in -t or -d (arbeiten, finden) takes an extra e in du, er and ihr. Stem in -s, -ß, -z: du only adds -t (du heißt, du sitzt).</p></div>
<div class="tc df"><h3>Vokalwechsel <small>A1–A2</small></h3><div class="rows">
<div><span>e → i</span><span>geben, helfen, nehmen, sprechen, treffen, vergessen, essen: du gibst, er hilft</span></div>
<div><span>e → ie</span><span>sehen, lesen, empfehlen, stehlen: du siehst, er liest</span></div>
<div><span>a → ä</span><span>fahren, schlafen, tragen, waschen, fallen, halten, laden, anfangen: du fährst</span></div>
<div><span>au → äu</span><span>laufen: du läufst · o → ö: stoßen: er stößt</span></div></div>
<p class="tline">Only du and er/sie/es change. The Imperativ du-form follows: gib!, nimm!, lies! (but fahr!).</p></div>
<div class="tc df"><h3>Trennbar oder nicht? <small>A2–B2</small></h3><div class="rows">
<div><span>trennbar</span><span>stressed prefix: an-, auf-, aus-, ab-, bei-, ein-, mit-, nach-, vor-, weg-, zu-, zurück-, fern-, statt-</span></div>
<div><span>untrennbar</span><span>unstressed prefix: be-, emp-, ent-, er-, ge-, miss-, ver-, zer-</span></div>
<div><span>beides</span><span>durch-, über-, um-, unter-, wieder-: the stress decides. Er setzt ans andere Ufer über (ferry across) · Er übersetzt den Text (translate).</span></div></div></div>
<div class="tc df"><h3>Wo steht die Vorsilbe? <small>A2–B1</small></h3><div class="rows">
<div><span>Hauptsatz</span><span>at the end: Ich <b>rufe</b> dich morgen <b>an</b>.</span></div>
<div><span>Nebensatz</span><span>together at the end: …, weil ich dich morgen <b>anrufe</b>.</span></div>
<div><span>mit Modalverb</span><span>Infinitiv in one piece: Ich muss dich <b>anrufen</b>.</span></div>
<div><span>zu + Infinitiv</span><span>zu in the middle: Ich vergesse nie, dich <b>anzurufen</b>.</span></div>
<div><span>Perfekt</span><span>ge in the middle: Ich habe dich <b>angerufen</b>.</span></div></div></div>
<div class="tc df"><h3>Wofür das Präsens? <small>A2–B1</small></h3><div class="rows">
<div><span>jetzt</span><span>Ich zeichne gerade. (no -ing form in German)</span></div>
<div><span>Zukunft</span><span>Morgen fahre ich nach Graz.</span></div>
<div><span>seit</span><span>Ich wohne seit 2005 in Wien. = I have lived …</span></div>
<div><span>immer</span><span>Wasser kocht bei 100 Grad.</span></div></div></div>`};

GT.perf={name:"Zeitformen",badge:"Zeitform",tip:"Movement from A to B or a change of state → sein. Everything else → haben.",src:["dudenk","dg20","dw"],

 {b:"Perfekt",st:D("Ich~s|habe~v|den Plan|gezeichnet~v|.~p","1-3a:Perfekt"),tx:"haben or sein + Partizip II",gt:"The two parts form the verb bracket. This is the normal spoken past.",say:"Ich habe den Plan gezeichnet."},

 {b:"Plusquamperfekt",st:D("Nachdem~k|ich|gegessen|hatte~v|,~p|ging~v|ich|in den Stall|.~p","3-5b:zuerst → dann@g"),tx:"One step further back",gt:"hatte or war + Partizip II. For what happened before another past event.",say:"Nachdem ich gegessen hatte, ging ich in den Stall."},

 {s:"Ich habe die Rechnung ___.",o:["bezahlt","gebezahlt","bezahlen"],why:"be- verbs have no ge-.",lv:"A2"},

 {s:"Wann ___ der Unfall passiert?",o:["ist","hat","wird"],why:"passieren takes sein.",lv:"B1"},
 {s:"Ich bin lange im Café ___.",o:["gesessen","gesitzt","gesitzen"],why:"sitzen → gesessen. In Austria with sein, in Germany usually with haben.",lv:"B1"},
 {s:"Bis Freitag ___ ich den Bericht geschrieben haben.",o:["werde","wurde","habe"],why:"Futur II: werden + Partizip + haben.",lv:"C1"}],
 th:`<div class="tc df"><h3>Sechs Zeitformen</h3>${TLZ}</div>
<div class="tc df"><h3>haben oder sein?</h3><div class="rows">
<div><span>sein</span><span>movement from A to B: gehen, fahren, fliegen, kommen, reiten (nach Hause)</span></div>
<div><span>sein</span><span>change of state: aufstehen, einschlafen, wachsen, sterben, werden</span></div>
<div><span>sein</span><span>also: sein, bleiben, passieren, gelingen</span></div>
<div><span>haben</span><span>everything else, all verbs with an Akkusativ object, all reflexive verbs</span></div>
<div><span>Österreich</span><span>liegen, sitzen, stehen with sein: ich bin gestanden</span></div></div></div>
<div class="tc df"><h3>Partizip II</h3><div class="rows">
<div><span>schwach</span><span>ge-…-t: machen → gemacht, kaufen → gekauft</span></div>
<div><span>stark</span><span>ge-…-en, often a vowel change: schreiben → geschrieben, finden → gefunden</span></div>
<div><span>trennbar</span><span>ge in the middle: aufräumen → aufgeräumt, anrufen → angerufen</span></div>
<div><span>ohne ge-</span><span>be-, ver-, er-, ent-, zer-, ge-, miss- and -ieren: bezahlt, verstanden, renoviert</span></div></div></div>
<div class="tc df"><h3>Präteritum im Alltag</h3><div class="pcs">${["war","hatte","konnte","musste","wollte","durfte","sollte","es gab","ging","kam","fuhr","sah","nahm","schrieb","wusste"].map(w=>'<span class="pc">'+w+'</span>').join("")}</div><p class="tline">In speech these are more common than their Perfekt forms. Write stories and reports in the Präteritum.</p></div>
<div class="tc df"><h3>Zeitenfolge</h3><div class="rows">
<div><span>nachdem</span><span>Plusquamperfekt → Präteritum: Nachdem ich gegessen hatte, ging ich.</span></div>
<div><span>nachdem</span><span>Perfekt → Präsens: Nachdem ich gegessen habe, gehe ich.</span></div>
<div><span>Futur II</span><span>finished by then: Bis Freitag werde ich es geschafft haben. Also a guess: Er wird den Zug verpasst haben.</span></div></div></div>`};

 th:`<div class="tc df"><h3>Die Regel</h3>${D("warten~v|auf~k|den Bus~a","0-1a:fest;1-2b:Akk@a")}<p class="memo">With <b>an, auf, über</b> the Akkusativ wins. <b>mit, von, nach, zu, bei, aus</b> stay Dativ. <b>für, um, gegen</b> stay Akkusativ.</p></div>
<div class="tc df"><h3>Dativ-Ausnahmen</h3><div class="pcs">${["teilnehmen an","arbeiten an","zweifeln an","leiden an","sterben an","basieren auf","bestehen auf","Angst haben vor","warnen vor","sich fürchten vor","schützen vor"].map(w=>'<span class="pc d">'+w+'</span>').join("")}</div></div>
<div class="tc df"><h3>Nach Präposition</h3><div class="rows">
<div><span>auf + A</span><span>warten, achten, hoffen, verzichten, sich freuen (Zukunft), sich verlassen, sich vorbereiten, sich konzentrieren</span></div>
<div><span>an + A</span><span>denken, sich erinnern, sich gewöhnen, sich wenden, glauben</span></div>
<div><span>über + A</span><span>sprechen, nachdenken, sich freuen (Gegenwart), sich ärgern, diskutieren, sich informieren</span></div>
<div><span>für + A</span><span>sich interessieren, sich entscheiden, sich bedanken, sich entschuldigen, sorgen</span></div>
<div><span>um + A</span><span>bitten, sich kümmern, sich bewerben, es geht um</span></div>
<div><span>mit + D</span><span>anfangen, aufhören, sich beschäftigen, telefonieren, rechnen, sich auseinandersetzen</span></div>
<div><span>von + D</span><span>abhängen, träumen, erzählen, sich erholen</span></div>
<div><span>nach + D</span><span>fragen, suchen, sich erkundigen, riechen</span></div>
<div><span>zu + D</span><span>gehören, beitragen, gratulieren, passen</span></div></div></div>
<div class="tc df"><h3>da- und wo-</h3><div class="rows">
<div><span>Sache</span><span>Worauf wartest du? Ich warte darauf.</span></div>
<div><span>Person</span><span>Auf wen wartest du? Ich warte auf ihn.</span></div>
<div><span>Satz</span><span>Ich freue mich darauf, dich zu sehen. · Ich warte darauf, dass du kommst.</span></div>
<div><span>-r-</span><span>before a vowel: darauf, daran, darüber, worum (but: damit, dafür, davon, wofür)</span></div></div></div>
<div class="tc df"><h3>Gleiches Verb, andere Bedeutung</h3><div class="rows">
<div><span>sich freuen</span><span>auf (coming) · über (already here)</span></div>
<div><span>sprechen</span><span>mit (with someone) · über (about something)</span></div>
<div><span>bestehen</span><span>aus (consist of) · auf (insist on)</span></div>
<div><span>sich halten</span><span>an (follow a rule) · für (consider oneself)</span></div></div></div>`};
