/* Layout: dasein-design language — white sheet, dashed guide lines down both sides with edge ticks, dotted frames, square grey bars, lime for "active". Single light theme on purpose, like the website. */
:root{color-scheme:light;--bg:#ffffff;--fg:#222222;--ink:#3a3c37;--muted:#666666;--line:#c4c4c4;--dot:#b8b8b8;--grey:#ebebeb;--pale:#f4f4f2;
--lime:#cdff3e;--limepale:#eaffae;--red:#e30613;--yellow:#ffd400;--cream:#fffbd6;
--m-learn:#8c918a;--m-game:#ffd400;--m-theo:#3a3c37;
--dat:#1a5fd0;--akk:#e30613;--ok:#3f8f1f;--bad:#e30613;
--df:repeating-linear-gradient(to right,var(--dot) 0 1px,transparent 1px 3px);--dfv:repeating-linear-gradient(to bottom,var(--dot) 0 1px,transparent 1px 3px);
--body:"Carlito",Calibri,"Segoe UI",system-ui,sans-serif}
html{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.35}
.app{position:relative;height:100%;min-height:600px;max-width:520px;margin:0 auto;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));padding-block:8px 8px;display:flex;flex-direction:column;gap:8px}
/* guide lines + ticks */
.rule{position:absolute;top:0;bottom:0;width:1px;pointer-events:none;background:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 7px)}
.rule.l{left:8px}.rule.r{right:8px}
.tk{position:absolute;left:8px;right:8px;height:11px;pointer-events:none;--t:repeating-linear-gradient(to right,var(--dot) 0 4px,transparent 4px 6px);
 background:var(--t) left top/10px 1px no-repeat,var(--t) left bottom/10px 1px no-repeat,var(--t) right top/10px 1px no-repeat,var(--t) right bottom/10px 1px no-repeat}
.tk.t{top:52px}.tk.b{bottom:40px}
/* dotted frame */
.df{position:relative}
.df::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--df) left top/100% 1px no-repeat,var(--df) left bottom/100% 1px no-repeat,var(--dfv) left top/1px 100% no-repeat,var(--dfv) right top/1px 100% no-repeat}
button{font:inherit;font-size:1rem;padding:9px 8px;border-radius:0;border:0;background:var(--grey);color:var(--fg);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{background:var(--lime)}
button.primary{background:var(--limepale);font-weight:700;box-shadow:inset 0 0 0 1px var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--dat);outline-offset:2px}
small.n{font-size:.62em;font-weight:400;margin-left:4px;color:var(--muted)}
/* title */
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;height:44px;
 background:var(--df) left bottom/100% 1px no-repeat}
h1{font-weight:700;font-size:1.25rem;color:var(--fg);margin:0;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:center}
h1.logo{text-align:left;font-size:1.85rem;font-weight:400;color:var(--red);letter-spacing:-.01em}
h1.logo b{font-weight:700}
.back{flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:.95rem;background:transparent}
.back svg{width:18px;height:18px}
.spacer{flex:none;width:70px}
/* home */
.home{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.intro{margin:4px 0 2px;font-size:1rem;color:var(--muted)}
.tile{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;padding:10px 12px 10px 10px;background:var(--bg);width:100%}
.tile .code{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#bdbdbd;color:var(--fg);font-size:1.05rem;box-shadow:inset 0 0 0 1px var(--ink)}
.tile.ready .code{background:var(--lime)}
.tile .nm{font-weight:700;font-size:1.2rem;line-height:1.15}
.tile .ds{font-size:.95rem;color:var(--muted);line-height:1.25;margin-top:2px}
.tile .st{font-size:.85rem;font-weight:700;padding:5px 9px;white-space:nowrap}
.tile .st.ready{background:var(--limepale)}
.tile .st.soon{background:var(--grey);color:var(--muted);font-weight:400}
.tile.soon{opacity:.6;cursor:default}
/* topic */
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;flex:none}
.seg button{background:var(--grey);padding:7px 4px;font-size:1rem}
.seg button{position:relative}
.seg button[aria-pressed="true"]{font-weight:700}
#mLearn[aria-pressed="true"]{background:var(--m-learn);color:#fff}
#mGame[aria-pressed="true"]{background:var(--m-game);color:#111}
#mTheo[aria-pressed="true"]{background:var(--m-theo);color:#fff}
.seg button[aria-pressed="true"] small.n{color:inherit;opacity:.8}
.app[data-mode="learn"] .card{box-shadow:inset 0 3px 0 var(--m-learn)}
.app[data-mode="game"] .card{box-shadow:inset 0 3px 0 var(--m-game)}
.app[data-mode="learn"] button.primary{background:var(--m-learn);color:#fff;box-shadow:none}
.app[data-mode="game"] button.primary{background:var(--m-game);color:#111;box-shadow:none}
.app[data-mode="theo"] .gintro{color:var(--fg)}
.opt.ok::after{content:" ✓"}
.lg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:.9rem;color:var(--muted);flex:none}
.lg span,.lg button{display:inline-flex;align-items:center;gap:6px}
.lg button{background:transparent;padding:2px 8px;font-size:.9rem;color:var(--muted)}

.home h1.logo{display:flex;align-items:baseline;gap:7px;line-height:.74;font-size:1.75rem;white-space:nowrap;margin:0}.home h1.logo span{font-size:.95rem;letter-spacing:.07em;color:var(--ink)}.home .markb{padding-bottom:0;margin-bottom:0}.mark{width:60px;height:21px}
.markb{background:transparent;padding:12px 4px;margin:-12px -4px;flex:none;display:flex}.mark{width:54px;height:19px;flex:none}.mark .fl{opacity:0;transition:opacity .35s}.markb.on .mark .fl{opacity:1}.mark .mo{fill:none;stroke:var(--ink);stroke-width:6}.mark .mi{fill:none;stroke:var(--ink);stroke-width:3}.mark .md{fill:none;stroke:var(--ink);stroke-width:3;stroke-dasharray:3 9}
.gear{width:44px;height:44px;padding:0;display:grid;place-items:center;flex:none}.gear svg{width:22px;height:22px}
.gear[aria-expanded="true"]{background:var(--ink);color:#fff}
.sets{display:flex;flex-direction:column;gap:4px;padding:4px 0 8px;background:var(--df) left bottom/100% 1px no-repeat}
.lvsel #lvs{display:flex;gap:4px;width:100%}.lvsel .lvb{flex:1;min-height:34px}
.hscroll{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.resume{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:#fff6b0;padding:9px 12px;flex:none}
.resume small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#555}.resume b{font-size:1.08rem}
.grp{background:var(--df) left bottom/100% 1px no-repeat}
.grp.open{background:var(--df) left bottom/100% 1px no-repeat,var(--pale)}
.gh{display:grid;grid-template-columns:2.1em minmax(0,1fr) 64px 1.1em;align-items:center;gap:8px;width:100%;min-height:58px;background:transparent;text-align:left;padding:4px 0}
.gh .no{font-size:.85rem;color:var(--muted);padding-left:4px}.gh b{display:block;font-size:1.22rem;line-height:1.15}.gh small{font-size:.82rem;color:#555}
.gh .pm{font-size:1.3rem;line-height:1;text-align:center}
.prog{display:block;height:3px;background:var(--grey)}.prog i{display:block;height:3px;background:var(--ink)}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 0 10px 2.6em}
.tt{display:flex;flex-direction:column;justify-content:space-between;gap:5px;min-height:48px;padding:6px 8px;background:var(--bg);text-align:left;position:relative}
.tt::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--df) left top/100% 1px no-repeat,var(--df) left bottom/100% 1px no-repeat,var(--dfv) left top/1px 100% no-repeat,var(--dfv) right top/1px 100% no-repeat}
.tt .r{display:flex;justify-content:space-between;align-items:baseline;gap:4px}.tt b{font-size:1rem;line-height:1.15}.tt small{font-size:.72rem;color:#555;white-space:nowrap}
.tt.dim{opacity:.45}
.soonl{grid-column:1/-1;font-size:.82rem;color:#555;padding-top:2px}
.hbar{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding-top:6px;background:var(--df) left top/100% 1px no-repeat}
.hbar button{min-height:48px}.hbar .t{background:var(--yellow);font-weight:700}
/* ---- Theorie as a list ---- */
.tlist{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;background:var(--df) left bottom/100% 1px no-repeat;text-align:left;width:100%}
.tli .no{font-size:.8rem;color:var(--muted)}.tli b{display:block;font-size:1.1rem;line-height:1.2}.tli .pv{display:block;font-size:.92rem;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tli small{font-size:.75rem;color:#555;white-space:nowrap}
.tli:active{background:var(--pale)}
/* ---- tables: muted fills, fine dotted lines, no gaps ---- */
:root{--mnom:#e6e6e3;--makk:#f4dcd8;--makk2:#e9b9b3;--mdat:#d3def0;--mgen:#f5efcf;--mkey:#e3efb4;--dl:#8c918a;--akkt:#a3241c;--datt:#1d4f9e}
.box{gap:0}.box .c{border-right:1px dotted var(--dl);border-bottom:1px dotted var(--dl)}
.c.nom,.c.same{background:var(--mnom)}.c.akk{background:var(--makk);box-shadow:none;color:var(--akkt)}.c.dat{background:var(--mdat);box-shadow:none;color:var(--datt)}.c.gen{background:var(--mgen);box-shadow:none}
.qc.nom{background:var(--mnom)}.qc.akk{background:var(--makk);box-shadow:none}.qc.akk b{color:var(--akkt)}.qc.dat{background:var(--mdat);box-shadow:none}.qc.dat b{color:var(--datt)}.qc.gen{background:var(--mgen)}
.all4 .nom,.all4k .nom,.lgc.nom{background:var(--mnom)}.all4 .akk,.all4k .akk,.lgc.akk{background:var(--makk);box-shadow:none;color:var(--akkt)}.all4 .dat,.all4k .dat,.lgc.dat{background:var(--mdat);box-shadow:none;color:var(--datt)}.all4 .gen,.all4k .gen,.lgc.gen{background:var(--mgen)}
.pict.fc-nom b{background:var(--mnom)}.pict.fc-akk b{background:var(--makk);box-shadow:none;color:var(--akkt)}.pict.fc-dat b{background:var(--mdat);box-shadow:none;color:var(--datt)}.pict.fc-gen b{background:var(--mgen)}
.adjt{gap:0}.adjt b{border-right:1px dotted var(--dl);border-bottom:1px dotted var(--dl)}.adjt b.en{background:var(--mnom)}.adjt b.x{background:var(--mkey);box-shadow:none}
.lgx{background:var(--mkey);box-shadow:none}.lgx.en{background:var(--mnom)}
.grid{gap:0}.grid .cell+.cell{border-left:1px dotted var(--dl)}
.cell.vf{background:var(--mnom)}.cell.v1,.cell.v2{background:var(--mkey);box-shadow:none}.cell.ein{background:var(--mgen)}
.pc{background:var(--mnom)}.pc.k{background:var(--mkey);box-shadow:none}.pc.g{background:var(--mgen)}.gn{background:var(--mgen)}
.nt{display:grid;font-size:1rem;line-height:1.3;background:var(--df) left top/100% 1px no-repeat}
.nt>div{display:grid;grid-template-columns:var(--nc,7em 3.6em minmax(0,1fr));background:var(--df) left bottom/100% 1px no-repeat}
.nt>div>*{padding:7px 8px}.nt>div>*:first-child{padding-left:0}.nt>div>*+*{background:var(--dfv) left top/1px 100% no-repeat}
.nt .hd>*{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:#555;padding-top:4px;padding-bottom:4px}
.nt .k{background:var(--dfv) left top/1px 100% no-repeat,var(--mkey)!important;font-weight:700}.nt .g{background:var(--dfv) left top/1px 100% no-repeat,var(--mnom)!important;font-weight:700}
.wt.a{background:var(--makk);box-shadow:none;color:var(--akkt)}.wt.d{background:var(--mdat);box-shadow:none;color:var(--datt)}.wt.g{background:var(--mgen)}
.qsec{margin:10px 0 0;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:#555;font-weight:700;padding-bottom:3px;background:var(--df) left bottom/100% 1px no-repeat}
.qt{text-align:left;display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;padding:9px 0;background:var(--df) left bottom/100% 1px no-repeat;color:inherit;text-decoration:none}
.qt:active{background:var(--df) left bottom/100% 1px no-repeat,var(--pale)}
.qt .pic{width:46px;height:58px;display:grid;place-items:center;font-size:.95rem;font-weight:700;color:var(--ink);position:relative;background:var(--pale);overflow:hidden}
.qt .pic::after{content:"";position:absolute;inset:0;background:var(--df) left top/100% 1px no-repeat,var(--df) left bottom/100% 1px no-repeat,var(--dfv) left top/1px 100% no-repeat,var(--dfv) right top/1px 100% no-repeat}
.qt .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;opacity:0;filter:grayscale(1)}.qt .pic.has img{opacity:1}.qt .pic.has i{visibility:hidden}.qt .pic i{font-style:normal}
.qt .qb{min-width:0}.qt b.who{display:inline;font-size:1rem}.qt small{display:block;font-size:.76rem;color:#555;margin-bottom:3px}
.qt q{display:block;font-size:.98rem;line-height:1.3;quotes:"„" "“"}.qt .qen{display:block;text-align:left;font-size:.84rem;color:#555;margin-top:2px;line-height:1.3}
.qt .lang{display:flex;flex-wrap:wrap;margin-top:5px;font-size:.76rem}.qt .lang span{padding:2px 6px;background:var(--mnom)}.qt .lang span+span{border-left:1px dotted var(--dl)}.qt .lang .de{background:var(--mkey);font-weight:700}
.kb{display:inline-block;background:var(--ink);color:#fff;padding:0 6px;font-weight:700}
</style>

<div class="tc df"><h3>Die wichtigsten zuerst</h3><p>These eight come up constantly. Learn them first, with their case.</p>
<div class="pcs"><span class="pc w star">in</span><span class="pc w star">an</span><span class="pc w star">auf</span><span class="pc d star">mit</span><span class="pc d star">zu</span><span class="pc d star">von</span><span class="pc a star">für</span><span class="pc d star">bei</span></div>
<p class="tline">Blue = Dativ · Red = Akkusativ · Grey = either case</p></div>

<div class="tc df"><h3>Immer Akkusativ <small>7</small></h3>
<div class="pcs"><span class="pc a">durch</span><span class="pc a">ohne</span><span class="pc a">gegen</span><span class="pc a">für</span><span class="pc a">um</span><span class="pc a">bis</span><span class="pc a">entlang</span></div>
<p class="memo">Merkhilfe: <b>DOGFU + bis</b> = durch, ohne, gegen, für, um, bis</p>
<p class="tline"><b>entlang</b> goes after the noun: den Fluss entlang. <b>bis</b> usually has no article (bis Montag) or pairs with zu: bis zum Bahnhof.</p></div>

<div class="tc df"><h3>Immer Dativ <small>10</small></h3>
<div class="pcs"><span class="pc d">ab</span><span class="pc d">aus</span><span class="pc d">außer</span><span class="pc d">bei</span><span class="pc d">mit</span><span class="pc d">nach</span><span class="pc d">seit</span><span class="pc d">von</span><span class="pc d">zu</span><span class="pc d">gegenüber</span></div>
<p class="memo">Merkhilfe: say it as a chant: <b>aus – bei – mit – nach – seit – von – zu</b></p></div>

<div class="tc df"><h3>Wechselpräpositionen <small>9</small></h3>
<div class="pcs"><span class="pc w">an</span><span class="pc w">auf</span><span class="pc w">hinter</span><span class="pc w">in</span><span class="pc w">neben</span><span class="pc w">über</span><span class="pc w">unter</span><span class="pc w">vor</span><span class="pc w">zwischen</span></div>
<p class="memo"><b style="color:var(--dat)">Wo?</b> → Dativ (position) · <b style="color:var(--akk)">Wohin?</b> → Akkusativ (movement)</p>
<p>They are all about place: you could draw each one in a room. That's how to spot them.</p></div>

<div class="tc df"><h3>Das Verb verrät den Fall</h3>
<div class="rows"><div><span style="color:var(--dat)">liegen</span><span>Das Buch liegt auf <mark class="d">dem</mark> Tisch.</span></div><div><span style="color:var(--akk)">legen</span><span>Ich lege das Buch auf <mark class="a">den</mark> Tisch.</span></div>
<div><span style="color:var(--dat)">stehen</span><span>Die Vase steht auf <mark class="d">dem</mark> Regal.</span></div><div><span style="color:var(--akk)">stellen</span><span>Ich stelle die Vase auf <mark class="a">das</mark> Regal.</span></div>
<div><span style="color:var(--dat)">sitzen</span><span>Ich sitze auf <mark class="d">dem</mark> Pferd.</span></div><div><span style="color:var(--akk)">setzen</span><span>Ich setze mich auf <mark class="a">das</mark> Pferd.</span></div></div>
<p class="tline">Position verbs are strong (lag, stand, saß). Placing verbs are regular (legte, stellte, setzte).</p>
<p class="memo">Österreich: liegen, stehen, sitzen take <b>sein</b> in the Perfekt: Ich <b>bin</b> lange gesessen. In Germany: Ich habe lange gesessen.</p></div>

<div class="tc df"><h3>Wo · Wohin · Woher <small>B1–B2</small></h3><div class="www">
<span></span><span class="h">Wohin?</span><span class="h">Wo?</span><span class="h">Woher?</span>
<span class="k">Räume, Länder mit Artikel</span><span>in den Park<br>in die Schweiz</span><span>im Park<br>in der Schweiz</span><span>aus dem Park<br>aus der Schweiz</span>
<span class="k">Städte, Länder ohne Artikel</span><span>nach Wien</span><span>in Wien</span><span>aus Wien</span>
<span class="k">Rand, Wasser</span><span>an den Strand<br>ans Meer</span><span>am Strand<br>am Fluss</span><span>vom Strand</span>
<span class="k">Fläche, Amt</span><span>auf den Platz<br>auf die Weide</span><span>auf dem Platz<br>auf der Weide</span><span>vom Platz</span>
<span class="k">Personen, Firmen</span><span>zum Arzt<br>zu Anna</span><span>beim Arzt<br>bei Anna</span><span>vom Arzt<br>von Anna</span>
<span class="k">Zuhause</span><span>nach Hause</span><span>zu Hause</span><span>von zu Hause</span></div>
<p class="tline">Woher is always Dativ: aus or von.</p></div>
<div class="tc df"><h3>Kurzformen</h3>
<div class="rows"><div><span style="color:var(--dat)">am · im</span><span>an dem · in dem</span></div><div><span style="color:var(--dat)">beim · vom · zum</span><span>bei dem · von dem · zu dem</span></div><div><span style="color:var(--dat)">zur</span><span>zu der</span></div><div><span style="color:var(--akk)">ans · ins</span><span>an das · in das</span></div></div></div>

<div class="tc df"><h3>Tipps &amp; Fallen</h3>
<div class="rows">
<div><span>an / auf</span><span><b>an</b> = vertical or edge (an der Wand). <b>auf</b> = on top of a surface (auf dem Tisch).</span></div>
<div><span>nach / in / zu</span><span><b>nach</b> Wien, nach Österreich (no article) · <b>in</b> die Schweiz (with article) · <b>zum</b> Arzt, zu Freunden (people, shops, places)</span></div>
<div><span>Haus</span><span>Ich gehe <b>nach Hause</b> (movement) · Ich bin <b>zu Hause</b> (position)</span></div>
<div><span>seit</span><span>Takes the present tense: Ich wohne <b>seit</b> 2010 in Wien. English says “have lived”.</span></div>
<div><span>by train</span><span><b>mit</b> dem Zug, never “bei”. <b>bei</b> = at someone's place: beim Arzt, bei Anna.</span></div>
<div><span>Zeit</span><span><b>am</b> Montag · <b>im</b> Juni · <b>um</b> 8 Uhr · <b>vor</b> einer Woche (Dativ, “ago”)</span></div>
</div></div>

<div class="tc df"><h3>Verben mit fester Präposition <small>B2–C1</small></h3>
<p>Here the preposition is part of the verb, so Wo/Wohin doesn't apply. Learn verb, preposition and case together.</p>
<p class="memo">With <b>an, auf, über</b> the <b style="color:var(--akk)">Akkusativ</b> wins most of the time. Learn the <b style="color:var(--dat)">Dativ</b> exceptions.</p>
<div class="rows">
<div><span style="color:var(--akk)">warten auf</span><span>Wir warten auf <mark class="a">die</mark> Genehmigung.</span></div>
<div><span style="color:var(--akk)">denken an</span><span>Denk bitte an <mark class="a">den</mark> Termin.</span></div>
<div><span style="color:var(--akk)">sich freuen auf</span><span>Ich freue mich auf <mark class="a">das</mark> Wochenende.</span></div>
<div><span style="color:var(--dat)">teilnehmen an</span><span>Er nimmt an <mark class="d">der</mark> Sitzung teil.</span></div>
<div><span style="color:var(--dat)">basieren auf</span><span>Der Entwurf basiert auf <mark class="d">einer</mark> Studie.</span></div>
<div><span style="color:var(--dat)">bestehen auf</span><span>Der Bauherr besteht auf <mark class="d">einem</mark> Flachdach.</span></div>
<div><span style="color:var(--dat)">zweifeln an</span><span>Ich zweifle nicht an <mark class="d">seiner</mark> Kompetenz.</span></div>
<div><span style="color:var(--dat)">sich beteiligen an</span><span>Wir beteiligen uns <mark class="d">am</mark> Wettbewerb.</span></div>
</div>
<p class="tline">Pronouns: for things use da-/wo-: Worauf wartest du? Ich warte <b>darauf</b>. For people keep the preposition: Auf wen? <b>Auf ihn.</b></p></div>

<div class="tc df"><h3>Mit Genitiv <small>B1–C1</small></h3>
<div class="pcs"><span class="pc g">wegen</span><span class="pc g">trotz</span><span class="pc g">während</span><span class="pc g">statt</span><span class="pc g">innerhalb</span><span class="pc g">außerhalb</span></div>
<p class="ex">Wegen <b>des</b> Regens bleiben wir drinnen.</p>
<p class="tline">In speech, Austrians and Germans often use the Dativ here (wegen dem Regen). For exams and writing use the Genitiv.</p></div>`;

const TH_SATZ=`
<div class="tc df"><h3>Das Feldermodell</h3><p>Every German clause fits the same frame. The two verb parts form a bracket around the middle.</p>
<div class="grid"><div class="cell vf"><small>Vorfeld</small><span>Heute</span></div><div class="cell v1"><small>Verb 1</small><span>habe</span></div><div class="cell mf"><small>Mittelfeld</small><span>ich das Pferd</span></div><div class="cell v2"><small>Verb 2</small><span>geputzt</span></div></div>
<p class="memo">Merkhilfe: <b>one thing</b> before the verb, then the verb, then everything else, then the rest of the verb.</p></div>

<div class="tc df"><h3>Drei Verbpositionen</h3>
<div class="rows">
<div><span >Position 2</span><span>Statements and W-questions: Morgen <b>fahre</b> ich nach Graz. Wann <b>kommst</b> du?</span></div>
<div><span >Position 1</span><span>Yes/no questions and commands: <b>Kommst</b> du mit? <b>Komm</b> mit!</span></div>
<div><span >Am Ende</span><span>Nebensätze: …, weil ich morgen nach Graz <b>fahre</b>.</span></div></div></div>

<div class="tc df"><h3>Was füllt Verb 2?</h3>
<div class="pcs"><span class="pc k">Partizip: gemacht</span><span class="pc k">Infinitiv: machen</span><span class="pc k">Präfix: an, auf, mit</span><span class="pc k">Passiv: gemacht werden</span></div>
<p>Modal verbs, Perfekt, Futur, Passiv and separable verbs all close the bracket at the end.</p></div>

<div class="tc df"><h3>Konnektoren: wohin geht das Verb?</h3>
<div class="rows">
<div><span style="color:var(--muted)">Position 0</span><span><b>und, aber, oder, denn, sondern</b>: no effect on word order. Merkhilfe: <b>ADUSO</b></span></div>
<div><span >Verb ans Ende</span><span><b>weil, dass, ob, wenn, als, obwohl, damit, während, bevor, nachdem</b> and all relative pronouns</span></div>
<div><span >Im Vorfeld</span><span><b>deshalb, trotzdem, dann, danach, außerdem, sonst</b>: they take the Vorfeld, so the verb follows straight away. Deshalb <b>bleibe</b> ich zu Hause.</span></div></div></div>

<div class="tc df"><h3>Ordnung im Mittelfeld</h3>
<p class="memo">Merkhilfe: <b>TeKaMoLo</b> = Temporal, Kausal, Modal, Lokal</p>
<p class="ex">Ich fahre <b>morgen</b> <b>wegen der Prüfung</b> <b>mit dem Zug</b> <b>nach Wien</b>.</p>
<p class="tline">When? Why? How? Where? It's a default, not a law, but it always sounds natural.</p></div>

<div class="tc df"><h3>Typische Fehler für Englischsprachige</h3>
<div class="rows">
<div><span>✗ Heute ich arbeite</span><span>✓ Heute <b>arbeite</b> ich. Only one element before the verb.</span></div>
<div><span>✗ weil ich bin müde</span><span>✓ weil ich müde <b>bin</b>. The verb goes to the end.</span></div>
<div><span>✗ Weil es regnet, wir bleiben</span><span>✓ Weil es regnet, <b>bleiben</b> wir. The clause is the Vorfeld.</span></div>
<div><span>✗ Ich habe gemacht es</span><span>✓ Ich habe es <b>gemacht</b>. The participle closes the bracket.</span></div></div></div>`;

const TH_ART=`
<div class="tc df"><h3>Der wichtigste Tipp</h3><p>Always learn a noun with its article, and say it aloud as one word: <b>die Wand</b>, never just “Wand”.</p><p class="memo">Plural is always <b>die</b>. The article you need to learn is the singular one.</p></div>
<div class="tc df"><h3>Endungen → die</h3>`+pcs("",["-ung","-heit","-keit","-schaft","-ion","-tät","-ik","-ur","-ei","-ie","-in","-enz","-anz"])+`<p class="tline">Almost no exceptions. -e is mostly die too (about 9 in 10): die Lampe, die Fassade.</p></div>
<div class="tc df"><h3>Endungen → das</h3>`+pcs("",["-chen","-lein","-ment","-um","-ma","-tum","Ge-","-nis","Verb als Nomen","Metalle","Farben","Brüche","Tierjunge"])+`<p class="tline">das Häuschen, das Fundament, das Zentrum, das Gebäude, das Ergebnis, das Reiten. Exceptions: die Erlaubnis, der Geruch.</p></div>
<div class="tc df"><h3>Endungen → der</h3>`+pcs("",["-ling","-ismus","-ist","-ig","-ant","-ent","-or","Tage","Monate","Jahreszeiten","Wetter","Himmelsrichtungen","Automarken","Währungen"])+`<p class="tline">der Lehrling, der Praktikant, der Motor, der Montag, der Sommer, der Regen.</p></div>
<div class="tc df"><h3>Fallen</h3><div class="rows">
<div><span>-er</span><span>People and tools are der (der Lehrer, der Bohrer), but <b>das</b> Fenster, <b>das</b> Zimmer, <b>die</b> Mauer.</span></div>
<div><span>-e</span><span>der Junge, der Name, das Auge, das Ende.</span></div>
<div><span>Mädchen</span><span>das Mädchen: -chen beats the meaning.</span></div></div></div>
<div class="tc df"><h3>Komposita</h3><p class="memo">The last part decides: das Haus + die Tür = <b>die</b> Haustür.</p><p class="tline">der Stall + das Tor = das Stalltor · das Büro + der Stuhl = der Bürostuhl</p></div>`;

/* ---------- sentence diagrams with connecting arcs ----------
   D("Das Auto~s|wird~v|in der Werkstatt|repariert~v|.~p", "1-3a:Passiv")
   tokens split by |, role after ~ (s subject, v verb, a Akk, d Dat, g Gen, k connector, r relative, x highlight, p punctuation)
   links "i-j" + a (above) or b (below) + ":" label + optional "@a|d|v|g" colour; separated by ; */
function D(spec,links,cap){const toks=spec.split("|").map((t,i)=>{const m=t.split("~");return '<span class="wt '+(m[1]||"n")+'" data-i="'+i+'">'+m[0]+'</span>';}).join("");
  const L=(links||"").split(";").filter(Boolean),up=L.some(l=>/^\d+-\d+a/.test(l)),dn=L.some(l=>/^\d+-\d+b/.test(l));
  return '<div class="arc'+(up?" up":"")+(dn?" dn":"")+'" data-l="'+esc(L.join(";"))+'"><svg aria-hidden="true"></svg><div class="toks">'+toks+'</div>'+(cap?'<p class="arcap">'+cap+'</p>':'')+'</div>';}
function drawArcs(root){(root||document).querySelectorAll(".arc").forEach(el=>{if(!el.offsetWidth)return;const t=el.querySelector(".toks"),svg=el.querySelector("svg");
  t.style.fontSize="";let fs=parseFloat(getComputedStyle(t).fontSize);while(t.scrollWidth>t.clientWidth+1&&fs>10){fs-=1;t.style.fontSize=fs+"px";}
  const R=el.getBoundingClientRect(),sc=R.width/el.offsetWidth||1,W=el.offsetWidth,H=el.offsetHeight;svg.setAttribute("width",W);svg.setAttribute("height",H);svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const box=i=>{const s=el.querySelector('.wt[data-i="'+i+'"]');if(!s)return null;const r=s.getBoundingClientRect();return {x:(r.left-R.left)/sc,y:(r.top-R.top)/sc,w:r.width/sc,h:r.height/sc};};
  let out="";(el.dataset.l||"").split(";").filter(Boolean).forEach((l,n)=>{const m=l.match(/^(\d+)-(\d+)([ab])(?::([^@]*))?(?:@(\w))?/);if(!m)return;const a=box(+m[1]),b=box(+m[2]);if(!a||!b)return;
    const up=m[3]==="a",x1=a.x+a.w/2,x2=b.x+b.w/2,y=up?Math.min(a.y,b.y)-2:Math.max(a.y+a.h,b.y+b.h)+2,hh=Math.min(28,10+Math.abs(x2-x1)/7)*(up?-1:1),c=m[5]||"v";
    out+='<path class="al al-'+c+'" d="M'+x1+' '+(up?a.y-2:a.y+a.h+2)+' C'+x1+' '+(y+hh)+' '+x2+' '+(y+hh)+' '+x2+' '+(up?b.y-2:b.y+b.h+2)+'"/>';
    if(m[4])out+='<text class="alt al-'+c+'" x="'+((x1+x2)/2)+'" y="'+(y+hh*0.78+(up?-3:9))+'" text-anchor="middle">'+esc(m[4])+'</text>';});
  svg.innerHTML=out;});}
function arcsSoon(root){requestAnimationFrame(()=>requestAnimationFrame(()=>drawArcs(root)));}
window.addEventListener("resize",()=>arcsSoon());
try{document.fonts&&document.fonts.ready.then(()=>arcsSoon());}catch(e){}

/* ---------- generic topics: a topic is just {name, badge, lg, tip, src, cards, q, th} ---------- */
const GT={};
function gStage(q,rev){const name=GT[q.t].name;
  if(!rev){$("stage").innerHTML='<div class="pict hide"><b class="gh">'+(q.h||name)+'</b><span class="case">'+(q.hk||"Welche Lösung passt?")+'</span></div>';return;}
  if(q.d){$("stage").innerHTML='<div class="gd">'+q.d+'</div>';arcsSoon($("stage"));return;}
  const full=q.s.replace("___","<b>"+esc(q.o[q.c])+"</b>");$("stage").innerHTML='<div class="pict hide"><b class="gh">'+(q.s.includes("___")?full:esc(q.o[q.c]))+'</b><span class="case">'+(q.hk||name)+'</span></div>';}

 th:`<div class="tc df"><h3>Sechs Zeitformen</h3>${TLZ}</div>
<div class="tc df"><h3>haben oder sein?</h3><div class="rows">
<div><span>sein</span><span>movement from A to B: gehen, fahren, fliegen, kommen, reiten (nach Hause)</span></div>
<div><span>sein</span><span>change of state: aufstehen, einschlafen, wachsen, sterben, werden</span></div>
<div><span>sein</span><span>also: sein, bleiben, passieren, gelingen</span></div>
<div><span>haben</span><span>everything else, all verbs with an Akkusativ object, all reflexive verbs</span></div>
<div><span>Österreich</span><span>liegen, sitzen, stehen with sein: ich bin gestanden</span></div></div></div>
<div class="tc df"><h3>Partizip II</h3><div class="rows">
<div><span>schwach</span><span>ge-…-t: machen → gemacht, kaufen → gekauft</span></div>
<div><span>stark</span><span>ge-…-en, often a vowel change: schreiben → geschrieben, finden → gefunden</span></div>
<div><span>trennbar</span><span>ge in the middle: aufräumen → aufgeräumt, anrufen → angerufen</span></div>
<div><span>ohne ge-</span><span>be-, ver-, er-, ent-, zer-, ge-, miss- and -ieren: bezahlt, verstanden, renoviert</span></div></div></div>
<div class="tc df"><h3>Präteritum im Alltag</h3><div class="pcs">${["war","hatte","konnte","musste","wollte","durfte","sollte","es gab","ging","kam","fuhr","sah","nahm","schrieb","wusste"].map(w=>'<span class="pc">'+w+'</span>').join("")}</div><p class="tline">In speech these are more common than their Perfekt forms. Write stories and reports in the Präteritum.</p></div>
<div class="tc df"><h3>Zeitenfolge</h3><div class="rows">
<div><span>nachdem</span><span>Plusquamperfekt → Präteritum: Nachdem ich gegessen hatte, ging ich.</span></div>
<div><span>nachdem</span><span>Perfekt → Präsens: Nachdem ich gegessen habe, gehe ich.</span></div>
<div><span>Futur II</span><span>finished by then: Bis Freitag werde ich es geschafft haben. Also a guess: Er wird den Zug verpasst haben.</span></div></div></div>`};

 cards:[
 {b:"fest",st:D("Wir~s|warten~v|auf~k|die Genehmigung~a|.~p","1-2a:fest;2-3b:+ Akk@a"),tx:"The preposition belongs to the verb",gt:"No Wo/Wohin logic here: warten auf always takes the Akkusativ.",say:"Wir warten auf die Genehmigung."},
 {b:"+ Dativ",st:D("Ich~s|beschäftige~v|mich|mit~k|dem Entwurf~d|.~p","1-3a:fest;3-4b:+ Dat@d"),tx:"mit, von, nach, zu, bei, aus: always Dativ",gt:"They keep their normal case: sich beschäftigen mit, abhängen von, fragen nach.",say:"Ich beschäftige mich mit dem Entwurf."},
 {b:"an · auf · über",st:ruleSt("meistens + Akkusativ",["denken an + A","warten auf + A","sprechen über + A"]),tx:"Two-way prepositions usually take Akkusativ here",gt:"Learn the Dativ exceptions: teilnehmen an, arbeiten an, zweifeln an, leiden an, basieren auf, bestehen auf, Angst haben vor, warnen vor."},
 {b:"da- · wo-",st:D("Ich~s|warte~v|darauf~k|,~p|dass~k|die Genehmigung|kommt~v|.~p","2-4a:verweist auf"),tx:"For things: darauf, daran, wofür …",gt:"darauf, dass … points forward to a whole clause. With a vowel add r: da-r-auf, wo-r-an.",say:"Ich warte darauf, dass die Genehmigung kommt."},
 {b:"Personen",st:ruleSt("Auf wen wartest du? Auf ihn.",["Worauf wartest du? Darauf.","An wen denkst du? An sie.","Woran denkst du? Daran."]),tx:"For people keep the preposition",gt:"Things: wo-/da- forms. People: preposition + wen/wem or a pronoun."},
 {b:"freuen",st:ruleSt("sich freuen auf · über",["auf das Wochenende (kommt noch)","über das Geschenk (schon da)"]),tx:"Same verb, different preposition, different meaning",gt:"Also: sprechen mit (with) / über (about), bestehen aus (consist of) / auf (insist on)."}],
 q:[
 {s:"Wir warten noch ___ die Genehmigung.",o:["auf","an","für"],why:"warten auf + Akkusativ.",lv:"A2"},
 {s:"Denk bitte ___ den Termin!",o:["an","auf","über"],why:"denken an + Akkusativ.",lv:"A2"},
 {s:"Ich interessiere mich ___ Architektur.",o:["für","an","über"],why:"sich interessieren für.",lv:"A2"},
 {s:"Sie hat sich ___ die Stelle beworben.",o:["um","für","auf"],why:"sich bewerben um.",lv:"B1"},
 {s:"Das hängt ___ Budget ab.",o:["vom","am","zum"],why:"abhängen von + Dativ: vom.",lv:"B1"},
 {s:"Wir nehmen ___ Wettbewerb teil.",o:["am","im","beim"],why:"teilnehmen an + Dativ: am.",lv:"B1"},
 {s:"Ich freue mich schon ___ das Wochenende.",o:["auf","über","an"],why:"Something still to come: sich freuen auf.",lv:"B1"},
 {s:"Ich habe mich sehr ___ dein Geschenk gefreut.",o:["über","auf","an"],why:"Something already there: sich freuen über.",lv:"B1"},
 {s:"Kannst du dich ___ das Pferd kümmern?",o:["um","für","an"],why:"sich kümmern um.",lv:"B1"},
 {s:"Er fragt ___ dem Weg.",o:["nach","für","über"],why:"fragen nach + Dativ.",lv:"A2"},
 {s:"Wir haben lange ___ das Projekt gesprochen.",o:["über","von","an"],why:"sprechen über + Akkusativ (about).",lv:"A2"},
 {s:"Ich bedanke mich ___ die Einladung.",o:["für","über","auf"],why:"sich bedanken für.",lv:"A2"},
 {s:"Hast du Angst ___ Pferden?",o:["vor","von","für"],why:"Angst haben vor + Dativ.",lv:"B1"},
 {s:"Der Entwurf basiert ___ einer Studie.",o:["auf","an","über"],why:"basieren auf + Dativ (exception).",lv:"B2"},
 {s:"Ich zweifle nicht ___ seiner Kompetenz.",o:["an","über","auf"],why:"zweifeln an + Dativ (exception).",lv:"B2"},
 {s:"___ wartest du? Auf den Bus.",o:["Worauf","Wofür","Woran"],why:"A thing: wo + r + auf.",lv:"B1"},
 {s:"Ich warte ___, dass du anrufst.",o:["darauf","dafür","daran"],why:"warten auf → darauf, dass …",lv:"B2"},
 {s:"___ denkst du gerade? An meine Mutter.",o:["An wen","Woran","Worüber"],why:"A person: an wen.",lv:"B1"},
 {s:"Die Fassade besteht ___ Lärchenholz.",o:["aus","auf","von"],why:"bestehen aus = consist of.",lv:"B1"}],
 th:`<div class="tc df"><h3>Die Regel</h3>${D("warten~v|auf~k|den Bus~a","0-1a:fest;1-2b:Akk@a")}<p class="memo">With <b>an, auf, über</b> the Akkusativ wins. <b>mit, von, nach, zu, bei, aus</b> stay Dativ. <b>für, um, gegen</b> stay Akkusativ.</p></div>
<div class="tc df"><h3>Dativ-Ausnahmen</h3><div class="pcs">${["teilnehmen an","arbeiten an","zweifeln an","leiden an","sterben an","basieren auf","bestehen auf","Angst haben vor","warnen vor","sich fürchten vor","schützen vor"].map(w=>'<span class="pc d">'+w+'</span>').join("")}</div></div>
<div class="tc df"><h3>Nach Präposition</h3><div class="rows">
<div><span>auf + A</span><span>warten, achten, hoffen, verzichten, sich freuen (Zukunft), sich verlassen, sich vorbereiten, sich konzentrieren</span></div>
<div><span>an + A</span><span>denken, sich erinnern, sich gewöhnen, sich wenden, glauben</span></div>
<div><span>über + A</span><span>sprechen, nachdenken, sich freuen (Gegenwart), sich ärgern, diskutieren, sich informieren</span></div>
<div><span>für + A</span><span>sich interessieren, sich entscheiden, sich bedanken, sich entschuldigen, sorgen</span></div>
<div><span>um + A</span><span>bitten, sich kümmern, sich bewerben, es geht um</span></div>
<div><span>mit + D</span><span>anfangen, aufhören, sich beschäftigen, telefonieren, rechnen, sich auseinandersetzen</span></div>
<div><span>von + D</span><span>abhängen, träumen, erzählen, sich erholen</span></div>
<div><span>nach + D</span><span>fragen, suchen, sich erkundigen, riechen</span></div>
<div><span>zu + D</span><span>gehören, beitragen, gratulieren, passen</span></div></div></div>
<div class="tc df"><h3>da- und wo-</h3><div class="rows">
<div><span>Sache</span><span>Worauf wartest du? Ich warte darauf.</span></div>
<div><span>Person</span><span>Auf wen wartest du? Ich warte auf ihn.</span></div>
<div><span>Satz</span><span>Ich freue mich darauf, dich zu sehen. · Ich warte darauf, dass du kommst.</span></div>
<div><span>-r-</span><span>before a vowel: darauf, daran, darüber, worum (but: damit, dafür, davon, wofür)</span></div></div></div>
<div class="tc df"><h3>Gleiches Verb, andere Bedeutung</h3><div class="rows">
<div><span>sich freuen</span><span>auf (coming) · über (already here)</span></div>
<div><span>sprechen</span><span>mit (with someone) · über (about something)</span></div>
<div><span>bestehen</span><span>aus (consist of) · auf (insist on)</span></div>
<div><span>sich halten</span><span>an (follow a rule) · für (consider oneself)</span></div></div></div>`};

/* ===== Relativsätze ===== */
const RELT=`<div class="box" role="img" aria-label="Relativpronomen">
<span class="bh"></span><span class="bh">mask.</span><span class="bh">neutr.</span><span class="bh">fem.</span><span class="bh">Plural</span>
<span class="bl" style="grid-row:2">Nom</span><span class="bl" style="grid-row:3">Akk</span><span class="bl" style="grid-row:4">Dat</span><span class="bl" style="grid-row:5">Gen</span>
<b class="c nom" style="grid-area:2/2/3/3">der</b><b class="c akk" style="grid-area:3/2/4/3">den</b><b class="c same" style="grid-area:2/3/4/4">das</b><b class="c same" style="grid-area:2/4/4/6">die</b>
<b class="c dat" style="grid-area:4/2/5/4">dem</b><b class="c dat" style="grid-area:4/4/5/5">der</b><b class="c dat new" style="grid-area:4/5/5/6">denen</b>
<b class="c gen new" style="grid-area:5/2/6/4">dessen</b><b class="c gen new" style="grid-area:5/4/6/6">deren</b></div>`;
GT.rel={name:"Relativsätze",badge:"Relativpronomen",tip:"Two questions: which noun does it refer to (gender, number)? What job does it do in its own clause (case)?",src:["grammis","lingolia","dg20"],
 lg:'<span><b class="wt x lgk">Nomen</b> → <b class="wt r lgk">der</b> Bezug</span>',
 cards:[
 {b:"Bezug",st:D("Das ist|der Architekt~x|,~p|der~r|das Haus|entworfen hat~v|.~p","1-3a:gleiches Genus;3-5b:Verb ans Ende@g"),tx:"A relative clause describes a noun",gt:"The relative pronoun takes the gender and number of the noun. The verb goes to the end.",say:"Das ist der Architekt, der das Haus entworfen hat."},
 {b:"Formen",st:RELT,tx:"Almost the same as der, die, das",gt:"New are only <b>denen</b> (Dativ plural) and <b>dessen / deren</b> (Genitiv)."},
 {b:"Fall",st:D("der Plan~x|,~p|den~a|ich|gezeichnet habe~v","0-2a:Genus von Plan;2-4b:Akk: ich zeichne ihn@a"),tx:"The case comes from the relative clause",gt:"Ask: what is the pronoun in its own clause? Here the object of zeichnen → Akkusativ den.",say:"der Plan, den ich gezeichnet habe"},
 {b:"Präposition",st:D("das Büro~x|,~p|in~k|dem~d|ich|arbeite~v","0-3a:Genus von Büro;2-3b:in + Dat@d"),tx:"Preposition first, then the pronoun",gt:"Wo? → Dativ: das Büro, in dem ich arbeite. Never put the preposition at the end as in English.",say:"das Büro, in dem ich arbeite"},
 {b:"dessen · deren",st:D("der Kollege~x|,~p|dessen~g|Büro|neben meinem|liegt~v","0-2a:sein Büro"),tx:"Whose: dessen (der/das), deren (die/Plural)",gt:"The next noun has no article: dessen Büro, deren Entwurf.",say:"der Kollege, dessen Büro neben meinem liegt"},
 {b:"was · wo",st:ruleSt("alles, was ich weiß",["nichts, was hilft","das Beste, was es gibt","Wien, wo ich wohne"]),tx:"was after alles, nichts, etwas, das and superlatives",gt:"wo for places: die Stadt, wo ich wohne (also: in der ich wohne)."}],
 q:[
 {s:"Das ist der Mann, ___ mir geholfen hat.",o:["der","den","dem"],why:"He helped: subject → Nominativ der.",lv:"B1"},
 {s:"Das ist der Plan, ___ ich gezeichnet habe.",o:["den","der","dem"],why:"I drew it: object → Akkusativ den.",lv:"B1"},
 {s:"Die Frau, ___ ich das Buch gegeben habe, ist meine Kollegin.",o:["der","die","deren"],why:"I gave her the book: Dativ feminine der.",lv:"B1"},
 {s:"Das Haus, ___ wir gekauft haben, ist alt.",o:["das","dem","dessen"],why:"Object, neuter: das.",lv:"B1"},
 {s:"Die Kinder, mit ___ ich spiele, sind laut.",o:["denen","den","die"],why:"mit + Dativ plural: denen.",lv:"B1"},
 {s:"Der Kollege, ___ Büro neben meinem liegt, ist nett.",o:["dessen","deren","dem"],why:"His office, masculine: dessen.",lv:"B2"},
 {s:"Die Firma, für ___ ich arbeite, sitzt in Wien.",o:["die","der","deren"],why:"für + Akkusativ, feminine: die.",lv:"B1"},
 {s:"Das Pferd, auf ___ ich reite, heißt Luna.",o:["dem","das","den"],why:"Wo? auf + Dativ, neuter: dem.",lv:"B1"},
 {s:"Die Architektin, ___ Entwurf gewonnen hat, kommt aus Graz.",o:["deren","dessen","der"],why:"Her design, feminine: deren.",lv:"B2"},
 {s:"Wien ist die Stadt, ___ ich am liebsten wohne.",o:["in der","in die","in den"],why:"Wo? in + Dativ, feminine: in der.",lv:"B1"},
 {s:"Alles, ___ du sagst, stimmt.",o:["was","das","dem"],why:"After alles: was.",lv:"B2"},
 {s:"Das ist das Beste, ___ ich je gegessen habe.",o:["was","das","dem"],why:"After a superlative: was.",lv:"B2"},
 {s:"Die Pläne, ___ du mir geschickt hast, sind gut.",o:["die","denen","der"],why:"Object, plural: die.",lv:"B1"},
 {s:"Ich danke den Kollegen, ___ mir geholfen haben.",o:["die","denen","den"],why:"They helped: subject, plural → die.",lv:"B1"},
 {s:"Kennst du den Mann, ___ du geholfen hast?",o:["dem","den","der"],why:"helfen + Dativ: dem.",lv:"B1"},
 {s:"Das Projekt, an ___ wir arbeiten, ist groß.",o:["dem","das","den"],why:"arbeiten an + Dativ, neuter: dem.",lv:"B2"}],
 th:`<div class="tc df"><h3>Alle Relativpronomen</h3>${RELT}<p class="tline">Pale cells are the only new forms. Everything else is the definite article.</p></div>
<div class="tc df"><h3>Zwei Fragen</h3>${D("die Frau~x|,~p|der~d|ich|helfe~v","0-2a:Genus;2-4b:Fall@d")}<div class="rows"><div><span>1 · Genus</span><span>from the noun it refers to: die Frau → feminine</span></div><div><span>2 · Fall</span><span>from its job in the relative clause: ich helfe ihr → Dativ der</span></div></div></div>
<div class="tc df"><h3>Mit Präposition</h3><div class="rows">
<div><span>Wo?</span><span>das Haus, in dem ich wohne</span></div>
<div><span>Wohin?</span><span>das Haus, in das wir ziehen</span></div>
<div><span>Verb + Präp.</span><span>die Firma, für die ich arbeite · der Termin, an den ich denke</span></div></div><p class="tline">The preposition always comes first. English “the house I live in” has no equivalent.</p></div>
<div class="tc df"><h3>dessen · deren</h3><div class="rows">
<div><span>dessen</span><span>der Kollege, dessen Büro … · das Haus, dessen Dach …</span></div>
<div><span>deren</span><span>die Kollegin, deren Entwurf … · die Pferde, deren Stall …</span></div></div><p class="tline">After dessen and deren, adjectives take the endings with no article: dessen neues Büro.</p></div>
<div class="tc df"><h3>was · wo · wer</h3><div class="rows">
<div><span>was</span><span>after alles, nichts, etwas, vieles, das, superlatives: alles, was ich weiß</span></div>
<div><span>was</span><span>for a whole clause: Er kam pünktlich, was mich freute.</span></div>
<div><span>wo</span><span>places and times: die Stadt, wo … · der Tag, an dem / wo …</span></div>
<div><span>wer</span><span>general: Wer zu spät kommt, muss warten.</span></div></div></div>`};

/* ===== Passiv ===== */
const PAKT=`<div class="pas">${D("Der Mechaniker~s|repariert~v|das Auto~a|.~p","","Aktiv")}<div class="parr">↓ <small>Akkusativ-Objekt wird Subjekt</small></div>${D("Das Auto~s|wird~v|vom Mechaniker|repariert~v|.~p","1-3a:werden + Partizip II","Passiv")}</div>`;
GT.pass={name:"Passiv",badge:"Passiv",tip:"Passiv = werden + Partizip II. Perfekt uses worden, not geworden.",src:["grammis","dg20","umich"],
 lg:'<span><b class="wt v lgk">wird</b> … <b class="wt v lgk">repariert</b> Satzklammer</span>',
 cards:[
 {b:"Aktiv → Passiv",st:PAKT,tx:"The action matters, not the doer",gt:"The Akkusativ object becomes the subject. The doer is optional: von + Dativ (persons), durch (causes, means).",say:"Der Mechaniker repariert das Auto. Das Auto wird vom Mechaniker repariert."},
 {b:"Präteritum",st:D("Das Haus~s|wurde~v|1912|gebaut~v|.~p","1-3a:wurde + Partizip"),tx:"Präteritum: wurde",gt:"The most common written form, for history, reports, reviews.",say:"Das Haus wurde 1912 gebaut."},
 {b:"Perfekt",st:D("Das Paket~s|ist~v|heute früh|geliefert worden~v|.~p","1-3a:ist … worden"),tx:"Perfekt: ist + Partizip + worden",gt:"In the passive, worden replaces geworden.",say:"Das Paket ist heute früh geliefert worden."},
 {b:"Modalverb",st:D("Die Rechnung~s|muss~v|bis Freitag|bezahlt werden~v|.~p","1-3a:Modalverb … Partizip + werden"),tx:"Modalverb + Partizip II + werden",gt:"muss gemacht werden, kann gelöst werden, darf nicht geraucht werden.",say:"Die Rechnung muss bis Freitag bezahlt werden."},
 {b:"Nebensatz",st:D("…, weil~k|die Pläne|noch|geprüft werden~v|müssen~v|.~p","0-4a:alles ans Ende"),tx:"In a Nebensatz everything goes to the end",gt:"Order at the end: Partizip, werden, Modalverb.",say:"weil die Pläne noch geprüft werden müssen"},
 {b:"Zustand",st:D("Die Tür~s|ist~v|seit Stunden|geschlossen~v|.~p","1-3a:Zustand")+D("Die Tür~s|wird~v|um acht|geschlossen~v|.~p","1-3a:Vorgang"),tx:"sein-Passiv: the result",gt:"wird geschlossen = someone closes it now. ist geschlossen = it is closed (state)."},
 {b:"Dativ bleibt",st:D("Dem Patienten~d|wird~v|sofort|geholfen~v|.~p","1-3a:Passiv;0-1b:Dativ bleibt Dativ@d"),tx:"Only the Akkusativ becomes the subject",gt:"A Dativ stays Dativ, and with no subject the verb is singular: Mir wurde gesagt, … · Hier wird nicht geraucht.",say:"Dem Patienten wird sofort geholfen."},
 {b:"Ersatzformen",st:ruleSt("Das lässt sich lösen.",["Das ist zu prüfen.","Das ist machbar.","Man prüft das."]),tx:"Other ways to say it (C1)",gt:"sich lassen + Infinitiv = can be done. sein + zu = must or can be done. -bar = can be done. man = someone."}],
 q:[
 {s:"Das Auto ___ in der Werkstatt repariert.",o:["wird","hat","wurden"],why:"Passiv Präsens: wird + Partizip II. Singular subject.",lv:"B1"},
 {s:"Das Haus ___ 1912 gebaut.",o:["wurde","hatte","worden"],why:"Passiv Präteritum: wurde + Partizip II.",lv:"B1"},
 {s:"Das Paket ist heute früh geliefert ___.",o:["worden","geworden","werden"],why:"Passiv Perfekt: worden, not geworden.",lv:"B2"},
 {s:"Die Rechnung muss bis Freitag bezahlt ___.",o:["werden","worden","wird"],why:"Modalverb + Partizip II + werden.",lv:"B1"},
 {s:"Die Ergebnisse ___ morgen veröffentlicht.",o:["werden","wurden","worden"],why:"Plural, future meaning with morgen: werden.",lv:"B1"},
 {s:"Der Plan wurde ___ der Architektin gezeichnet.",o:["von","durch","mit"],why:"A person as the doer: von + Dativ.",lv:"B1"},
 {s:"Das Dorf wurde ___ das Hochwasser zerstört.",o:["durch","von","mit"],why:"A cause, with Akkusativ das: durch.",lv:"B2"},
 {s:"Dem Patienten ___ sofort geholfen.",o:["wird","werden","wurden"],why:"No subject (Dativ stays): verb singular.",lv:"B2"},
 {s:"Hier ___ nicht geraucht.",o:["wird","ist","hat"],why:"Impersonal passive: wird + Partizip.",lv:"B1"},
 {s:"Ich weiß, dass hier viel gearbeitet ___.",o:["wird","worden","werden"],why:"Nebensatz: Partizip, then wird at the end.",lv:"B2"},
 {s:"Wir warten, weil die Unterlagen noch unterschrieben werden ___.",o:["müssen","muss","gemusst"],why:"Plural subject, modal verb last.",lv:"C1"},
 {s:"Das Problem lässt sich leicht ___.",o:["lösen","gelöst","löst"],why:"sich lassen + Infinitiv.",lv:"C1"},
 {s:"Der Antrag ist bis Montag ___ prüfen.",o:["zu","um zu","für"],why:"sein + zu + Infinitiv = muss geprüft werden.",lv:"C1"},
 {s:"Das Material ist ___. (Man kann es recyceln.)",o:["recycelbar","recycelt","recyceln"],why:"-bar = can be done.",lv:"C1"},
 {s:"Man baut hier ein neues Haus. → Hier ___ ein neues Haus gebaut.",o:["wird","werden","wurde"],why:"Same tense as the Aktiv (Präsens), singular: wird.",lv:"B1"},
 {s:"Die Fenster ___ gestern geputzt.",o:["wurden","wurde","worden"],why:"Plural, Präteritum: wurden.",lv:"B1"},
 {s:"Das Gebäude war damals schon renoviert ___.",o:["worden","geworden","werden"],why:"Plusquamperfekt Passiv: war … worden.",lv:"C1"}],
 th:`<div class="tc df"><h3>Aktiv und Passiv</h3>${PAKT}</div>
<div class="tc df"><h3>Alle Zeiten</h3><div class="rows">
<div><span>Präsens</span><span>Das Haus <b>wird</b> gebaut.</span></div>
<div><span>Präteritum</span><span>Das Haus <b>wurde</b> gebaut.</span></div>
<div><span>Perfekt</span><span>Das Haus <b>ist</b> gebaut <b>worden</b>.</span></div>
<div><span>Plusquamperf.</span><span>Das Haus <b>war</b> gebaut <b>worden</b>.</span></div>
<div><span>Futur</span><span>Das Haus <b>wird</b> gebaut <b>werden</b>.</span></div>
<div><span>Modalverb</span><span>Das Haus <b>muss</b> gebaut <b>werden</b>.</span></div></div></div>
<div class="tc df"><h3>von oder durch?</h3><div class="rows"><div><span>von + Dat</span><span>the doer, usually a person or institution: von der Stadt geplant</span></div><div><span>durch + Akk</span><span>a cause or means: durch das Hochwasser zerstört, durch einen Boten zugestellt</span></div></div></div>
<div class="tc df"><h3>Vorgang oder Zustand</h3><div class="rows"><div><span>werden</span><span>process: Die Tür wird geschlossen.</span></div><div><span>sein</span><span>result: Die Tür ist geschlossen. · Der Tisch ist gedeckt.</span></div></div></div>
<div class="tc df"><h3>Ohne Subjekt</h3>${D("Mir~d|wurde~v|gesagt~v|,~p|dass …","0-1b:Dativ bleibt@d")}<p class="tline">Dem Patienten wird geholfen. · Hier wird gearbeitet. · Es wird getanzt. The verb is always singular.</p></div>
<div class="tc df"><h3>Ersatzformen <small>C1</small></h3><div class="rows">
<div><span>sich lassen</span><span>Das Problem lässt sich lösen. = kann gelöst werden</span></div>
<div><span>sein + zu</span><span>Der Antrag ist bis Montag zu prüfen. = muss geprüft werden</span></div>
<div><span>-bar / -lich</span><span>machbar, lösbar, erklärlich = kann gemacht werden</span></div>
<div><span>man</span><span>Man prüft den Antrag. = Der Antrag wird geprüft.</span></div></div></div>`};

 {b:"Formen",st:ruleSt("würde + Infinitiv",K2F.slice(0,6)),tx:"würde for most verbs, own forms for a few",gt:"Own forms: wäre, hätte, the modals, and in writing wüsste, käme, ginge, gäbe."},

 {b:"Modal + Vergangenheit",st:D("Ich~s|hätte~v|früher|kommen sollen~v|.~p","1-3a:hätte … Infinitiv + Modalverb"),tx:"hätte + two infinitives (C1)",gt:"Ich hätte früher kommen sollen = I should have come earlier. Not: gesollt.",say:"Ich hätte früher kommen sollen."},
 {b:"ohne wenn",st:D("Hätte~v|ich|Zeit|,~p|würde~v|ich~s|kommen~v|.~p","0-1b:Verb zuerst = wenn@g"),tx:"Verb first replaces wenn",gt:"Hätte ich Zeit, … = Wenn ich Zeit hätte, … Common in writing.",say:"Hätte ich Zeit, würde ich kommen."},
 {b:"als ob",st:ruleSt("Er tut so, als ob er nichts wüsste.",["Er tut so, als wüsste er nichts.","Es sieht aus, als würde es regnen."]),tx:"als ob, als: as if",gt:"With als alone, the verb comes straight after it."}],
 q:[
 {s:"Wenn ich Zeit ___, würde ich mehr zeichnen.",o:["hätte","habe","hatte"],why:"Unreal: hätte.",lv:"B1"},
 {s:"Wenn ich du ___, würde ich das Angebot annehmen.",o:["wäre","bin","war"],why:"Unreal: wäre.",lv:"B1"},
 {s:"___ Sie mir bitte kurz helfen?",o:["Könnten","Konnten","Gekonnt"],why:"Polite: könnten.",lv:"A2"},
 {s:"Ich ___ gern einen Kaffee.",o:["hätte","hatte","hat"],why:"Polite order: Ich hätte gern …",lv:"A2"},
 {s:"An deiner Stelle ___ ich früher losfahren.",o:["würde","werde","wurde"],why:"Advice: würde + Infinitiv.",lv:"B1"},
 {s:"Wenn ich das gewusst ___, wäre ich gekommen.",o:["hätte","habe","wäre"],why:"Past unreal: hätte + Partizip (wissen takes haben).",lv:"B2"},
 {s:"Wenn der Zug pünktlich gewesen wäre, ___ wir den Termin geschafft.",o:["hätten","wären","würden"],why:"schaffen takes haben: hätten … geschafft.",lv:"B2"},
 {s:"Er tut so, als ___ er nichts.",o:["wüsste","weiß","wusste"],why:"als + Konjunktiv II, verb straight after als.",lv:"C1"},
 {s:"Du ___ mehr schlafen. (Rat)",o:["solltest","sollst","sollen"],why:"Advice: solltest (Konjunktiv II of sollen).",lv:"B1"},
 {s:"Ich hätte früher kommen ___.",o:["sollen","gesollt","soll"],why:"Two infinitives: kommen sollen.",lv:"C1"},
 {s:"Ich wünschte, ich ___ mehr Zeit.",o:["hätte","habe","hatte"],why:"Wish: hätte.",lv:"B1"},
 {s:"Wenn es nicht regnen ___, könnten wir ausreiten.",o:["würde","wird","wurde"],why:"würde + Infinitiv for regnen.",lv:"B1"},
 {s:"Es ___ schön, wenn du mitkommst.",o:["wäre","war","würde"],why:"Konjunktiv II of sein: wäre.",lv:"B1"},
 {s:"___ ich mehr Geld, würde ich ein Pferd kaufen.",o:["Hätte","Habe","Hatte"],why:"Verb first instead of wenn: Hätte ich …",lv:"B2"},
 {s:"Das ___ stimmen. (Vermutung)",o:["dürfte","darf","durfte"],why:"Guess: dürfte = probably.",lv:"C1"},
 {s:"___ es möglich, den Termin zu verschieben?",o:["Wäre","War","Würde"],why:"Polite: Wäre es möglich …?",lv:"B1"}],
 th:`<div class="tc df"><h3>Formen</h3><div class="pcs">${K2F.map(w=>'<span class="pc">'+w+'</span>').join("")}</div><p class="memo">All other verbs: <b>würde + Infinitiv</b>. ich würde, du würdest, er würde, wir würden.</p></div>
<div class="tc df"><h3>Wofür?</h3><div class="rows">
<div><span>irreal</span><span>Wenn ich Zeit hätte, würde ich kommen.</span></div>
<div><span>höflich</span><span>Könnten Sie …? · Ich hätte gern … · Würden Sie bitte …?</span></div>
<div><span>Wunsch</span><span>Wenn ich doch … hätte! · Ich wünschte, …</span></div>
<div><span>Rat</span><span>Du solltest … · An deiner Stelle würde ich …</span></div>
<div><span>Vermutung</span><span>Das dürfte stimmen. · Er müsste schon da sein.</span></div></div></div>
<div class="tc df"><h3>Vergangenheit</h3>${D("hätte~v|… gemacht~v","0-1a:haben-Verben")}${D("wäre~v|… gekommen~v","0-1a:sein-Verben")}<p class="tline">Same choice of haben or sein as in the Perfekt. With a modal: hätte … machen müssen.</p></div>
<div class="tc df"><h3>wenn-Sätze</h3><div class="rows">
<div><span>real</span><span>Wenn ich Zeit habe, komme ich. (possible)</span></div>
<div><span>irreal jetzt</span><span>Wenn ich Zeit hätte, käme ich / würde ich kommen.</span></div>
<div><span>irreal früher</span><span>Wenn ich Zeit gehabt hätte, wäre ich gekommen.</span></div>
<div><span>ohne wenn</span><span>Hätte ich Zeit, würde ich kommen.</span></div></div></div>
<div class="tc df"><h3>als ob · als</h3><p class="ex">Er tut so, als ob er nichts wüsste. · Er tut so, als wüsste er nichts.</p><p class="tline">With als alone, the verb comes straight after it.</p></div>`};

/* ===== Konjunktiv I ===== */
GT.k1={name:"Konjunktiv I",badge:"Konjunktiv I",tip:"Konjunktiv I reports what others said. If the form looks like the Indikativ, use Konjunktiv II.",src:["grammis","dg20","duden"],
 lg:'<span><b class="wt v lgk">sei</b> · <b class="wt v lgk">habe</b> · <b class="wt v lgk">komme</b></span>',
 cards:[
 {b:"Wiedergabe",st:`<div class="pas">${D("„Ich~s|bin~v|krank.“","","direkt")}<div class="parr">↓ <small>berichtet</small></div>${D("Er sagt,|er~s|sei~v|krank|.~p","1-2a:Konjunktiv I","indirekt")}</div>`,tx:"Reported speech",gt:"News, reports and academic writing use Konjunktiv I to show: this is what someone said, not my claim.",say:"Er sagt, er sei krank."},
 {b:"Formen",st:ruleSt("Stamm + e",["er komme","er habe","er könne","er werde","er wisse","er sei"]),tx:"Mostly needed for er, sie, es",gt:"Infinitive stem + -e. sein is irregular: ich sei, du seist, er sei, wir seien, sie seien."},
 {b:"Ersatz",st:`<div class="pas">${D("Sie sagen,|sie~s|haben~v|keine Zeit|.~p","1-2a:= Indikativ?")}<div class="parr">↓ <small>Konjunktiv II</small></div>${D("Sie sagen,|sie~s|hätten~v|keine Zeit|.~p","1-2a:eindeutig")}</div>`,tx:"Looks like the Indikativ? Use Konjunktiv II",gt:"sie haben (Konj. I) = sie haben (Indikativ) → sie hätten. Also kommen → kämen, or würden + Infinitiv."},
 {b:"Vergangenheit",st:D("Sie sagt,|sie~s|habe~v|den Plan|gestern|abgegeben~v|.~p","2-5a:habe + Partizip"),tx:"habe / sei + Partizip II",gt:"For any past form in the original: Er sei gekommen. Sie habe es gewusst.",say:"Sie sagt, sie habe den Plan gestern abgegeben."},
 {b:"Zukunft",st:D("Laut Bericht|werde~v|das Projekt|teurer|werden~v|.~p","1-4a:werde + Infinitiv"),tx:"werde + Infinitiv",gt:"Original: Das Projekt wird teurer werden.",say:"Laut Bericht werde das Projekt teurer werden."},
 {b:"Fragen · Bitten",st:ruleSt("Er fragt, ob ich komme.",["Sie fragt, wann der Termin sei.","Er sagt, ich solle warten.","Sie bittet, man möge leise sein."]),tx:"Questions with ob or a W-word, commands with sollen",gt:"Polite requests: mögen."},
 {b:"Perspektive",st:ruleSt("„Ich komme morgen hierher.“",["→ Sie sagt, sie komme am nächsten Tag dorthin."]),tx:"Change person, time and place",gt:"ich → er/sie · heute → an diesem Tag · morgen → am nächsten Tag · hier → dort."}],
 q:[
 {s:"Der Minister sagt, er ___ zufrieden.",o:["sei","seid","sein"],why:"Konjunktiv I of sein, 3rd person: sei.",lv:"B2"},
 {s:"Sie sagt, sie ___ morgen. (kommen)",o:["komme","kommt","kam"],why:"Konjunktiv I: stem + e.",lv:"C1"},
 {s:"Er behauptet, er ___ keine Zeit.",o:["habe","hat","hatte"],why:"Konjunktiv I of haben: habe.",lv:"C1"},
 {s:"Sie sagen, sie ___ keine Zeit.",o:["hätten","haben","habe"],why:"sie haben looks like the Indikativ → Konjunktiv II hätten.",lv:"C1"},
 {s:"Laut Bericht ___ das Projekt teurer werden.",o:["werde","wird","wurde"],why:"Konjunktiv I of werden: werde.",lv:"C1"},
 {s:"Er sagte, er ___ gestern in Graz gewesen.",o:["sei","ist","war"],why:"Past in reported speech: sei + Partizip.",lv:"C1"},
 {s:"Sie erzählte, sie ___ den Plan abgegeben.",o:["habe","hat","hatte"],why:"Past with haben: habe + Partizip.",lv:"C1"},
 {s:"Der Arzt meint, ich ___ mehr schlafen.",o:["solle","soll","sollen"],why:"Reported advice: solle.",lv:"C1"},
 {s:"Er fragt, ___ ich morgen komme.",o:["ob","dass","wenn"],why:"Reported yes/no question: ob.",lv:"B2"},
 {s:"Sie sagt: „Ich bin müde.“ → Sie sagt, sie ___ müde.",o:["sei","bin","ist"],why:"Konjunktiv I, 3rd person: sei.",lv:"B2"},
 {s:"Die Firma teilt mit, man ___ die Preise erhöhen.",o:["werde","wird","wurde"],why:"Reported future: werde + Infinitiv.",lv:"C1"},
 {s:"Die Nachbarn sagen, sie ___ nichts gehört.",o:["hätten","haben","habe"],why:"sie haben = Indikativ → hätten gehört.",lv:"C1"},
 {s:"Er sagt, er ___ das nicht. (wissen)",o:["wisse","weiß","wusste"],why:"Konjunktiv I of wissen: wisse.",lv:"C1"}],
 th:`<div class="tc df"><h3>Wofür?</h3><p>Konjunktiv I marks reported speech: news, reports, minutes, academic texts. In everyday speech Germans and Austrians mostly use the Indikativ or Konjunktiv II.</p>${D("Er sagt,|er~s|sei~v|krank|.~p","1-2a:berichtet")}</div>
<div class="tc df"><h3>Formen</h3><div class="ptab"><span class="h">Person</span><span class="h">sein</span><span class="h">haben / kommen</span>${[["ich","sei","habe* / komme*"],["du","seist","habest / kommest"],["er, sie, es","sei","habe / komme"],["wir","seien","haben* / kommen*"],["ihr","seiet","habet / kommet"],["sie, Sie","seien","haben* / kommen*"]].map(r=>r.map(c=>'<span>'+c+'</span>').join("")).join("")}</div><p class="tline">* same as the Indikativ → use Konjunktiv II: hätte, käme.</p></div>
<div class="tc df"><h3>Die Ersatzregel</h3><p class="memo">Konjunktiv I = Indikativ? → <b>Konjunktiv II</b>. Konjunktiv II = Präteritum? → <b>würde + Infinitiv</b>.</p><p class="tline">sie kommen → sie kämen · sie arbeiten (Konj. I) = sie arbeiteten (Konj. II looks like Präteritum) → sie würden arbeiten.</p></div>
<div class="tc df"><h3>Zeiten</h3><div class="rows">
<div><span>Gegenwart</span><span>Er sagt, er komme / sei krank.</span></div>
<div><span>Vergangenheit</span><span>Er sagt, er sei gekommen / habe es gewusst.</span></div>
<div><span>Zukunft</span><span>Er sagt, er werde kommen.</span></div></div><p class="tline">The tense of the reporting verb (sagt, sagte) does not matter.</p></div>
<div class="tc df"><h3>Direkt → indirekt</h3><div class="rows">
<div><span>Aussage</span><span>„Ich komme.“ → Sie sagt, sie komme.</span></div>
<div><span>Ja/Nein-Frage</span><span>„Kommst du?“ → Er fragt, ob ich komme.</span></div>
<div><span>W-Frage</span><span>„Wann kommst du?“ → Er fragt, wann ich komme.</span></div>
<div><span>Befehl</span><span>„Warte!“ → Er sagt, ich solle warten. · höflich: möge</span></div>
<div><span>Zeit, Ort</span><span>heute → an diesem Tag · morgen → am nächsten Tag · hier → dort</span></div></div></div>`};

/* ===== Nomen-Verb-Verbindungen ===== */
GT.nvv={name:"Nomen-Verb-Verbindungen",badge:"NVV",tip:"The noun carries the meaning, the verb is almost empty. Learn noun + verb as one block.",src:["dwds","dg20","duden"],
 lg:'<span><b class="wt x lgk">in Frage</b> + <b class="wt v lgk">stellen</b> ein Block</span>',
 cards:[
 {b:"Was ist das?",st:D("Wir~s|stellen~v|den Termin|in Frage~x|.~p","1-3a:in Frage stellen = bezweifeln"),tx:"Noun + almost empty verb = one meaning",gt:"Formal register for letters, reports and lectures. Most can be replaced by one verb.",say:"Wir stellen den Termin in Frage."},
 {b:"stellen · stehen",st:ruleSt("zur Verfügung stellen · stehen",["eine Frage stellen","einen Antrag stellen","in Rechnung stellen","unter Druck stehen","zur Diskussion stehen"]),tx:"stellen = make it so · stehen = it is so",gt:"Die Stadt stellt den Saal zur Verfügung. Der Saal steht zur Verfügung."},
 {b:"nehmen",st:ruleSt("Stellung nehmen",["Rücksicht nehmen auf","in Anspruch nehmen","Bezug nehmen auf","Abschied nehmen von","in Betrieb nehmen"]),tx:"With nehmen",gt:"Stellung nehmen zu = comment on. Rücksicht nehmen auf = be considerate of."},
 {b:"kommen · bringen",st:ruleSt("zum Ausdruck bringen · kommen",["zur Sprache bringen · kommen","in Frage kommen","in Betracht kommen","zu Ende bringen","in Ordnung bringen"]),tx:"bringen = active · kommen = passive meaning",gt:"Das Thema kommt zur Sprache = wird besprochen."},
 {b:"treffen · finden",st:ruleSt("eine Entscheidung treffen",["Maßnahmen treffen / ergreifen","eine Vereinbarung treffen","Anwendung finden","Zustimmung finden","Beachtung finden"]),tx:"treffen = decide · finden = passive meaning",gt:"Die Regel findet Anwendung = wird angewendet."},
 {b:"ersetzen",st:ruleSt("eine Entscheidung treffen = entscheiden",["Auskunft geben = informieren","in Auftrag geben = beauftragen","zur Kenntnis nehmen = bemerken"]),tx:"Each has a one-word equivalent",gt:"Use the noun version for formal writing, the verb for speech."}],
 q:[
 {s:"Wir müssen heute eine Entscheidung ___.",o:["treffen","machen","stellen"],why:"eine Entscheidung treffen.",lv:"B2"},
 {s:"Darf ich Ihnen eine Frage ___?",o:["stellen","machen","fragen"],why:"eine Frage stellen.",lv:"B1"},
 {s:"Der Raum ___ allen Mitarbeitern zur Verfügung.",o:["steht","stellt","kommt"],why:"It is available: zur Verfügung stehen.",lv:"B2"},
 {s:"Die Stadt ___ uns den Saal zur Verfügung.",o:["stellt","steht","gibt"],why:"Someone makes it available: zur Verfügung stellen.",lv:"B2"},
 {s:"Bitte ___ Sie Rücksicht auf die Pferde.",o:["nehmen","geben","machen"],why:"Rücksicht nehmen auf.",lv:"B2"},
 {s:"Diese Lösung ___ für uns nicht in Frage.",o:["kommt","steht","stellt"],why:"in Frage kommen = be possible.",lv:"C1"},
 {s:"Der Gutachter ___ den Termin in Frage.",o:["stellt","kommt","nimmt"],why:"in Frage stellen = doubt.",lv:"C1"},
 {s:"Das Thema ___ in der Sitzung zur Sprache.",o:["kam","brachte","stellte"],why:"zur Sprache kommen = was discussed.",lv:"C1"},
 {s:"Die neue Regel ___ ab Mai Anwendung.",o:["findet","kommt","nimmt"],why:"Anwendung finden = wird angewendet.",lv:"C1"},
 {s:"Die Gemeinde muss Maßnahmen ___.",o:["ergreifen","machen","stellen"],why:"Maßnahmen ergreifen (or treffen).",lv:"C1"},
 {s:"Der Bauherr ___ Stellung zum Entwurf.",o:["nimmt","gibt","stellt"],why:"Stellung nehmen zu.",lv:"C1"},
 {s:"Ich möchte meinen Dank zum Ausdruck ___.",o:["bringen","kommen","stellen"],why:"zum Ausdruck bringen.",lv:"C1"},
 {s:"Wir haben ein Gutachten in Auftrag ___.",o:["gegeben","genommen","gestellt"],why:"in Auftrag geben = beauftragen.",lv:"C1"},
 {s:"Das Projekt steht unter großem ___.",o:["Druck","Kontakt","Ende"],why:"unter Druck stehen.",lv:"B2"},

 {s:"Wir müssen das Projekt bis Juni zu Ende ___.",o:["bringen","kommen","stellen"],why:"zu Ende bringen = finish.",lv:"C1"}],
 th:`<div class="tc df"><h3>Was sind NVV?</h3>${D("eine Entscheidung~x|treffen~v","","= entscheiden")}<p>A noun carries the meaning, the verb is almost empty. Typical of formal German: letters, reports, lectures.</p></div>
<div class="tc df"><h3>stellen · stehen</h3><div class="rows">
<div><span>zur Verfügung stellen / stehen</span><span>make available / be available</span></div>
<div><span>in Frage stellen</span><span>doubt, question</span></div>
<div><span>einen Antrag stellen</span><span>apply (beantragen)</span></div>
<div><span>in Rechnung stellen</span><span>invoice (berechnen)</span></div>
<div><span>unter Druck stehen</span><span>be under pressure</span></div>
<div><span>zur Diskussion stehen</span><span>be under discussion</span></div></div></div>
<div class="tc df"><h3>nehmen · geben</h3><div class="rows">
<div><span>Stellung nehmen zu</span><span>comment on (sich äußern)</span></div>
<div><span>Rücksicht nehmen auf</span><span>be considerate of</span></div>
<div><span>in Anspruch nehmen</span><span>make use of (nutzen)</span></div>
<div><span>Bezug nehmen auf</span><span>refer to (sich beziehen)</span></div>
<div><span>in Auftrag geben</span><span>commission (beauftragen)</span></div>
<div><span>Auskunft geben</span><span>inform (informieren)</span></div></div></div>
<div class="tc df"><h3>kommen · bringen · finden</h3><div class="rows">
<div><span>zur Sprache kommen / bringen</span><span>be discussed / raise</span></div>
<div><span>zum Ausdruck kommen / bringen</span><span>be expressed / express</span></div>
<div><span>in Frage / Betracht kommen</span><span>be an option</span></div>
<div><span>zu Ende bringen</span><span>finish (beenden)</span></div>
<div><span>Anwendung finden</span><span>be applied (angewendet werden)</span></div>
<div><span>Zustimmung finden</span><span>be approved</span></div></div><p class="tline">kommen and finden often have a passive meaning.</p></div>
<div class="tc df"><h3>treffen · ergreifen · führen</h3><div class="rows">
<div><span>eine Entscheidung treffen</span><span>entscheiden</span></div>
<div><span>eine Vereinbarung treffen</span><span>vereinbaren</span></div>
<div><span>Maßnahmen ergreifen</span><span>handeln</span></div>
<div><span>ein Gespräch führen</span><span>sprechen</span></div>
<div><span>zur Folge haben</span><span>bewirken</span></div></div></div>`};

/* ===== Nominalstil & Partizipien ===== */

<div class="tc df"><h3>Partizip I und II</h3><div class="rows"><div><span>Partizip I</span><span>Infinitiv + d · active, at the same time: die steigenden Preise, ein schlafendes Kind</span></div><div><span>Partizip II</span><span>passive or finished: das renovierte Haus, die abgeschlossene Planung</span></div><div><span>zu + Partizip I</span><span>must / can be done: die zu prüfenden Unterlagen, ein nicht zu unterschätzendes Risiko</span></div></div><p class="tline">The participle takes normal adjective endings.</p></div>
<div class="tc df"><h3>Nebensatz → Nomen</h3><div class="rows">
<div><span>weil</span><span>wegen / aufgrund + Gen: wegen des Regens</span></div>
<div><span>obwohl</span><span>trotz + Gen: trotz der Kälte</span></div>
<div><span>wenn</span><span>bei + Dat: bei Regen</span></div>
<div><span>nachdem</span><span>nach + Dat: nach seiner Ankunft</span></div>
<div><span>bevor</span><span>vor + Dat: vor Beginn des Projekts</span></div>
<div><span>während</span><span>während + Gen: während der Planung</span></div>
<div><span>um … zu</span><span>zu / zur / zum: zur Renovierung des Hauses</span></div>
<div><span>dass</span><span>Nomen: Er bestätigte, dass er kommt → Er bestätigte sein Kommen.</span></div></div></div>
<div class="tc df"><h3>Wie aus Verben Nomen werden</h3><div class="rows">
<div><span>-ung</span><span>planen → die Planung, prüfen → die Prüfung, renovieren → die Renovierung</span></div>
<div><span>Infinitiv</span><span>das Reiten, das Zeichnen, das Kommen</span></div>
<div><span>Stamm</span><span>beginnen → der Beginn, ankommen → die Ankunft, abfahren → die Abfahrt</span></div>
<div><span>-e / -nis</span><span>suchen → die Suche, ergeben → das Ergebnis</span></div></div></div>`};

 th:`<div class="tc df"><h3>nicht oder kein? <small>A1</small></h3><p class="tline"><b>kein</b> = no, not a · <b>nicht</b> = not. English says „not“ for both.</p>
<div class="nt"><div class="hd"><span>Verneint wird</span><span>Wort</span><span>Beispiel</span></div>
<div><span>Nomen mit <i>ein</i> oder ohne Artikel</span><span class="k">kein</span><span>Ich habe <b>kein</b> Auto.<br>Ich trinke <b>keinen</b> Kaffee.</span></div>
<div><span>alles andere: Verb, Adjektiv, <i>der</i>, <i>mein</i>, Namen</span><span class="g">nicht</span><span>Ich kenne den Mann <b>nicht</b>.<br>Das ist <b>nicht</b> mein Auto.<br>Er ist <b>nicht</b> müde.</span></div></div></div>
<div class="tc df"><h3>Wo steht nicht? <small>A2</small></h3>${D("Ich~s|habe~v|den Plan|nicht~ng|gesehen~v|.~p","1-4a:Satzklammer")}<p class="tline">Whole sentence: as late as possible, but before Verb 2.</p>
<div class="nt" style="--nc:8.2em minmax(0,1fr)"><div class="hd"><span>nicht steht …</span><span>Beispiel</span></div>
<div><span>vor Verb 2</span><span>Ich habe ihn <b>nicht</b> gefragt.</span></div>
<div><span>vor dem Präfix</span><span>Ich rufe dich <b>nicht</b> an.</span></div>
<div><span>vor dem Adjektiv</span><span>Das Haus ist <b>nicht</b> groß.</span></div>
<div><span>vor Ort, Richtung</span><span>Ich fahre <b>nicht</b> nach Wien.</span></div>
<div><span>nach Zeit, Objekt</span><span>Ich sehe ihn heute <b>nicht</b>.</span></div></div></div>
<div class="tc df"><h3>kein · Formen <small>A1–A2</small></h3><div class="box" role="img" aria-label="kein nach Fall und Genus">
<span class="bh"></span><span class="bh">mask.</span><span class="bh">neutr.</span><span class="bh">fem.</span><span class="bh">Plural</span>
<span class="bl" style="grid-row:2">Nom</span><span class="bl" style="grid-row:3">Akk</span><span class="bl" style="grid-row:4">Dat</span><span class="bl" style="grid-row:5">Gen</span>
<b class="c nom" style="grid-area:2/2/3/3">kein</b><b class="c akk" style="grid-area:3/2/4/3">keinen</b>
<b class="c same" style="grid-area:2/3/4/4">kein</b><b class="c same" style="grid-area:2/4/4/5">keine</b><b class="c same" style="grid-area:2/5/4/6">keine</b>
<b class="c dat" style="grid-area:4/2/5/4">keinem</b><b class="c dat" style="grid-area:4/4/5/5">keiner</b><b class="c dat" style="grid-area:4/5/5/6">keinen <small>+n</small></b>
<b class="c gen" style="grid-area:5/2/6/4">keines</b><b class="c gen" style="grid-area:5/4/6/6">keiner</b></div>
<p class="tline">Like ein, plus a plural. Only <b>keinen</b> (Akk. mask.) differs from the Nominativ.</p></div>
<div class="tc df"><h3>doch, nichts, nie <small>A2</small></h3>
<div class="nt" style="--nc:6.4em 6em minmax(0,1fr)"><div class="hd"><span>Wort</span><span>English</span><span>Beispiel</span></div>
<div><span class="k">doch</span><span>yes (after a no)</span><span>Kommst du nicht? – <b>Doch!</b></span></div>
<div><span class="g">nichts</span><span>nothing</span><span>Ich habe <b>nichts</b> gehört.</span></div>
<div><span class="g">nie</span><span>never</span><span>Er ist <b>nie</b> pünktlich.</span></div>
<div><span class="g">niemand</span><span>nobody</span><span><b>Niemand</b> hat angerufen.</span></div>
<div><span class="g">nirgends</span><span>nowhere</span><span>Ich finde den Schlüssel <b>nirgends</b>.</span></div>

   $("stage").innerHTML='<div class="pict hide"><b>'+esc(q.n)+'</b><span class="case">→ '+esc(q.cs)+'</span></div>';},
