<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1160" width="800" height="1160" font-family="Carlito, Calibri, Arial, sans-serif"><rect width="800" height="1160" fill="#fff"/><text x="36" y="66" font-size="46" fill="#e30613" font-weight="700" text-anchor="start" >Fellfarben beim Pferd</text><text x="36" y="106" font-size="23" fill="#6b6b6b" font-weight="400" text-anchor="start" >Auswahl · oben Mähne und Schweif, in der Mitte das Fell,</text><text x="36" y="136" font-size="23" fill="#6b6b6b" font-weight="400" text-anchor="start" >unten die Beine.</text><rect x="36" y="170" width="352" height="270" fill="#f4f4f2"/><rect x="54" y="188" width="316" height="130" fill="#1d1b1b" stroke="#bdbdbd" stroke-width="1.2"/><rect x="54" y="188" width="316" height="32" fill="#1d1b1b" stroke="#bdbdbd" stroke-width="1.2"/><rect x="54" y="290" width="316" height="28" fill="#1d1b1b" stroke="#bdbdbd" stroke-width="1.2"/><text x="54" y="358" font-size="32" fill="#e30613" font-weight="700" text-anchor="start" >Rappe</text><text x="54" y="386" font-size="21" fill="#111" font-weight="400" text-anchor="start" >ganz schwarz</text><rect x="412" y="170" width="352" height="270" fill="#f4f4f2"/><rect x="430" y="188" width="316" height="130" fill="#6b3f26" stroke="#bdbdbd" stroke-width="1.2"/><rect x="430" y="188" width="316" height="32" fill="#1d1b1b" stroke="#bdbdbd" stroke-width="1.2"/><rect x="430" y="290" width="316" height="28" fill="#1d1b1b" stroke="#bdbdbd" stroke-width="1.2"/><text x="430" y="358" font-size="32" fill="#e30613" font-weight="700" text-anchor="start" >Brauner</text><text x="430" y="386" font-size="21" fill="#111" font-weight="400" text-anchor="start" >braunes Fell, schwarze Mähne,</text><text x="430" y="411" font-size="21" fill="#111" font-weight="400" text-anchor="start" >Schweif und Beine</text><rect x="36" y="462" width="352" height="270" fill="#f4f4f2"/><rect x="54" y="480" width="316" height="130" fill="#b5622b" stroke="#bdbdbd" stroke-width="1.2"/><rect x="54" y="480" width="316" height="32" fill="#c98a4a" stroke="#bdbdbd" stroke-width="1.2"/><rect x="54" y="582" width="316" height="28" fill="#b5622b" stroke="#bdbdbd" stroke-width="1.2"/><text x="54" y="650" font-size="32" fill="#e30613" font-weight="700" text-anchor="start" >Fuchs</text><text x="54" y="678" font-size="21" fill="#111" font-weight="400" text-anchor="start" >rotbraunes Fell, Mähne und</text><text x="54" y="703" font-size="21" fill="#111" font-weight="400" text-anchor="start" >Schweif rot bis hellblond</text><rect x="412" y="462" width="352" height="270" fill="#f4f4f2"/><rect x="430" y="480" width="316" height="130" fill="#e6e4df" stroke="#bdbdbd" stroke-width="1.2"/><rect x="430" y="480" width="316" height="32" fill="#d5d2cb" stroke="#bdbdbd" stroke-width="1.2"/><rect x="430" y="582" width="316" height="28" fill="#e6e4df" stroke="#bdbdbd" stroke-width="1.2"/><text x="430" y="650" font-size="32" fill="#e30613" font-weight="700" text-anchor="start" >Schimmel</text><text x="430" y="678" font-size="21" fill="#111" font-weight="400" text-anchor="start" >wird mit den Jahren weiß,</text><text x="430" y="703" font-size="21" fill="#111" font-weight="400" text-anchor="start" >Fohlen werden dunkel geboren</text><rect x="36" y="754" width="352" height="270" fill="#f4f4f2"/><rect x="54" y="772" width="316" height="130" fill="#d0a96a" stroke="#bdbdbd" stroke-width="1.2"/><rect x="54" y="772" width="316" height="32" fill="#2a2420" stroke="#bdbdbd" stroke-width="1.2"/><rect x="54" y="874" width="316" height="28" fill="#7a6a58" stroke="#bdbdbd" stroke-width="1.2"/><rect x="54" y="804" width="316" height="7" fill="#2a2420"/><text x="54" y="942" font-size="32" fill="#e30613" font-weight="700" text-anchor="start" >Falbe</text><text x="54" y="970" font-size="21" fill="#111" font-weight="400" text-anchor="start" >sandfarben, dunkler Aalstrich</text><text x="54" y="995" font-size="21" fill="#111" font-weight="400" text-anchor="start" >auf dem Rücken, dunkle Mähne</text><rect x="412" y="754" width="352" height="270" fill="#f4f4f2"/><rect x="430" y="772" width="316" height="130" fill="#d9a441" stroke="#bdbdbd" stroke-width="1.2"/><rect x="430" y="772" width="316" height="32" fill="#f3ead0" stroke="#bdbdbd" stroke-width="1.2"/><rect x="430" y="874" width="316" height="28" fill="#d9a441" stroke="#bdbdbd" stroke-width="1.2"/><text x="430" y="942" font-size="32" fill="#e30613" font-weight="700" text-anchor="start" >Palomino</text><text x="430" y="970" font-size="21" fill="#111" font-weight="400" text-anchor="start" >goldgelb, Mähne und Schweif</text><text x="430" y="995" font-size="21" fill="#111" font-weight="400" text-anchor="start" >fast weiß</text><text x="36" y="1066" font-size="22" fill="#6b6b6b" font-weight="400" text-anchor="start" >Dazu kommen Schecken (weiße und farbige Flecken) und</text><text x="36" y="1094" font-size="22" fill="#6b6b6b" font-weight="400" text-anchor="start" >viele Mischformen. Die Farben sind Näherungen.</text><text x="764" y="1140" text-anchor="end" font-size="20" fill="#6b6b6b">© Steuart JM HARRISON (steux) · eigene Zeichnung</text></svg>